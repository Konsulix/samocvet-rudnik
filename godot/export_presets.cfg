[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/ios/rudnik.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; the build is left unsigned on purpose: Sideloadly signs it on the PC with your own Apple ID
application/app_store_team_id="ABCDE12345"
application/export_project_only=true
application/bundle_identifier="com.konsulix.samocvet"
application/signature="????"
application/short_version="0.1.0"
application/version="2"
application/targeted_device_family=0
icons/icon_1024x1024="res://icon.png"
icons/app_store_1024x1024="res://icon.png"
application/export_method_debug=1
application/export_method_release=1
capabilities/access_wifi=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""
; the launch screen: plain dark, the colour of the loading screen that follows (no logo to go blurry)
storyboard/image_scale_mode=0
storyboard/custom_image@2x="res://assets/ui/splash.png"
storyboard/custom_image@3x="res://assets/ui/splash.png"
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.051, 0.071, 0.106, 1)
; Godot 4.7.2 iOS shader baking hides runtime UI panels/text (godotengine/godot#124088).
; Compile on-device until the engine fix is available and verified on iPhone.
shader_baker/enabled=false
