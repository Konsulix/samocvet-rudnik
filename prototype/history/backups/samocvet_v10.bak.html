<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Самоцветный рудник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one-screen mobile game. Home = the mine you rebuild + a big level button; play = goals bar, board, boosters; overlays for results, stone choice and reveal. */
:root{
  --bg:#0e1420; --bg2:#172133; --panel:#1d2a40; --line:#2e4160;
  --fg:#f4efe4; --muted:#93a2b8; --gold:#f5c04a; --gold2:#c98a1c; --ruby:#e8344e; --good:#46d38a;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html, body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -20%, #24324d 0%, var(--bg) 60%) fixed, var(--bg);color:var(--fg);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
/* resource pills */
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-block:10px 6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(10,16,26,.7);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-variant-numeric:tabular-nums;font-size:14px}
.pill .ic{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-size:13px}
.ic.coin{background:radial-gradient(circle at 35% 30%, #ffe9a0, #e3a51e 60%, #a8700c);color:#6a4204;font-family:var(--display);font-size:11px}
.ic.star{background:radial-gradient(circle at 35% 30%, #fff3b0, #f5c04a 60%, #b8800c);color:#7a4c00}
.ic.heart{background:radial-gradient(circle at 35% 30%, #ff9aa8, #e8344e 60%, #8e1028);color:#fff}
.pill small{font-size:11px;color:var(--muted);font-weight:700}
/* home */
#home .title{font-family:var(--display);font-weight:900;font-size:clamp(17px, 5.6vw, 22px);letter-spacing:.02em;text-align:center;margin:6px 0 2px;text-wrap:balance}
#home .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0b0f17}
.scene svg{width:100%;height:100%;display:block}
.scene [data-band]{cursor:pointer}
.scene [data-band]:hover .bandHi{opacity:.5}
.build-pop{animation:buildpop .7s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes buildpop{from{transform:scale(.2);opacity:0}}
#home > :not(.scene){position:relative;z-index:1}
#home .title, #home .sub, #home .bar{pointer-events:none}
#home .bar > *, #home .sub .depthchip{pointer-events:auto}
#home .title{text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.8)}
#home .sub{color:#d8e0ee;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.home-actions{display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:8px 6px;margin-top:auto}
.tasks-btn{display:flex;align-items:center;gap:10px;background:rgba(14,20,32,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 14px;width:min(100%,420px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tasks-btn b{font-size:14px}
.tasks-btn span{margin-left:auto;color:var(--gold);font-family:var(--display);font-size:13px}
.tasks-bar{height:8px;border-radius:4px;background:#0b111b;overflow:hidden;width:100%;margin-top:4px}
.tasks-bar i{display:block;height:100%;background:linear-gradient(90deg,#e3a51e,#ffe08a)}
.play{position:relative;width:min(100%,420px);border-radius:20px;padding:14px 12px 12px;background:linear-gradient(#7ee08a,#2fae55 55%,#1d7c3a);color:#06260f;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.2), 0 6px 0 #0f4a22, 0 14px 30px rgba(46,174,85,.35);overflow:hidden;transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #0f4a22}
.play small{display:block;font-family:var(--body);font-size:13px;font-weight:800;opacity:.8;letter-spacing:0}
.play .vein{position:absolute;top:6px;right:8px;font-family:var(--body);font-size:11px;background:#2a1640;color:#e5c8ff;border-radius:999px;padding:2px 8px}
.play::after{content:"";position:absolute;inset:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{55%,100%{left:130%}}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-block:8px 10px}
#home .nav{margin-inline:-12px;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;background:linear-gradient(#1c2638,#111827);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 24px rgba(0,0,0,.45)}
#home .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:6px 0 5px;font-size:12px;color:#9fb0c8}
#home .nav button svg{width:26px;height:26px}
#home .nav button.on{background:linear-gradient(#2c3c5a,#1e2a42);color:#ffd77a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 -3px 0 #e3a51e inset}
.nav button{border-radius:14px;padding:9px 0;background:var(--panel);border:1px solid var(--line);font-size:13px}
.nav button.on{border-color:var(--gold);color:var(--gold)}
/* play */
#gameBg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#gameBg svg{width:100%;height:100%;display:block}
#game > :not(#gameBg){position:relative;z-index:1}
#game .hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:6px 8px}
.goals{position:relative;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap;padding:7px 16px;border-radius:10px;
  background:repeating-linear-gradient(176deg, rgba(0,0,0,0) 0 7px, rgba(0,0,0,.07) 7px 8px), linear-gradient(#94622f,#6a4220 60%,#5a3618);
  border:2px solid #3a2410;box-shadow:inset 0 2px 0 rgba(255,220,160,.25), inset 0 -3px 0 rgba(0,0,0,.25), 0 5px 0 #24160a, 0 10px 18px rgba(0,0,0,.45)}
.goals::before, .goals::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #e8e2d4, #7a7468 60%, #3a362e)}
.goals::before{left:5px}.goals::after{right:5px}
.goals .goal b{color:#fff4dc;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.goal{position:relative;display:flex;align-items:center;gap:2px}
.goal canvas{width:34px;height:34px}
.goal b{font-family:var(--display);font-size:15px;min-width:22px;font-variant-numeric:tabular-nums}
.goal.done b{color:var(--good)}
.goal.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.25)}}
.moves{display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;padding:0;
  background:radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.25) 59%, transparent 62%), radial-gradient(circle at 35% 28%, #fff0b0, #e0aa30 45%, #9a6810 80%, #5a3a06);
  border:3px solid #4a3006;box-shadow:inset 0 3px 2px rgba(255,255,255,.45), inset 0 -4px 4px rgba(0,0,0,.35), 0 5px 0 #2a1a04, 0 10px 20px rgba(0,0,0,.45), 0 0 26px rgba(255,200,90,.25)}
.moves small{font-size:9px;color:#5a3604;text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.moves b{font-family:var(--display);font-size:27px;line-height:1;color:#3a2200;text-shadow:0 1px 0 rgba(255,240,190,.7);font-variant-numeric:tabular-nums}
.moves.low{box-shadow:inset 0 3px 2px rgba(255,255,255,.45), inset 0 -4px 4px rgba(0,0,0,.35), 0 5px 0 #2a1a04, 0 0 30px rgba(255,70,70,.7)}
.moves.low b{color:#a80e1c;animation:bump .6s infinite}
.lvl-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#e8d8bc;padding-top:6px}
#lvlName{background:rgba(12,10,8,.6);border:1px solid rgba(255,210,122,.25);border-radius:999px;padding:4px 12px;backdrop-filter:blur(4px)}
.lvl-h .x{width:34px;height:34px;border-radius:10px;background:rgba(12,10,8,.6);border:1px solid rgba(255,210,122,.25);font-size:16px}
.board-wrap{flex:1;min-height:0;display:grid;place-items:center}
#board{display:block;touch-action:none;border-radius:18px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.65))}
.boosters{position:relative;display:flex;gap:14px;justify-content:center;padding-block:8px 16px}
.boosters::before{content:"";position:absolute;left:50%;bottom:8px;width:min(92%,300px);height:16px;transform:translateX(-50%);border-radius:4px;z-index:-1;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 22px, rgba(0,0,0,.08) 22px 23px), linear-gradient(#8a5a2c,#5a3618);border:2px solid #3a2410;box-shadow:0 6px 12px rgba(0,0,0,.5)}
.boost{position:relative;width:64px;height:64px;border-radius:18px;background:radial-gradient(circle at 40% 30%, #3a4a62, #1a2232 70%);border:2px solid #6a5a3a;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 4px 0 #0a0c10}
.boost canvas{width:44px;height:44px}
.boost .n{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--ruby);font-size:12px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.boost .n.buy{background:var(--gold2);font-size:10px}
.boost.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,192,74,.4), 0 4px 0 #0a1019}
.hint{text-align:center;font-size:12px;color:var(--gold);min-height:1.2em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.cheer{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:45;font-family:var(--display);font-weight:900;font-size:34px;color:#fff;text-shadow:0 3px 0 #7a3a00, 0 0 24px rgba(255,190,80,.8);pointer-events:none;animation:cheer 1s ease-out forwards;white-space:nowrap}
@keyframes cheer{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,9,15,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(100%,400px);max-height:100%;overflow:auto;background:linear-gradient(#22324e,#152034);border:1px solid var(--line);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:cardin .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.card h2{margin:0;font-family:var(--display);font-weight:900;font-size:24px;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.btn{width:100%;border-radius:16px;padding:12px;font-family:var(--display);font-weight:700;font-size:16px;background:linear-gradient(#ffd77a,#e3a51e 60%,#b87a10);color:#3a2200;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 5px 0 #7a4c08}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4c08}
.btn.green{background:linear-gradient(#7ee08a,#2fae55 60%,#1d7c3a);color:#06260f;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 5px 0 #0f4a22}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);box-shadow:none;font-family:var(--body);font-weight:800}
.btn:disabled{opacity:.45}
.btn small{display:block;font-family:var(--body);font-size:12px;font-weight:800;opacity:.75}
.reward{display:flex;gap:10px;justify-content:center}
.stars3{font-size:44px;line-height:1;filter:drop-shadow(0 4px 10px rgba(245,192,74,.5))}
/* stone choice */
.nodules{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nod{width:92px;height:92px;border-radius:20px;background:radial-gradient(circle at 50% 40%, #2c3d5c, #121b2b);border:1px solid var(--line);display:grid;place-items:center;position:relative;animation:nodin .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms)}
.nod img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));animation:wob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
@keyframes nodin{from{transform:translateY(30px) scale(.6);opacity:0}}
@keyframes wob{50%{transform:translateY(-4px) rotate(-3deg)}}
.reveal{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.reveal .nod-big{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.65))}
.reveal.hit .nod-big{animation:hit .22s}
@keyframes hit{40%{transform:scale(.93) rotate(-3deg)}}
.reveal svg{position:absolute;inset:8%;width:84%;height:84%;pointer-events:none}
.reveal svg path{stroke:#ffe6a8;stroke-width:1.8;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 4px #ffcf6a)}
.spec-host{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.spec-host canvas{width:100%;height:100%;display:block;border-radius:22px}
.label{width:100%;background:#e9dfc8;color:#2a2218;border-radius:6px;padding:10px 12px;text-align:left;font-family:var(--body);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.label .rar{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.label h3{margin:2px 0 4px;font-family:var(--display);font-size:20px;color:#1d160e}
.label .row{display:flex;justify-content:space-between;font-size:13px;color:#5a4a34}
.label .row b{color:#1d160e}
.label .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.label .tr span{font-size:11px;background:rgba(42,34,24,.12);border-radius:999px;padding:2px 8px}
.label .tr span.rare{background:linear-gradient(90deg,#ffd27a,#ff9ad8,#9ad0ff)}
.missed{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.missed span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
/* collection & tasks */
.list{display:flex;flex-direction:column;gap:8px;width:100%}
.task{display:flex;align-items:center;gap:10px;background:#111a29;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left}
.task b{font-size:14px}
.task p{font-size:12px;margin:0}
.task .go{margin-left:auto;flex:none;border-radius:12px;padding:8px 12px;background:linear-gradient(#ffd77a,#e3a51e);color:#3a2200;font-family:var(--display);font-size:13px;box-shadow:0 3px 0 #7a4c08}
.task .go:disabled{background:#2a3548;color:var(--muted);box-shadow:none}
.task.done{opacity:.55}
#tech{background:radial-gradient(ellipse 120% 45% at 50% 0%, rgba(242,176,30,.14), transparent 60%), repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 34px), repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 34px), linear-gradient(#1a1e24, #0c0e12 75%)}
#tech .wrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-block:4px 12px}
#tech h2{font-family:var(--display);font-size:20px;margin:6px 0 0}
.tsub2{color:#c8b090;font-size:12.5px;margin-top:-6px}
.stage{position:relative;width:min(100%, 40vh);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;border:2px solid #3a3a30;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.stage .hazard{position:absolute;left:0;right:0;bottom:0;height:12px;z-index:2;background:repeating-linear-gradient(-45deg, #f2b01e 0 12px, #1a1a1a 12px 24px);opacity:.9}
.stage .owned{position:absolute;top:10px;left:10px;z-index:2;font-size:12px;background:#1f6a2a;color:#d8ffd8;border-radius:999px;padding:3px 10px}
.tinfo{background:rgba(0,0,0,.4);border:1px solid #3a3a30;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tinfo .tn{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tinfo .tn b{font-family:var(--display);font-size:17px;color:#ffe08a}
.tinfo .tn span{color:#c8b090;font-size:12.5px}
.tinfo p{margin:0;font-size:13px;color:#d8d0c0}
.tinfo .fx{display:flex;flex-wrap:wrap;gap:5px}
.tinfo .fx span{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid #4a4a3a;color:#e8d8bc}
.tinfo .fx span.bad{border-color:#7a3a2a;color:#ffb0a0}
.tinfo .fx span.good{border-color:#3a6a3a;color:#b0ffb0}
.pips{display:flex;gap:5px}.pips i{width:22px;height:8px;border-radius:4px;background:#2a2a24;border:1px solid #4a4a3a}.pips i.on{background:linear-gradient(#ffe08a,#e3a51e);border-color:#e3a51e}
.tstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.tcard{flex:none;width:96px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 5px 7px;border-radius:14px;background:rgba(0,0,0,.45);border:2px solid #2e2e28;text-align:center}
.tcard img{width:84px;height:84px;border-radius:10px;background:#05070a}
.tcard b{font-size:11px;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.tcard small{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px}
.tcard small.own{background:#1f5a24;color:#c8ffc8}.tcard small.buy{background:#e3a51e;color:#2a1a04}.tcard small.lock{background:#2a2a24;color:#8a8270}
.tcard.on{border-color:#e3a51e;box-shadow:0 0 0 3px rgba(227,165,30,.25)}
.tcard.lockd img{filter:grayscale(.8) brightness(.6)}
#coll{background:radial-gradient(ellipse 120% 50% at 50% -8%, rgba(255,200,120,.16), transparent 60%), repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 46px, rgba(0,0,0,.18) 46px 48px), linear-gradient(#24170e, #120c08 70%)}
#coll .wrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-block:4px 12px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstats div{background:rgba(0,0,0,.35);border:1px solid rgba(227,165,30,.3);border-radius:12px;padding:6px 4px;text-align:center}
.mstats b{display:block;font-family:var(--display);font-size:15px;color:#ffd77a}
.mstats small{font-size:10.5px;color:#c8b090;text-transform:uppercase;letter-spacing:.06em}
.ctabs.three{grid-template-columns:1fr 1fr 1fr}
.sortrow{display:flex;gap:6px}
.sortrow button{font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid rgba(227,165,30,.3);color:#c8b090;background:rgba(0,0,0,.3)}
.sortrow button.on{background:#e3a51e;color:#2a1a04;border-color:#e3a51e}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cases.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.case{position:relative;display:flex;flex-direction:column;padding:6px 6px 0;border-radius:14px;overflow:hidden;text-align:center;
  background:linear-gradient(#0b0d12,#06070a);border:1px solid #4a3a22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 8px 18px rgba(0,0,0,.55)}
.case::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;background:linear-gradient(115deg, rgba(255,255,255,.1) 0 18%, transparent 30% 100%)}

function levelDef(n){
  if (n <= LEVELS.length) return LEVELS[n - 1];
  // beyond the hand-made ones: remix a layout, a little tighter each time
  const base = LEVELS[3 + (n * 7) % (LEVELS.length - 3)];

}

    : {sky:['#1d2a46', '#0e1626'], far:'#3a4660', mid:'#2a2a34', near:['#5a4a3e', '#2c241e'], soil:'#3a2e24', rock:['#4a3c32', '#1c1612'], tree:'#151c22'};
  const sp = Object.entries(AREAS[ai].pool).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => '#' + SP[k].c.toString(16).padStart(6, '0'));
  const ridge = (x, base, a1, a2, ph) => base + Math.sin(x * .021 + ph) * a1 + Math.sin(x * .057 + ph * 2) * a2;
  const ridgePath = (base, a1, a2, ph) => { let d = `M0 ${G0 + 4}`; for (let x = 0; x <= W; x += 12) d += ` L${x} ${ridge(x, base, a1, a2, ph).toFixed(1)}`; return d + ` L${W} ${G0 + 4}Z`; };
  // pines along the middle ridge
  const pines = fire ? '' : Array.from({length:34}, () => { const x = rng() * W, y = ridge(x, 128, 14, 7, 2.2) + 4 + rng() * 10, h = 9 + rng() * 9, w = h * .36;
    return `<path d="M${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x + w).toFixed(1)} ${(y - h * .35).toFixed(1)} L${(x + w * .55).toFixed(1)} ${(y - h * .38).toFixed(1)} L${(x + w * 1.25).toFixed(1)} ${y.toFixed(1)} L${(x - w * 1.25).toFixed(1)} ${y.toFixed(1)} L${(x - w * .55).toFixed(1)} ${(y - h * .38).toFixed(1)} L${(x - w).toFixed(1)} ${(y - h * .35).toFixed(1)}Z"/>`; }).join('');
  const stars = Array.from({length:40}, (_, k) => { const x = rng() * W, y = -OFF + rng() * (90 + OFF), r = rng() < .2 ? 1.3 : .7;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}">${k % 3 === 0 ? `<animate attributeName="opacity" values="1;.2;1" dur="${(2 + rng() * 3).toFixed(1)}s" begin="${(rng() * 3).toFixed(1)}s" repeatCount="indefinite"/>` : ''}</circle>`; }).join('');
  const crows = Array.from({length:2}, (_, k) => { const y = 64 + rng() * 40, d = 38 + rng() * 20;
    return `<g><animateTransform attributeName="transform" type="translate" values="-30 ${y.toFixed(0)};${W + 30} ${(y - 20).toFixed(0)}" dur="${d.toFixed(0)}s" begin="${-k * 17}s" repeatCount="indefinite"/><path d="M-5 0 Q-2.5 -3 0 0 Q2.5 -3 5 0" stroke="#0a0c10" stroke-width="1.4" fill="none"><animate attributeName="d" values="M-5 0 Q-2.5 -3 0 0 Q2.5 -3 5 0;M-5 -1 Q-2.5 1 0 0 Q2.5 1 5 -1;M-5 0 Q-2.5 -3 0 0 Q2.5 -3 5 0" dur=".9s" repeatCount="indefinite"/></path></g>`; }).join('');
  const sky = fire
    ? `<path d="${ridgePath(150, 6, 4, .4)}" fill="${pal.far}"/><path d="M118 156 L168 52 L192 52 L246 156Z" fill="#2a1410"/><ellipse cx="180" cy="52" rx="14" ry="4" fill="#ff8a2a"/>
      <circle cx="180" cy="44" r="46" fill="url(#scGlow)" opacity=".55"><animate attributeName="opacity" values=".45;.7;.45" dur="3s" repeatCount="indefinite"/></circle>
      <path d="M176 56 Q168 90 182 112 Q192 132 178 156" stroke="#ff6a1a" stroke-width="3.5" fill="none" opacity=".9"/><path d="M188 58 Q200 84 194 108" stroke="#ffb03a" stroke-width="2" fill="none" opacity=".8"/>
      <g fill="#6a5a58" opacity=".5">${[0, 1, 2].map(k => `<circle cx="${178 + k * 6}" cy="40" r="${10 + k * 4}"><animate attributeName="cy" values="40;${-10 - k * 8}" dur="${6 + k * 2}s" begin="${k * 2}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="${6 + k * 2}s" begin="${k * 2}s" repeatCount="indefinite"/></circle>`).join('')}</g>
      <g fill="#ffb03a">${Array.from({length:14}, () => { const x = rng() * W; return `<circle cx="${x.toFixed(0)}" cy="0" r="${(.6 + rng()).toFixed(1)}"><animate attributeName="cy" values="${(rng() * 60).toFixed(0)};210" dur="${(5 + rng() * 6).toFixed(1)}s" begin="${(rng() * 6).toFixed(1)}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="${(5 + rng() * 6).toFixed(1)}s" repeatCount="indefinite"/></circle>`; }).join('')}</g>`
    : `<circle cx="292" cy="48" r="38" fill="url(#scMoon)"/><circle cx="292" cy="48" r="13" fill="#f4ecd8"/><circle cx="287" cy="44" r="3" fill="#d8cfb8" opacity=".6"/><circle cx="296" cy="52" r="2" fill="#d8cfb8" opacity=".5"/>
      ${cu ? `<path d="M-10 70 Q60 30 130 62 T260 50 T380 60" stroke="#3fe0a0" stroke-width="16" fill="none" opacity=".18" filter="url(#scBlur)"><animate attributeName="opacity" values=".1;.28;.1" dur="7s" repeatCount="indefinite"/></path>

      <path d="${ridgePath(108, 22, 10, .9)}" fill="${pal.far}"/>
      <path d="${(() => { let d = ''; for (let x = 0; x <= W; x += 12) { const y = ridge(x, 108, 22, 10, .9); if (y < 96) d += `M${x - 7} ${(y + 7).toFixed(1)} L${x} ${y.toFixed(1)} L${x + 7} ${(y + 7).toFixed(1)}Z `; } return d; })()}" fill="#dfe6f0" opacity=".55"/>`;
  // underground horizons
  const bands = DEPTHS.map((D, k) => {
    const y = B0 + k * BH, open = k <= dOpen, sel = k === dSel, next = k === dOpen + 1, t = k / (DEPTHS.length - 1);
    const top = k ? `M0 ${y} ${Array.from({length:13}, (_, q) => `L${q * 30} ${(y + Math.sin(q * 1.7 + k * 2.3) * 3).toFixed(1)}`).join(' ')} L${W} ${y}` : `M0 ${y} L${W} ${y}`;
    const fill = mixHex(pal.rock[0], fire ? '#3a0c06' : pal.rock[1], t * .75);
    const specks = Array.from({length:22}, () => `<circle cx="${(rng() * W).toFixed(0)}" cy="${(y + 4 + rng() * (BH - 8)).toFixed(0)}" r="${(.6 + rng() * 1.6).toFixed(1)}"/>`).join('');
    const gy = y + BH / 2, gx0 = 46, gx1 = 296;
    let body;
    if (open) {
      const posts = Array.from({length:6}, (_, q) => { const x = gx0 + 12 + q * 44; return `<rect x="${x}" y="${gy - 13}" width="4" height="26" fill="#7a4e26"/><rect x="${x - 4}" y="${gy - 15}" width="12" height="4" fill="#8a5a2c"/>`; }).join('');
      const lamps = Array.from({length:3}, (_, q) => { const x = gx0 + 36 + q * 88; return `<circle cx="${x}" cy="${gy - 6}" r="16" fill="url(#scGlow)" opacity=".55"><animate attributeName="opacity" values=".55;.35;.6;.5" dur="${(1.6 + q * .4).toFixed(1)}s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${gy - 8}" r="2.4" fill="#ffe08a"/>`; }).join('');
      const gems = Array.from({length:7}, (_, q) => { const x = 20 + rng() * 320, yy = y + 6 + rng() * (BH - 12), c = sp[Math.floor(rng() * sp.length)], r = 2.4 + rng() * 2.4;

      const cart = sel ? `<g><animateTransform attributeName="transform" type="translate" values="0 0;150 0;150 0;0 0;0 0" keyTimes="0;.4;.5;.9;1" dur="10s" repeatCount="indefinite"/>

      body = `<rect x="${gx0}" y="${gy - 15}" width="${gx1 - gx0}" height="30" rx="12" fill="url(#scTunnel)"/>${gems}${posts}
        <line x1="${gx0 + 6}" y1="${gy + 13}" x2="${gx1}" y2="${gy + 13}" stroke="#8a96a4" stroke-width="1.2"/>${lamps}${cart}
        ${sel ? `<rect x="${gx0 - 3}" y="${gy - 18}" width="${gx1 - gx0 + 6}" height="36" rx="14" fill="none" stroke="#ffd27a" stroke-width="1.6" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.2s" repeatCount="indefinite"/></rect>` : ''}`;
    } else {
      const lbl = next ? `${D.tool} · ${fmt(depthCost(ai, k))}` : D.tool;
      const wch = lbl.length * 5.4 + 30;
      const eyes = k === DEPTHS.length - 1 ? Array.from({length:2}, (_, q) => { const ex = 70 + q * 170 + rng() * 40, ey = gy + (rng() - .5) * 20, d = (7 + rng() * 6).toFixed(1);
        return `<g opacity="0"><animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;.55;.6;.7;.75;1" dur="${d}s" begin="${(q * 3.1).toFixed(1)}s" repeatCount="indefinite"/><ellipse cx="${ex.toFixed(0)}" cy="${ey.toFixed(0)}" rx="2.2" ry="1.3" fill="#e8d86a"/><ellipse cx="${(ex + 9).toFixed(0)}" cy="${ey.toFixed(0)}" rx="2.2" ry="1.3" fill="#e8d86a"/></g>`; }).join('') : '';
      body = `${eyes}<rect x="${gx0}" y="${gy - 15}" width="${gx1 - gx0}" height="30" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 5"/>
        <g transform="translate(${(gx0 + gx1) / 2} ${gy})"><rect x="${-wch / 2}" y="-11" width="${wch}" height="22" rx="11" fill="${next ? '#3a2a0e' : '#0c1018'}" stroke="${next ? '#e3a51e' : '#2a3442'}"/>

      <path d="${top} L${W} ${y + BH + 4} L0 ${y + BH + 4}Z" fill="${fill}"/><g fill="#000" opacity=".25">${specks}</g>
      ${open ? '' : `<rect x="0" y="${y}" width="${W}" height="${BH}" fill="#000" opacity="${(.25 + t * .3).toFixed(2)}"/>`}
      <rect class="bandHi" x="0" y="${y}" width="${W}" height="${BH}" fill="#ffd27a" opacity="0" style="transition:opacity .2s"/>

      <text x="10" y="${y + 15}" font-size="10" font-weight="800" fill="${open ? '#ffd27a' : '#6a7484'}" font-family="Nunito, sans-serif">${D.m} м</text></g>`;
  }).join('');
  const shaftBot = B0 + dOpen * BH + BH / 2 + 12;
  const shaft = `<rect x="296" y="${G0 - 4}" width="16" height="${shaftBot - G0 + 4}" fill="#0a0806"/><g stroke="#5a3a1c" stroke-width="2">${Array.from({length:Math.floor((shaftBot - G0) / 16)}, (_, q) => `<line x1="296" y1="${G0 + 8 + q * 16}" x2="312" y2="${G0 + 8 + q * 16}"/>`).join('')}</g>
    <rect x="296" y="${shaftBot}" width="16" height="${H - shaftBot}" fill="none" stroke="#fff" stroke-opacity=".1" stroke-dasharray="3 4"/>
    ${has('headframe') ? `<g><animateTransform attributeName="transform" type="translate" values="0 0;0 ${shaftBot - G0 - 22};0 ${shaftBot - G0 - 22};0 0;0 0" keyTimes="0;.42;.5;.92;1" dur="9s" repeatCount="indefinite"/><line x1="304" y1="${G0 - 100}" x2="304" y2="${G0 - 2}" stroke="#9aa6b4" stroke-width="1"/><rect x="298" y="${G0 - 2}" width="12" height="14" rx="1.5" fill="#c8a060" stroke="#4a3418"/></g>` : ''}`;
  return `<svg viewBox="0 0 ${W} ${Hv}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Рудник в разрезе">
  <defs><linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[0]}"/><stop offset="1" stop-color="${pal.sky[1]}"/></linearGradient>
  <linearGradient id="scNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.near[0]}"/><stop offset="1" stop-color="${pal.near[1]}"/></linearGradient>
  <linearGradient id="scMist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[1]}" stop-opacity="0"/><stop offset="1" stop-color="${pal.sky[0]}" stop-opacity=".7"/></linearGradient>
  <linearGradient id="scTunnel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a120c"/><stop offset=".6" stop-color="#2e2014"/><stop offset="1" stop-color="#3a2a1a"/></linearGradient>
  <radialGradient id="scGlow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <radialGradient id="scMoon"><stop offset="0" stop-color="#fff4d8" stop-opacity=".35"/><stop offset="1" stop-color="#fff4d8" stop-opacity="0"/></radialGradient>
  <radialGradient id="scDark" cx=".5" cy=".7"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#1a1410"/></radialGradient>
  <filter id="scBlur"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="scFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f17" stop-opacity="0"/><stop offset=".55" stop-color="#0b0f17" stop-opacity=".7"/><stop offset="1" stop-color="#0b0f17" stop-opacity=".95"/></linearGradient>
  <linearGradient id="scTopFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080e" stop-opacity=".55"/><stop offset="1" stop-color="#05080e" stop-opacity="0"/></linearGradient></defs>
  <g transform="translate(0 ${OFF})">
  <rect y="${-OFF}" width="${W}" height="${G0 + 10 + OFF}" fill="url(#scSky)"/>
  <g fill="#fff" opacity=".6">${stars}</g>

  <rect y="120" width="${W}" height="${G0 - 116}" fill="url(#scMist)"/>
  <path d="M28 ${G0 + 2} Q60 160 104 124 L140 96 Q172 78 208 100 L246 128 Q272 150 286 ${G0 + 2}Z" fill="url(#scNear)"/>
  <path d="M104 124 L140 96 Q172 78 208 100" stroke="#fff" stroke-opacity=".08" stroke-width="2" fill="none"/>
  <rect y="${G0}" width="${W}" height="${B0 - G0 + 2}" fill="${pal.soil}"/>
  <path d="M0 ${G0} ${Array.from({length:19}, (_, q) => `L${q * 20} ${(G0 - 1 - (q % 3)).toFixed(0)}`).join(' ')} L${W} ${G0}" stroke="${fire ? '#4a2a1a' : cu ? '#3f7a4a' : '#5a6a3a'}" stroke-width="3" fill="none"/>
  <path d="M130 ${G0} L130 146 Q160 112 190 146 L190 ${G0}Z" fill="url(#scDark)"/>
  ${has('rubble') ? '' : `<g fill="${fire ? '#3a1a10' : '#7a6a58'}" stroke="${fire ? '#ff6a1a' : '#3a3028'}" stroke-width="1.5"><circle cx="140" cy="194" r="12"/><circle cx="160" cy="190" r="15"/><circle cx="180" cy="195" r="11"/><circle cx="152" cy="180" r="9"/><circle cx="170" cy="176" r="8"/></g>`}
  ${has('timber') ? `<g class="b-timber" fill="#8a5a2c" stroke="#4a2c12" stroke-width="1.5"><rect x="122" y="134" width="11" height="68" rx="2"/><rect x="187" y="134" width="11" height="68" rx="2"/><rect x="116" y="126" width="88" height="12" rx="2"/></g>` : ''}
  ${has('rails') ? `<g class="b-rails" stroke="#9aa6b4" stroke-width="2"><line x1="150" y1="${G0}" x2="138" y2="${B0}"/><line x1="170" y1="${G0}" x2="182" y2="${B0}"/><g stroke="#6a4a2a" stroke-width="3"><line x1="146" y1="${G0 + 4}" x2="174" y2="${G0 + 4}"/><line x1="142" y1="${G0 + 9}" x2="178" y2="${G0 + 9}"/></g></g>` : ''}
  ${has('lamps') ? `<g class="b-lamps"><circle cx="112" cy="138" r="22" fill="url(#scGlow)"><animate attributeName="opacity" values="1;.7;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="208" cy="138" r="22" fill="url(#scGlow)"><animate attributeName="opacity" values=".8;1;.8" dur="1.8s" repeatCount="indefinite"/></circle><rect x="108" y="132" width="8" height="12" rx="2" fill="#ffe08a" stroke="#6a4a1a"/><rect x="204" y="132" width="8" height="12" rx="2" fill="#ffe08a" stroke="#6a4a1a"/></g>` : ''}
  ${has('cart') ? `<g class="b-cart"><path d="M218 180 L262 180 L256 198 L224 198Z" fill="#6a6f7a" stroke="#2a2e36" stroke-width="2"/>${[0, 1, 2].map(q => `<circle cx="${228 + q * 12}" cy="177" r="6" fill="${sp[q % sp.length]}" stroke="#1a1a1a"/>`).join('')}<circle cx="230" cy="200" r="4.5" fill="#2a2e36"/><circle cx="250" cy="200" r="4.5" fill="#2a2e36"/></g>` : ''}
  ${has('headframe') ? `<g class="b-headframe" stroke="${cu ? '#c8783a' : fire ? '#c85a2a' : '#b8a48a'}" stroke-width="3" fill="none"><path d="M288 ${G0} L304 96 L320 ${G0}"/><path d="M294 164 L314 164 M297 132 L311 132 M290 188 L318 188"/><circle cx="304" cy="92" r="11"/><line x1="304" y1="92" x2="276" y2="154"/></g>` : ''}
  ${cu ? `<g fill="#3fbf8a" opacity=".35"><circle cx="60" cy="190" r="5"/><circle cx="80" cy="194" r="4"/><circle cx="330" cy="190" r="5"/></g>` : ''}
  <rect y="${B0 + BH * 5 - 2}" width="${W}" height="${H - B0 - BH * 5 + 2}" fill="${mixHex(pal.rock[1], '#000000', .45)}"/>
  <g fill="#fff" opacity=".05">${Array.from({length:40}, () => `<circle cx="${(rng() * W).toFixed(0)}" cy="${(B0 + BH * 5 + rng() * (H - B0 - BH * 5)).toFixed(0)}" r="${(.6 + rng() * 1.6).toFixed(1)}"/>`).join('')}</g>
  ${fire ? `<path d="M0 ${H - 40} Q90 ${H - 70} 180 ${H - 45} T360 ${H - 50} L360 ${H} L0 ${H}Z" fill="#ff5a1a" opacity=".18" filter="url(#scBlur)"><animate attributeName="opacity" values=".12;.24;.12" dur="5s" repeatCount="indefinite"/></path>` : ''}
  ${bands}
  ${shaft}
  </g>
  <rect width="${W}" height="120" fill="url(#scTopFade)"/>
  <rect y="${Hv - 250}" width="${W}" height="250" fill="url(#scFade)"/></svg>`;
}

// the level backdrop: the face of the gallery you are working, by mine and depth
function gameBgSVG(ai, dl){
  const rng = mulberry(ai * 131 + dl * 17 + 5), W = 400, H = 860, fire = ai === 2, cu = ai === 1, t = dl / 4;
  const wall = fire ? ['#4a2a22', '#24100c'] : cu ? ['#2e4038', '#121a18'] : ['#4e4034', '#1a1410'];
  const top = mixHex(wall[0], '#000000', .25 + t * .3), mid = mixHex(wall[0], fire ? '#5a1a08' : '#000000', t * .35), bot = mixHex(wall[1], '#000000', t * .3);
  const sp = Object.entries(AREAS[ai].pool).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => '#' + SP[k].c.toString(16).padStart(6, '0'));
  const strata = Array.from({length:7}, (_, k) => { const y = 90 + k * 105 + rng() * 30, a = 8 + rng() * 14, ph = rng() * 6;
    let d = `M-10 ${y}`; for (let x = 0; x <= W + 20; x += 20) d += ` L${x} ${(y + Math.sin(x * .015 + ph) * a + x * .06).toFixed(1)}`;
    return `<path d="${d} L${W + 20} ${y + 40 + W * .06} L-10 ${y + 40}Z" fill="${k % 2 ? '#000' : '#fff'}" opacity="${(.03 + rng() * .04).toFixed(3)}"/>`; }).join('');
  const specks = Array.from({length:240}, () => `<circle cx="${(rng() * W).toFixed(0)}" cy="${(rng() * H).toFixed(0)}" r="${(.6 + rng() * 2.2).toFixed(1)}" fill="${rng() < .5 ? '#000' : '#fff'}" opacity="${(.06 + rng() * .14).toFixed(2)}"/>`).join('');
  // crystal pockets in the walls; deeper means more and bigger
  const pockets = Array.from({length:4 + dl * 2}, (_, k) => { const side = k % 2, low = k % 4 > 1, x = low ? 40 + rng() * (W - 80) : side ? W - 50 - rng() * 110 : 50 + rng() * 110, y = low ? 650 + rng() * 70 : 150 + rng() * 60, c = sp[Math.floor(rng() * sp.length)], n = 3 + Math.floor(rng() * 4);
    const shards = Array.from({length:n}, () => { const a = (side ? 200 : -20) + rng() * 140, l = 10 + rng() * (12 + dl * 4), w = 3 + rng() * 3;

const tweens = [];
