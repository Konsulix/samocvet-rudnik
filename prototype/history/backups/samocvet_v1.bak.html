<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Самоцветный рудник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one-screen mobile game. Home = the mine you rebuild + a big level button; play = goals bar, board, boosters; overlays for results, stone choice and reveal. */
:root{
  --bg:#0e1420; --bg2:#172133; --panel:#1d2a40; --line:#2e4160;
  --fg:#f4efe4; --muted:#93a2b8; --gold:#f5c04a; --gold2:#c98a1c; --ruby:#e8344e; --good:#46d38a;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html, body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -20%, #24324d 0%, var(--bg) 60%) fixed, var(--bg);color:var(--fg);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
/* resource pills */
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-block:10px 6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(10,16,26,.7);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-variant-numeric:tabular-nums;font-size:14px}
.pill .ic{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-size:13px}
.ic.coin{background:radial-gradient(circle at 35% 30%, #ffe9a0, #e3a51e 60%, #a8700c);color:#6a4204;font-family:var(--display);font-size:11px}
.ic.star{background:radial-gradient(circle at 35% 30%, #fff3b0, #f5c04a 60%, #b8800c);color:#7a4c00}
.ic.heart{background:radial-gradient(circle at 35% 30%, #ff9aa8, #e8344e 60%, #8e1028);color:#fff}
.pill small{font-size:11px;color:var(--muted);font-weight:700}
/* home */
#home .title{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.02em;text-align:center;margin:6px 0 2px;text-wrap:balance}
#home .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.scene{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.scene svg{width:100%;height:100%;max-height:52vh;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.build-pop{animation:buildpop .7s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes buildpop{from{transform:scale(.2);opacity:0}}
.home-actions{display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:8px 6px}
.tasks-btn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 14px;width:min(100%,420px)}
.tasks-btn b{font-size:14px}
.tasks-btn span{margin-left:auto;color:var(--gold);font-family:var(--display);font-size:13px}
.tasks-bar{height:8px;border-radius:4px;background:#0b111b;overflow:hidden;width:100%;margin-top:4px}
.tasks-bar i{display:block;height:100%;background:linear-gradient(90deg,#e3a51e,#ffe08a)}
.play{position:relative;width:min(100%,420px);border-radius:20px;padding:14px 12px 12px;background:linear-gradient(#7ee08a,#2fae55 55%,#1d7c3a);color:#06260f;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.2), 0 6px 0 #0f4a22, 0 14px 30px rgba(46,174,85,.35);overflow:hidden;transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #0f4a22}
.play small{display:block;font-family:var(--body);font-size:13px;font-weight:800;opacity:.8;letter-spacing:0}
.play .vein{position:absolute;top:6px;right:8px;font-family:var(--body);font-size:11px;background:#2a1640;color:#e5c8ff;border-radius:999px;padding:2px 8px}
.play::after{content:"";position:absolute;inset:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{55%,100%{left:130%}}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px 10px}
.nav button{border-radius:14px;padding:9px 0;background:var(--panel);border:1px solid var(--line);font-size:13px}
.nav button.on{border-color:var(--gold);color:var(--gold)}
/* play */
#game .hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch;padding-block:8px 8px}
.goals{display:flex;gap:6px;align-items:center;background:linear-gradient(#22324e,#172235);border:1px solid var(--line);border-radius:16px;padding:6px 8px;min-width:0;flex-wrap:wrap}
.goal{position:relative;display:flex;align-items:center;gap:2px}
.goal canvas{width:34px;height:34px}
.goal b{font-family:var(--display);font-size:15px;min-width:22px;font-variant-numeric:tabular-nums}
.goal.done b{color:var(--good)}
.goal.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.25)}}
.moves{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#3a2a12,#22180c);border:1px solid #6a4a1c;border-radius:16px;padding:4px 12px;min-width:64px}
.moves small{font-size:10px;color:#d8b278;text-transform:uppercase;letter-spacing:.08em}
.moves b{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.moves.low b{color:#ff6a6a;animation:bump .6s infinite}
.lvl-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.lvl-h .x{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.board-wrap{flex:1;min-height:0;display:grid;place-items:center}
#board{display:block;touch-action:none;border-radius:18px}
.boosters{display:flex;gap:10px;justify-content:center;padding-block:8px 12px}
.boost{position:relative;width:64px;height:64px;border-radius:18px;background:linear-gradient(#2a3b5a,#1a263b);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 0 #0a1019}
.boost canvas{width:44px;height:44px}
.boost .n{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--ruby);font-size:12px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.boost .n.buy{background:var(--gold2);font-size:10px}
.boost.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,192,74,.4), 0 4px 0 #0a1019}
.hint{text-align:center;font-size:12px;color:var(--gold);min-height:1.2em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.cheer{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:45;font-family:var(--display);font-weight:900;font-size:34px;color:#fff;text-shadow:0 3px 0 #7a3a00, 0 0 24px rgba(255,190,80,.8);pointer-events:none;animation:cheer 1s ease-out forwards;white-space:nowrap}
@keyframes cheer{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,9,15,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(100%,400px);max-height:100%;overflow:auto;background:linear-gradient(#22324e,#152034);border:1px solid var(--line);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:cardin .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.card h2{margin:0;font-family:var(--display);font-weight:900;font-size:24px;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.btn{width:100%;border-radius:16px;padding:12px;font-family:var(--display);font-weight:700;font-size:16px;background:linear-gradient(#ffd77a,#e3a51e 60%,#b87a10);color:#3a2200;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 5px 0 #7a4c08}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4c08}
.btn.green{background:linear-gradient(#7ee08a,#2fae55 60%,#1d7c3a);color:#06260f;box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 5px 0 #0f4a22}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);box-shadow:none;font-family:var(--body);font-weight:800}
.btn:disabled{opacity:.45}
.btn small{display:block;font-family:var(--body);font-size:12px;font-weight:800;opacity:.75}
.reward{display:flex;gap:10px;justify-content:center}
.stars3{font-size:44px;line-height:1;filter:drop-shadow(0 4px 10px rgba(245,192,74,.5))}
/* stone choice */
.nodules{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nod{width:92px;height:92px;border-radius:20px;background:radial-gradient(circle at 50% 40%, #2c3d5c, #121b2b);border:1px solid var(--line);display:grid;place-items:center;position:relative;animation:nodin .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms)}
.nod img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));animation:wob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
@keyframes nodin{from{transform:translateY(30px) scale(.6);opacity:0}}
@keyframes wob{50%{transform:translateY(-4px) rotate(-3deg)}}
.reveal{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.reveal .nod-big{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.65))}
.reveal.hit .nod-big{animation:hit .22s}
@keyframes hit{40%{transform:scale(.93) rotate(-3deg)}}
.reveal svg{position:absolute;inset:8%;width:84%;height:84%;pointer-events:none}
.reveal svg path{stroke:#ffe6a8;stroke-width:1.8;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 4px #ffcf6a)}
.spec-host{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.spec-host canvas{width:100%;height:100%;display:block;border-radius:22px}
.label{width:100%;background:#e9dfc8;color:#2a2218;border-radius:6px;padding:10px 12px;text-align:left;font-family:var(--body);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.label .rar{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.label h3{margin:2px 0 4px;font-family:var(--display);font-size:20px;color:#1d160e}
.label .row{display:flex;justify-content:space-between;font-size:13px;color:#5a4a34}
.label .row b{color:#1d160e}
.label .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.label .tr span{font-size:11px;background:rgba(42,34,24,.12);border-radius:999px;padding:2px 8px}
.label .tr span.rare{background:linear-gradient(90deg,#ffd27a,#ff9ad8,#9ad0ff)}
.missed{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.missed span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
/* collection & tasks */
.list{display:flex;flex-direction:column;gap:8px;width:100%}
.task{display:flex;align-items:center;gap:10px;background:#111a29;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left}
.task b{font-size:14px}
.task p{font-size:12px;margin:0}
.task .go{margin-left:auto;flex:none;border-radius:12px;padding:8px 12px;background:linear-gradient(#ffd77a,#e3a51e);color:#3a2200;font-family:var(--display);font-size:13px;box-shadow:0 3px 0 #7a4c08}
.task .go:disabled{background:#2a3548;color:var(--muted);box-shadow:none}
.task.done{opacity:.55}
#coll .wrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-block:4px 12px}
#coll h2{font-family:var(--display);font-size:20px;margin:6px 0 0}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.spc{display:flex;flex-direction:column;align-items:center;gap:3px;background:#111a29;border:1px solid var(--line);border-radius:14px;padding:6px;border-bottom:3px solid var(--rc,var(--line))}
.spc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#0a0f17}
.spc b{font-size:12px;line-height:1.15}
.spc small{font-size:11px;color:var(--muted)}
.set{background:#111a29;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.set.full{border-color:var(--gold)}
.set-h{display:flex;justify-content:space-between;align-items:baseline}
.set-h b{font-family:var(--display);font-size:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips span{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.chips span.on{border-color:var(--good);color:var(--good)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:#22324e;border:1px solid var(--gold);border-radius:14px;padding:8px 14px;font-size:14px;animation:cardin .3s both;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<!-- home: the mine you are rebuilding -->
<section class="screen" id="home">
  <div class="bar"><div class="pills" id="pills"></div><button class="pill" id="mute" type="button" aria-label="Звук">🔊</button></div>
  <div class="title" id="areaName"></div>
  <div class="sub" id="areaSub"></div>
  <div class="scene" id="scene"></div>
  <div class="home-actions">
    <button class="tasks-btn" id="tasksBtn" type="button"><div style="flex:1;text-align:left"><b id="tasksLbl"></b><div class="tasks-bar"><i id="tasksFill"></i></div></div><span id="tasksStars"></span></button>
    <button class="play" id="playBtn" type="button"></button>
  </div>
  <div class="nav"><button class="on" type="button">Рудник</button><button type="button" id="toColl">Коллекция</button></div>
</section>

<!-- play -->
<section class="screen" id="game" hidden>
  <div class="lvl-h"><button class="x" id="quit" type="button" aria-label="Выйти">✕</button><span id="lvlName"></span><span style="width:34px"></span></div>
  <div class="hud"><div class="goals" id="goals"></div><div class="moves" id="moves"><small>ходы</small><b id="movesN">0</b></div></div>
  <div class="board-wrap" id="boardWrap"><canvas id="board"></canvas></div>
  <div class="hint" id="hint"></div>
  <div class="boosters" id="boosters"></div>
</section>

<!-- collection -->
<section class="screen" id="coll" hidden>
  <div class="bar"><div class="pills" id="pills2"></div><span></span></div>
  <div class="wrap" id="collWrap"></div>
  <div class="nav"><button type="button" id="toHome">Рудник</button><button class="on" type="button">Коллекция</button></div>
</section>

<canvas id="fx"></canvas>
<div id="ov" class="ov" hidden></div>

<script>
'use strict';
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const now = () => performance.now();
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(entries, rng = Math.random){ let t = entries.reduce((s, e) => s + e[1], 0), r = rng() * t; for (const e of entries) { if ((r -= e[1]) <= 0) return e[0]; } return entries[entries.length - 1][0]; }
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

/* ================= minerals (shared with the specimen generator) ================= */
const SP = {
  quartz:{n:'Горный хрусталь', c:0xdfe8f2, v:20, r:0}, amethyst:{n:'Аметист', c:0xb47cff, v:60, r:1}, calcite:{n:'Кальцит', c:0xf2c27a, v:15, r:0},
  fluorite:{n:'Флюорит', c:0x5fe0a0, v:35, r:1}, malachite:{n:'Малахит', c:0x43c98a, v:30, r:0}, azurite:{n:'Азурит', c:0x5f8bff, v:55, r:1},
  gypsum:{n:'Селенит', c:0xe6eef6, v:15, r:0}, pyrite:{n:'Пирит', c:0xc9b26a, v:25, r:0}, gold:{n:'Самородное золото', c:0xffd24a, v:250, r:2},
  garnet:{n:'Альмандин', c:0xe0566a, v:70, r:1}, beryl:{n:'Берилл', c:0xe6dd8a, v:90, r:1}, aquamarine:{n:'Аквамарин', c:0x7fd8ff, v:160, r:2},
  emerald:{n:'Изумруд', c:0x3fe08a, v:600, r:3}, opal:{n:'Благородный опал', c:0x8fe6dc, v:300, r:2}, sapphire:{n:'Сапфир', c:0x5f7fff, v:500, r:3},
  ruby:{n:'Рубин', c:0xff3a5a, v:900, r:3}, diamond:{n:'Алмаз', c:0xeaf6ff, v:2000, r:4}, nativecu:{n:'Самородная медь', c:0xd07040, v:70, r:1},
  cuprite:{n:'Куприт', c:0xb02020, v:110, r:2}, chrysocolla:{n:'Хризоколла', c:0x3fc0c0, v:45, r:1}, celestine:{n:'Целестин', c:0x9fd0ff, v:50, r:1},
};
const RAR = ['обычный', 'необычный', 'редкий', 'эпический', 'легендарный'], RC = ['#b0c3d9', '#4b8bff', '#a35cff', '#e23ce6', '#f0b43a'];
const GR = [{n:'C', w:40, m:1}, {n:'B', w:30, m:1.5}, {n:'A', w:18, m:2.4}, {n:'AA', w:9, m:4}, {n:'AAA', w:3, m:8}];
const fmtW = g => g >= 1000 ? `${(g / 1000).toFixed(2).replace('.', ',')} кг` : `${Math.round(g)} г`;

/* ================= save ================= */
const LIFE_MS = 8 * 60 * 1000, MAX_LIVES = 5;
const BLANK = () => ({level:1, coins:400, stars:0, lives:5, lifeAt:0, area:0, built:[[], []], boost:{pick:2, dyn:2}, coll:[], sets:[], uid:1000, up:{lab:0}, mute:false});
let save = (() => { try { const s = JSON.parse(localStorage.getItem('samocvet-v1') || 'null'); return s ? Object.assign(BLANK(), s) : BLANK(); } catch (e) { return BLANK(); } })();
function persist(){ try { localStorage.setItem('samocvet-v1', JSON.stringify(save)); } catch (e) {} }
function tickLives(){ if (save.lives >= MAX_LIVES) { save.lifeAt = 0; return; } const t = Date.now(); if (!save.lifeAt) save.lifeAt = t; while (save.lives < MAX_LIVES && t - save.lifeAt >= LIFE_MS) { save.lives++; save.lifeAt += LIFE_MS; } if (save.lives >= MAX_LIVES) save.lifeAt = 0; }

/* ================= sound ================= */
let AC = null;
function ac(){ if (save.mute) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function tone(f, at, dur, vol, type = 'sine', slide = 0){ const a = ac(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05); }

function levelDef(n){
  if (n <= LEVELS.length) return LEVELS[n - 1];
  // beyond the hand-made ones: remix a layout, a little tighter each time
  const base = LEVELS[3 + (n * 7) % (LEVELS.length - 3)];
  return Object.assign({}, base, {moves:Math.max(18, base.moves - Math.floor((n - LEVELS.length) / 3)), vein:n % 4 === 0, hard:n % 8 === 0});
}

async function collectNuggets(){

}
// gravity: straight down first, then sideways around rocks; new stones drop in from the top of each column
function collapseAnim(initial = false){
  let moved = true; const spawnN = Array(C).fill(0);

  while (moved) { moved = false;
    for (let r = R - 1; r >= 0; r--) for (let c = 0; c < C; c++) {
      if (!open(r, c) || G[r][c]) continue;
      if (r > 0 && open(r - 1, c) && G[r - 1][c]) { G[r][c] = G[r - 1][c]; G[r - 1][c] = null; moved = true; continue; }
      if (isSpawn(r, c)) { const g = newGem(r, c); spawnN[c]++; g.y = r - spawnN[c] - .3; G[r][c] = g; moved = true; continue; }
      const fromAbove = r > 0 && open(r - 1, c);
      if (!fromAbove) for (const dc of Math.random() < .5 ? [-1, 1] : [1, -1]) { const sr = r - 1, sc = c + dc; if (sr >= 0 && open(sr, sc) && G[sr][sc] && !(open(r, sc) && !G[r][sc])) { G[r][c] = G[sr][sc]; G[sr][sc] = null; moved = true; break; } }
    }
  }
  const ps = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const g = G[r][c]; if (!g) continue; if (Math.abs(g.y - r) > .01 || Math.abs(g.x - c) > .01) { const d = Math.hypot(g.y - r, g.x - c); ps.push(tween(g, {x:c, y:r}, (initial ? 260 : 120) + Math.sqrt(d) * 110, 'fall', initial ? c * 25 + Math.random() * 40 : 0)); } }

}
async function shuffle(){

  for (let tries = 0; tries < 60; tries++) { for (let i = gems.length - 1; i > 0; i--) { const j = ri(0, i); [gems[i], gems[j]] = [gems[j], gems[i]]; } cells.forEach(([r, c], i) => G[r][c] = gems[i]); if (!findGroups().length && hasMoves()) break; }
  await Promise.all(cells.map(([r, c]) => tween(G[r][c], {x:c, y:r}, 420, 'out')));
}

  down.moved = true; const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];

async function trySwap(r1, c1, r2, c2){

  const a = G[r1][c1], b = G[r2][c2]; if (!a || !b) return;
  busy = true; SFX.swap();
  await Promise.all([tween(a, {x:c2, y:r2}, 150, 'inout'), tween(b, {x:c1, y:r1}, 150, 'inout')]);
  G[r1][c1] = b; G[r2][c2] = a;
  if (a.sp || b.sp) {
    useMove(); B = null;
    if (a.sp && b.sp) { a.dyingAt = b.dyingAt = 1; const ev = [{t:0, fn:t => { B.cleared.add(r1 * C + c1); B.cleared.add(r2 * C + c2); a.dyingAt = b.dyingAt = B.t0 + t; combo(a, b, r2, c2, t + 60); }}];
      await resolve(ev); }
    else { const sp = a.sp ? a : b, other = a.sp ? b : a, [sr, sc] = a.sp ? [r2, c2] : [r1, c1];
      if (sp.sp === 'orb' && other.t >= 0) { const ev = [{t:0, fn:t => { B.cleared.add(sr * C + sc); sp.dyingAt = B.t0 + t; orbColor(sr, sc, other.t, t + 40); }}]; await resolve(ev); }
      else await resolve([{r:sr, c:sc, t:0, kind:'fx'}], [[r1, c1], [r2, c2]]); }

  }
  if (!findGroups().length) { SFX.bad(); G[r1][c1] = a; G[r2][c2] = b; await Promise.all([tween(a, {x:c1, y:r1}, 160, 'inout'), tween(b, {x:c2, y:r2}, 160, 'inout')]); busy = false; return; }

}

  for (const [r, c] of picks) { const g = G[r][c]; g.sp = Math.random() < .5 ? 'rh' : 'rv'; g.s = .3; tween(g, {s:1}, 200, 'back'); L.moves--; L.coinsWon += 5; renderMoves(); SFX.coin(); await wait(90); }

  $('#collWrap').querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const st = SETS.find(x => x.id === b.dataset.set); if (save.sets.includes(st.id)) return; save.sets.push(st.id); save.coins += st.reward.coins; save.boost.pick += st.reward.pick || 0; save.boost.dyn += st.reward.dyn || 0; persist(); SFX.coin(); renderColl(); toast(`${st.n}: награда получена`); });

    openOv(`<div class="reveal"><div class="spec-host" id="specHost"></div></div><div class="label"><div class="rar" style="color:${RC[s.tier]}">${s.legend ? 'легендарная находка' : RAR[s.tier]}</div><h3>${SP[s.sid].n}</h3><div class="row"><span>Вес</span><b>${fmtW(s.g)}</b></div><div class="row"><span>Качество</span><b>${GR[s.gi].n}</b></div>${s.traits.length ? `<div class="tr">${s.traits.map(id => `<span>${TR[id].n}</span>`).join('')}</div>` : ''}</div>
      <button class="btn" id="sellC">Продать · ${fmt(s.value)} монет</button><button class="btn ghost" id="closeC">Закрыть</button>`, () => {
      specMount($('#specHost'), {seed:s.id, sid:s.sid, kind:s.kind, gi:s.gi, traits:s.traits, legend:s.legend});
      $('#closeC').onclick = () => { specUnmount(); closeOv(); };
      $('#sellC').onclick = () => { save.coll = save.coll.filter(x => x !== s); save.coins += s.value; persist(); SFX.coin(); specUnmount(); closeOv(); renderColl(); };
    }); });
  setTimeout(fillSpecs, 50);
}

$('#playBtn').onclick = () => { ac(); tickLives(); if (save.lives <= 0) { const mins = Math.ceil((LIFE_MS - (Date.now() - save.lifeAt)) / 60000);
    return openOv(`<h2>Нет жизней</h2><p>Следующая жизнь через ${mins} мин.</p><button class="btn" id="refill" ${save.coins < 300 ? 'disabled' : ''}>Восполнить · 300 монет</button><button class="btn ghost" data-close>Подождать</button>`, () => { $('#refill').onclick = () => { if (save.coins < 300) return; save.coins -= 300; save.lives = MAX_LIVES; save.lifeAt = 0; persist(); closeOv(); goHome(); }; }); }
  startLevel(save.level); };
$('#tasksBtn').onclick = openTasks;
$('#toColl').onclick = renderColl;
$('#toHome').onclick = goHome;
$('#mute').onclick = () => { save.mute = !save.mute; persist(); goHome(); };
$('#quit').onclick = () => { if (busy) return; openOv(`<h2>Выйти с уровня?</h2><p>Потеряете одну жизнь.</p><button class="btn" id="stay">Играть дальше</button><button class="btn ghost" id="leave">Выйти</button>`, () => { $('#stay').onclick = closeOv; $('#leave').onclick = () => { tickLives(); save.lives = Math.max(0, save.lives - 1); if (!save.lifeAt) save.lifeAt = Date.now(); persist(); closeOv(); goHome(); }; }); };
addEventListener('resize', () => { if (L) sizeBoard(); else { fxc.width = innerWidth * DPR; fxc.height = innerHeight * DPR; } });
setInterval(() => { if (!$('#home').hidden) $('#pills').innerHTML = pills(); }, 30000);

/* ================= tweens & drawing ================= */
const tweens = [];
const EASE = {out:p => 1 - Math.pow(1 - p, 3), inout:p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, back:p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }, fall:p => p < .78 ? Math.pow(p / .78, 2) : 1 + Math.sin((p - .78) / .22 * Math.PI) * .08};
function tween(o, props, dur, ease = 'out', delay = 0){ return new Promise(res => tweens.push({o, props, dur, ease:EASE[ease], t0:now() + delay, from:null, res})); }
function cheer(t){ const d = document.createElement('div'); d.className = 'cheer'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function debris(r, c, color, n){ const [x, y] = cellScreen(r, c); for (let k = 0; k < n; k++) parts.push({x, y, vx:rnd(-4, 4), vy:rnd(-6, 1), g:.28, life:0, max:rnd(24, 40), s:rnd(2.5, 5.5), c:color, sq:true}); }
function sparkle(x, y, color, n){ for (let k = 0; k < n; k++) { const a = rnd(0, 6.28), v = rnd(1.5, 5); parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 1, g:.12, life:0, max:rnd(18, 32), s:rnd(2, 4.5), c:color}); } }

function frame(){
  requestAnimationFrame(frame);
  const t = now();
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; if (t < w.t0) continue; if (!w.from) { w.from = {}; for (const k in w.props) w.from[k] = w.o[k]; }
    const p = Math.min(1, (t - w.t0) / w.dur), e = w.ease(p); for (const k in w.props) w.o[k] = w.from[k] + (w.props[k] - w.from[k]) * e; if (p >= 1) { for (const k in w.props) w.o[k] = w.props[k]; tweens.splice(i, 1); w.res(); } }
  if (L && !$('#game').hidden) drawBoard(t);
  drawFx(t);
}
function drawBoard(t){
  const x = bx, S = TS; x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const W = C * S + PAD * 2, H = R * S + PAD * 2; x.clearRect(0, 0, W, H);
  shake *= .86; const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake; x.translate(sx, sy);
  // the tray: dark rock with a timber rim
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (playable(r, c)) {
    const px = PAD + c * S, py = PAD + r * S;
    x.fillStyle = '#5a3a1e'; x.beginPath(); x.roundRect(px - PAD * .7, py - PAD * .7, S + PAD * 1.4, S + PAD * 1.4, S * .22); x.fill(); }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (playable(r, c)) {
    const px = PAD + c * S, py = PAD + r * S; x.fillStyle = (r + c) % 2 ? '#1f2c42' : '#24334c'; x.fillRect(px, py, S, S); }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (playable(r, c) && MUD[r][c]) x.drawImage(mudSpr(S * 2), PAD + c * S, PAD + r * S, S, S);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (playable(r, c) && ROCK[r][c]) x.drawImage(rockSpr(ROCK[r][c], S * 2), PAD + c * S, PAD + r * S, S, S);
  // stones (clipped to the tray so new ones slide in from its top edge)
  x.save(); x.beginPath(); x.rect(0, PAD - 2, W, H); x.clip();
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const g = G[r][c]; if (!g) continue; drawPiece(x, g, t, S); }
  x.restore();
  // rockets, drills, lightning, shockwaves
  for (let i = projs.length - 1; i >= 0; i--) { const p = projs[i], age = t - p.t0;
    if (p.sp === 'drill') { const k = Math.min(1, age / 420); const [ax, ay] = cellCenter(p.r, p.c), [bx2, by2] = cellCenter(p.tr, p.tc); const cx = (ax + bx2) / 2, cy = Math.min(ay, by2) - S * 2; const u = 1 - k;
      const px = u * u * ax + 2 * u * k * cx + k * k * bx2, py = u * u * ay + 2 * u * k * cy + k * k * by2; x.save(); x.translate(px, py); x.rotate(age / 40); x.drawImage(spSpr('drill', S * 2), -S / 2, -S / 2, S, S); x.restore(); if (age > 440) projs.splice(i, 1); continue; }
    const d = age / 32 * S, [ox, oy] = cellCenter(p.r, p.c);
    for (const s of [-1, 1]) { const px = p.sp === 'rh' ? ox + s * d : ox, py = p.sp === 'rv' ? oy + s * d : oy;
      x.save(); x.translate(px, py); x.rotate(p.sp === 'rh' ? (s < 0 ? Math.PI : 0) : (s < 0 ? -Math.PI / 2 : Math.PI / 2));
      const tr = x.createLinearGradient(-S * 1.6, 0, 0, 0); tr.addColorStop(0, 'rgba(255,200,80,0)'); tr.addColorStop(1, 'rgba(255,230,140,.9)'); x.fillStyle = tr; x.fillRect(-S * 1.6, -S * .12, S * 1.6, S * .24);
      x.drawImage(spSpr('rh', S * 2), -S / 2, -S / 2, S, S); x.restore(); }
    if (d > Math.max(R, C) * S + S) projs.splice(i, 1); }
  for (let i = zaps.length - 1; i >= 0; i--) { const z = zaps[i], age = t - z.t0; if (age > 300) { zaps.splice(i, 1); continue; } const [ax, ay] = cellCenter(z.r, z.c), [bx2, by2] = cellCenter(z.tr, z.tc);
    x.strokeStyle = `rgba(230,200,255,${1 - age / 300})`; x.lineWidth = 3; x.shadowColor = '#c08aff'; x.shadowBlur = 12; x.beginPath(); x.moveTo(ax, ay);
    for (let k = 1; k < 6; k++) { const u = k / 6; x.lineTo(ax + (bx2 - ax) * u + rnd(-6, 6), ay + (by2 - ay) * u + rnd(-6, 6)); } x.lineTo(bx2, by2); x.stroke(); x.shadowBlur = 0; }
  for (let i = rings.length - 1; i >= 0; i--) { const g = rings[i], age = t - g.t0; if (age > 420) { rings.splice(i, 1); continue; } const [cx, cy] = cellCenter(g.r, g.c), k = age / 420;
    x.strokeStyle = `rgba(255,210,120,${1 - k})`; x.lineWidth = 6 * (1 - k) + 1; x.beginPath(); x.arc(cx, cy, (g.rad + .6) * S * k, 0, 6.29); x.stroke();
    x.fillStyle = `rgba(255,240,200,${.35 * (1 - k)})`; x.beginPath(); x.arc(cx, cy, (g.rad + .6) * S * k * .8, 0, 6.29); x.fill(); }
}
function drawPiece(x, g, t, S){
  let s = g.s, a = 1, px = PAD + (g.x + .5) * S, py = PAD + (g.y + .5) * S;
  if (g.dyingAt && t >= g.dyingAt) {
    const k = (t - g.dyingAt) / 220;
    if (!g.popped) { g.popped = true; const [sx, sy] = cellScreen(g.y, g.x); sparkle(sx, sy, g.t >= 0 ? GEMS[g.t].c : '#ffd27a', g.sp ? 14 : 7); }
    if (g.merge) { const [mx, my] = cellCenter(g.merge[0], g.merge[1]); px += (mx - px) * Math.min(1, k * 1.6); py += (my - py) * Math.min(1, k * 1.6); }
    s *= k < .3 ? 1 + k : Math.max(0, 1.3 - (k - .3) * 2); a = Math.max(0, 1 - k * .8); if (k >= 1) return;
  }
  if (g.convertAt && t >= g.convertAt && !g.sp) { s *= 1 + Math.sin((t - g.convertAt) / 40) * .1; }
  const img = g.item ? nugSpr(S * 2) : g.sp ? spSpr(g.sp, S * 2) : gemSpr(g.t, S * 2);
  x.globalAlpha = a; const w = S * s;
  if (g.sp === 'orb') { x.save(); x.translate(px, py); x.rotate(Math.sin(t / 600) * .15); x.drawImage(img, -w / 2, -w / 2, w, w); x.restore(); }
  else x.drawImage(img, px - w / 2, py - w / 2, w, w);
  if (g.sp === 'rh' || g.sp === 'rv') { // a spitting fuse
    const fx2 = g.sp === 'rh' ? px + S * .48 : px - S * .18, fy2 = g.sp === 'rh' ? py - S * .18 : py + S * .48; x.fillStyle = Math.random() < .5 ? '#ffe9a0' : '#ff8a3a'; x.beginPath(); x.arc(fx2, fy2, S * .05 + Math.random() * S * .03, 0, 6.29); x.fill(); }
  x.globalAlpha = 1;
}
function drawFx(t){
  const x = fx; x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life++; p.vx *= .98; p.vy = p.vy * .98 + p.g; p.x += p.vx; p.y += p.vy; if (p.life > p.max) { parts.splice(i, 1); continue; }
    x.globalAlpha = Math.min(1, (1 - p.life / p.max) * 1.5); x.fillStyle = p.c;
    if (p.sq) { x.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s * .7); } else { x.save(); x.translate(p.x, p.y); x.rotate(p.life * .2); x.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? p.s * .35 : p.s * 1.5, a = k * Math.PI / 4; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.closePath(); x.fill(); x.restore(); } }
  x.globalAlpha = 1;
  for (let i = flights.length - 1; i >= 0; i--) { const f = flights[i], k = Math.min(1, (t - f.t0) / f.dur), e = k * k * (3 - 2 * k);
    const cx = (f.sx + f.ex) / 2 + (f.sx < f.ex ? -60 : 60), cy = Math.min(f.sy, f.ey) - 80, u = 1 - e;
    const px = u * u * f.sx + 2 * u * e * cx + e * e * f.ex, py = u * u * f.sy + 2 * u * e * cy + e * e * f.ey, w = 40 - 14 * e;
    x.drawImage(f.img, px - w / 2, py - w / 2, w, w); if (k >= 1) { flights.splice(i, 1); landed(f.gi); } }
}
requestAnimationFrame(frame);
goHome();
</script>
