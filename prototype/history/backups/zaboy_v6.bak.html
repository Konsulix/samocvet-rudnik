<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Забой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Russo+One&family=JetBrains+Mono:wght@500;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: camp is a scrolling logbook with four buildings; the descent is a full-screen dark canvas lit by one lamp cone, with a thin HUD */
:root{
  --bg:#071013; --surface:#10222a; --raise:#173240; --line:#22404e;
  --fg:#e4ddcc; --muted:#8fa3a8; --lamp:#e3a857; --anom:#7fe0c8; --danger:#e2604a; --water:#4fa8d8; --gas:#a9d65a; --lava:#ff7a3a;
  --iron:#c8713a; --copper:#3fbfa0; --carbide:#a7aec2;
  --paper:#d9ccb0; --ink:#2a2218; --ink2:#6a5a42;
  --display:'Old Standard TT', 'Times New Roman', Georgia, serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --game:'Russo One', 'Golos Text', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse at 50% -10%, rgba(227,168,87,.08), transparent 55%), var(--bg);color:var(--fg);min-height:100%;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.inrun{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
h2,h3{font-family:var(--display);font-weight:700;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;color:var(--lamp)}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}
.wallet{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.chipr{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chipr i{width:8px;height:8px;border-radius:2px;background:var(--rc);display:inline-block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 0;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs .dot{position:absolute;top:1px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--lamp);color:#1b130b;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-h h2{font-family:var(--body);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.btn{background:var(--lamp);color:#1b130b;border:0;border-radius:10px;padding:12px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500}
.ghost:disabled{opacity:.4;cursor:default}
.buy{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:12px;white-space:nowrap;text-align:right}
.buy:disabled{opacity:.4;cursor:default}
.empty{margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}
.hero{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2.2;background:#0d1a1f url(img/key_art.webp) center 45% / cover;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(7,16,19,.1), rgba(7,16,19,.92))}
.hero div{position:absolute;left:14px;right:14px;bottom:10px;z-index:1}
.hero b{font-family:var(--display);font-size:19px;display:block}
.hero span{font-size:12.5px;color:#c8d2cf}
.biome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.biome.locked{opacity:.55}
.biome-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.biome-h b{font-family:var(--display);font-size:19px}
.biome-h span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.biome p{margin:0;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--raise);color:var(--tc, var(--fg))}
.minis{display:flex;flex-wrap:wrap;gap:3px}
.minis img{width:26px;height:26px;object-fit:contain}
.bld{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bld-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bld-h b{font-family:var(--display);font-size:19px}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--lamp)}
.up{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.up b{font-weight:600;font-size:14px}
.up p{margin:0;font-size:12.5px;color:var(--muted)}
.cost{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.cost span{font-family:var(--mono);font-size:11px}
.cost .no{color:var(--danger)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;border-bottom:3px solid var(--rc, var(--line))}
.fc img{width:64px;height:64px;object-fit:contain}
.fc .n{font-size:12px;font-weight:600;line-height:1.2}
.fc .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.fc.dirty img{filter:brightness(.35) saturate(.4) blur(1px)}
.fc.lock img{filter:brightness(0) opacity(.45)!important}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right}
.fx-in{animation:fxin .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i, 0) * 45ms)}
@keyframes fxin{from{opacity:0;transform:translateY(10px)}}

/* run */
#view{position:fixed;inset:0;z-index:5;display:block;width:100%;height:100%;touch-action:none;background:#010203}
.hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top, 0px)) 12px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;background:linear-gradient(rgba(1,2,3,.85), transparent)}
.hud-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud .mn{font-family:var(--display);font-size:16px}
.oil{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11.5px;color:var(--lamp)}
.oil .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.oil .bar i{display:block;height:100%;background:linear-gradient(90deg, #a8601e, var(--lamp));transition:width .3s}
.oil.low{color:var(--danger)}.oil.low .bar i{background:var(--danger)}
.hp{font-size:14px;letter-spacing:1px;color:var(--danger)}
.hp i{font-style:normal;color:#3a2a2a}
.sack{display:flex;gap:5px}
.compass{position:fixed;z-index:10;right:12px;top:calc(96px + env(safe-area-inset-top, 0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(16,34,42,.75);display:grid;place-items:center;pointer-events:none}
.compass i{position:absolute;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:20px solid var(--lamp);top:7px;left:50%;margin-left:-7px;transform-origin:7px 22px}
.compass span{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:26px}
.warn{font-size:12.5px;color:var(--danger);min-height:1.2em;text-shadow:0 1px 4px #000}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 12px calc(14px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(transparent, rgba(1,2,3,.85));pointer-events:none}
.bottom > *{pointer-events:auto}
.ctx{display:flex;gap:8px;width:100%;max-width:480px;justify-content:center}
.ctx .ghost{background:rgba(16,34,42,.9)}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:420px;text-shadow:0 1px 4px #000;pointer-events:none}
.work{position:fixed;z-index:11;left:50%;bottom:calc(120px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.work b{font-size:13px;text-shadow:0 1px 4px #000;white-space:nowrap}
.work .wbar{width:150px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.work .wbar i{display:block;height:100%;background:var(--wc, var(--lamp))}
.toastbox{position:fixed;top:calc(100px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;width:min(400px, calc(100% - 100px));pointer-events:none}
.tst{background:rgba(16,34,42,.95);border:1px solid var(--tc, var(--lamp));border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;animation:fxin .3s both;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tst img{width:36px;height:36px;object-fit:contain}
.tst b{display:block;font-size:14px}
.tst span{font-size:12.5px;color:var(--muted)}
.joy{position:fixed;z-index:11;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(227,168,87,.35);background:rgba(16,34,42,.35);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(227,168,87,.55);box-shadow:0 0 14px rgba(227,168,87,.5)}
.film{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%)}
.vign{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(226,96,74,0);transition:box-shadow .3s}
.vign.hurt{box-shadow:inset 0 0 120px 40px rgba(226,96,74,.55)}
.flash{position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(circle, rgba(255,200,120,.85), rgba(255,90,20,.4) 40%, transparent 70%);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.bag{display:grid;gap:3px;background:#0c1a20;border:1px solid var(--line);border-radius:10px;padding:6px;position:relative;align-self:center}
.bag .cell{width:var(--bc);height:var(--bc);border-radius:4px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.08)}
.bag .it{position:absolute;border-radius:6px;background:linear-gradient(160deg, #263f4c, #162a33);border:1px solid #3e6273;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.bag .it img{width:88%;height:88%;object-fit:contain}
.bag .it.sel{outline:2px solid var(--lamp)}
.pending{display:flex;gap:10px;align-items:center;background:var(--raise);border:1px dashed var(--anom);border-radius:10px;padding:8px 10px;font-size:13px}
.pending img{width:44px;height:44px;object-fit:contain}

/* overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(2,6,8,.8);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-head h2{font-size:22px}
.x{background:var(--raise);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 38%, #1e3440 0%, #050b0d 72%);display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));gap:10px;overflow:auto}
.st-top{text-align:center;margin-top:24px}
.st-top .t{font-family:var(--display);font-size:20px}
.st-top .s{font-size:12.5px;color:var(--muted)}
.arena{position:relative;width:min(70vw,270px);aspect-ratio:1;flex:none;touch-action:manipulation;user-select:none;border:0;background:transparent;padding:0}
.arena .obj{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.65));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
.arena.hit .obj{animation:hit .25s}
@keyframes hit{30%{transform:scale(.94) rotate(-3deg)}60%{transform:scale(1.03) rotate(1deg)}}
.cracks{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none}
.cracks path{stroke:var(--glow);stroke-width:1.8;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px var(--glow));stroke-dasharray:200;stroke-dashoffset:200;animation:draw .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rays{position:absolute;inset:-25%;border-radius:50%;background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 32%, transparent) 0 8deg, transparent 8deg 24deg);mask:radial-gradient(circle, #000 20%, transparent 68%);-webkit-mask:radial-gradient(circle, #000 20%, transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gem{position:absolute;inset:4%;animation:emerge .6s cubic-bezier(.2,1.5,.4,1)}
.gem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
@keyframes emerge{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.tap-hint{text-align:center;color:var(--muted);font-size:14px}
.label{background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;width:100%;max-width:420px}
.label::before{content:"";position:absolute;inset:5px;border:1px solid rgba(42,34,24,.3);pointer-events:none}
.label .no{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.label h3{font-size:22px;line-height:1.1;margin-top:2px}
.label .sub{font-family:var(--display);font-style:italic;font-size:13.5px;color:var(--ink2)}
.label dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:8px 0 0;font-size:13.5px}
.label dt{color:var(--ink2)}
.label dd{margin:0;font-weight:700}
.label .val{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:6px;border-top:1px solid rgba(42,34,24,.25);padding-top:6px;display:flex;justify-content:space-between}
.qual{color:var(--gc)}
.news{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.news div{border-radius:10px;padding:8px 12px;font-size:13.5px;background:color-mix(in srgb, var(--lamp) 18%, transparent);border:1px solid var(--lamp);color:var(--lamp);font-weight:600;animation:fxin .35s both}
.dig{position:fixed;z-index:11;left:50%;bottom:calc(178px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.dig-pips{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);text-shadow:0 1px 4px #000}
.dig-pips i{width:16px;height:6px;border-radius:2px;background:rgba(255,255,255,.14)}
.dig-pips i.on{background:var(--anom)}
.dig-btn{border:1.5px solid var(--rk, var(--anom));background:rgba(16,34,42,.94);border-radius:999px;padding:10px 24px;font-weight:600;font-size:15px;box-shadow:0 0 18px color-mix(in srgb, var(--rk, var(--anom)) 35%, transparent);touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap}
.dig-btn small{display:block;font-weight:500;font-size:11.5px;color:var(--rk, var(--anom))}
.dig.good .dig-btn{animation:pulse .2s}
.dig.bad{animation:shk .3s}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes shk{25%{transform:translateX(calc(-50% - 7px))}75%{transform:translateX(calc(-50% + 7px))}}
.findcard{position:fixed;z-index:13;left:50%;top:31%;transform:translate(-50%,-50%);width:min(330px, calc(100% - 32px));display:flex;gap:12px;align-items:center;background:linear-gradient(160deg, rgba(23,50,64,.97), rgba(10,22,28,.97));border:1.5px solid var(--fc);border-radius:14px;padding:12px 14px;box-shadow:0 0 44px color-mix(in srgb, var(--fc) 45%, transparent), 0 10px 30px rgba(0,0,0,.6)}
.findcard.pop{animation:card .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes card{from{transform:translate(-50%,-50%) scale(.55);opacity:0}}
.findcard .fimg{width:66px;height:66px;flex:none;filter:drop-shadow(0 0 12px var(--fc))}
.findcard .fimg img{width:100%;height:100%;object-fit:contain}
.findcard .fr{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--fc);font-weight:600}
.findcard b{display:block;font-family:var(--display);font-size:19px;line-height:1.15}
.findcard .fw{font-family:var(--mono);font-size:16px;font-weight:700}
.findcard .fd{font-size:12px;color:var(--danger)}
.findcard em{display:block;font-style:normal;font-size:12.5px;color:var(--lamp);margin-top:3px;font-weight:600}
.gemflash{position:fixed;inset:0;z-index:12;pointer-events:none;background:radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--fc) 32%, transparent), transparent 60%);animation:flash .9s ease-out forwards}
.note{position:fixed;z-index:13;left:50%;bottom:calc(150px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:min(340px, calc(100% - 32px));background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-family:var(--display);font-style:italic;font-size:15.5px;line-height:1.35;animation:fxin .35s both}
.note .sig{display:block;text-align:right;font-size:13px;color:var(--ink2);margin-top:4px}
.note .gain{display:block;font-family:var(--body);font-style:normal;font-size:12px;color:#7a4a10;font-weight:600;margin-top:6px}
.dread{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 160px 70px rgba(0,0,0,.95);animation:dread 1.1s ease-in-out infinite}
@keyframes dread{50%{box-shadow:inset 0 0 200px 100px rgba(0,0,0,1)}}
.app{position:fixed;inset:0;max-width:none;margin:0;padding:0;gap:0;display:flex;flex-direction:column;overflow:hidden;background:#04080a}
.app::before{content:"";position:absolute;inset:-5%;background:url(img/mine_bg.webp) center/cover;filter:brightness(.7) saturate(1.05);animation:kb 40s ease-in-out infinite alternate;transition:filter .4s;z-index:0}
.app.sub::before{filter:brightness(.25) saturate(.7) blur(3px)}
@keyframes kb{to{transform:scale(1.09) translateY(-2%)}}
.app::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 22%, rgba(255,190,100,.16), transparent 50%), linear-gradient(rgba(3,6,8,.55), rgba(3,6,8,.05) 28%, rgba(3,6,8,.55) 62%, rgba(3,6,8,.96));animation:lampfl 5s infinite}
@keyframes lampfl{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.82}50%{opacity:1}73%{opacity:.9}74%{opacity:1}}

  ST.phase++; anim(a, 'hit'); const [x, y] = elXY(a);
  if (geo) { SFX.crack(ST.phase); $('#cracks').innerHTML = crackPaths(it.id, ST.phase * 2 + 1).map(d => `<path d="${d}"/>`).join(''); burst(x, y, {n:8 + ST.phase * 6, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:3 + ST.phase * 1.4, grav:.3, size:5, kind:'chip'}); }
  else { SFX.brush(); const k = ST.phase; $('#dirtyImg').style.filter = `${sp.fl ? sp.fl + ' ' : ''}brightness(${.25 + k * .22}) saturate(${.3 + k * .23}) blur(${2 - k * .7}px)`; burst(x, y, {n:12, colors:['rgba(140,110,80,.7)', 'rgba(90,70,50,.6)'], speed:3, grav:.15, size:4, kind:'chip'}); }
  if (ST.phase === 2 && sp.r >= 2) a.style.setProperty('--glow', RC[sp.r]);
  if (ST.phase >= 3) { ST.busy = true; setTimeout(revealFind, 250); }
}
function revealFind(){
  const it = ST.it, res = it.res, sp = SP[res.sid], tier = Math.min(4, sp.r + (res.gi >= 3 ? 1 : 0)), a = $('#arena');
  a.style.setProperty('--rc', RC[tier]); a.innerHTML = `<div class="rays"></div><div class="wheel"></div><div class="gem">${imgTag(res.sid)}</div>`;
  SFX.reveal(tier); const [x, y] = elXY(a);
  burst(x, y, {n:26, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:8, grav:.35, size:7, kind:'chip'});
  burst(x, y, {n:20 + tier * 14, colors:[RC[tier], '#ffffff'], speed:4 + tier, size:3.5});
  $('#stHint').textContent = ''; ST.busy = false;
  ST.news = [];
  if (!save.coll.some(c => c.sid === res.sid)) ST.news.push('Новый вид для музея');
  noteBest();
  save.st.opened++; persist();
  renderOut();
}
function noteBest(){
  const res = ST.it.res, sp = SP[res.sid];
  if (!save.st.best || res.value > save.st.best.value) { if (save.st.best) ST.news.push(`Лучшая находка: ${fmt(res.value)} ₽`); save.st.best = {name:sp.n, value:res.value}; }
}
function renderOut(){
  const it = ST.it, res = it.res, sp = SP[res.sid], news = ST.news || [], canCut = !res.cut && !(it.dmg >= 3);
  $('#stOut').innerHTML = `<div class="label"><div class="no"><span>№ ${String(it.id).padStart(5, '0')}</span><span>${RAR[sp.r].toLowerCase()}</span></div><h3>${sp.n}</h3>
      <div class="sub">${it.kind === 'geode' ? 'из жеоды · ' : ''}${BIOM[it.biome].place}, ${it.depth} м</div>
      <dl>${it.g ? `<dt>Вес</dt><dd>${fmtW(it.g)}</dd>` : `<dt>Размер</dt><dd>${it.w}×${it.h}</dd>`}${it.dmg ? `<dt>Сколы</dt><dd>${it.dmg >= 3 ? 'обломки' : it.dmg}</dd>` : ''}<dt>Качество</dt><dd><span class="qual" style="--gc:${GR_C[res.gi]}">${GR[res.gi].n}</span></dd>${res.cut ? `<dt>Огранка</dt><dd>${CUTN[res.cut]}</dd>` : ''}</dl>
      <div class="val"><span>Оценка</span><span>${fmt(res.value)} ₽</span></div></div>
    ${news.length ? `<div class="news">${news.map(n => `<div>★ ${n}</div>`).join('')}</div>` : ''}
    ${canCut ? '<button type="button" class="btn cutbtn" data-cut>Огранить<small>рискнуть ради цены</small></button>' : ''}
    <div class="two" style="width:100%"><button type="button" class="ghost" data-keep>В музей</button><button type="button" class="btn" data-sell>Продать · ${fmt(res.value)} ₽</button></div>`;
}
function openCut(){
  const it = ST.it, v = it.res.value;
  $('#stOut').innerHTML = `<div class="cuts">${CUTS.map((c, k) => { const p = cutChance(c, it), lab = !c.lab || save.up.lab >= c.lab, ok = lab && canPay(c.cost);
      return `<button type="button" class="cut" data-cutopt="${k}"${ok ? '' : ' disabled'}><div class="cut-h"><b>${c.n}</b><span class="cut-p" style="--pc:${p > .7 ? 'var(--anom)' : p > .45 ? 'var(--lamp)' : 'var(--danger)'}">${Math.round(p * 100)}%</span></div>
        <p>${c.d}</p><div class="cut-v"><span>удача: ${fmt(v * c.m)} ₽</span><span>провал: ${fmt(v * c.fail)} ₽</span></div>
        <div class="cut-c">${lab ? costHTML(c.cost) : `<span class="no">нужно оборудование лаборатории ур. ${c.lab}</span>`}</div></button>`; }).join('')}</div>
    <button type="button" class="ghost" data-cutback style="width:100%;max-width:420px">Не рисковать</button>`;
}
function doCut(k){
  const c = CUTS[k], it = ST.it, res = it.res;
  if (ST.busy || res.cut || !canPay(c.cost) || (c.lab && save.up.lab < c.lab)) return;
  pay(c.cost); persist();
  ST.busy = true; const a = $('#arena'), win = Math.random() < cutChance(c, it), sp = SP[res.sid], tier = Math.min(4, sp.r + (res.gi >= 3 ? 1 : 0));
  a.classList.add('cutting');
  $('#stOut').innerHTML = `<div class="cutting-t">${c.n}…</div><div class="cbar"><i id="cbar"></i></div>`;
  let n = 0;
  const finish = () => {
    a.classList.remove('cutting'); ST.busy = false; const gem = a.querySelector('.gem'), [x, y] = elXY(a);
    if (win) { res.value = Math.round(res.value * c.m); res.cut = c.id; gem.classList.add('faceted'); SFX.reveal(Math.min(4, tier + 1)); burst(x, y, {n:40 + tier * 10, colors:[RC[tier], '#ffffff', '#fff2c0'], speed:6 + tier, size:3.6}); ST.news = [`Огранка «${c.n.toLowerCase()}» удалась: ×${String(c.m).replace('.', ',')}`]; }
    else { res.value = Math.round(res.value * c.fail); res.cut = 'broken'; gem.classList.add('cracked'); SFX.shatter(); buzz([60, 40, 120]); burst(x, y, {n:30, colors:['#d8d0c0', '#8a8070'], speed:7, grav:.35, size:4, kind:'chip'}); ST.news = ['Камень треснул на круге']; }
    noteBest(); persist(); renderOut();
  };
  const iv = setInterval(() => { n++; SFX.grind(); const [x, y] = elXY(a); burst(x, y + 50, {n:6, colors:['#fff6d0', RC[tier]], speed:5, grav:.25, size:2.2}); $('#cbar').style.width = Math.min(100, n * 9.5) + '%'; if (n >= 11) { clearInterval(iv); setTimeout(finish, 220); } }, 170);
}
function decideFind(keep){
  if (ST.busy) return;
  const it = ST.it, res = it.res;
  save.finds = save.finds.filter(x => x.id !== it.id);
  if (keep) save.coll.push({id:it.id, sid:res.sid, gi:res.gi, value:res.value, biome:it.biome, depth:it.depth, size:`${it.w}×${it.h}`, g:it.g, cut:res.cut});
  else { save.money += res.value; SFX.coin(); }
  persist();
  const next = save.finds[0];
  if (next) openFind(next.id); else { stage.hidden = true; ST = null; renderCamp(); }
}

/* ===================== sheets & events ===================== */
const sheet = $('#sheet'), panel = $('#panel');
function openPanel(html){ panel.innerHTML = html; sheet.hidden = false; panel.scrollTop = 0; }
function closeSheet(){ sheet.hidden = true; }
const head = (e, t) => `<div class="p-head"><div><div class="eyebrow">${e}</div><h2>${t}</h2></div><button type="button" class="x" data-close aria-label="Закрыть">✕</button></div>`;
function openHelp(){
  save.help = true; persist();
  openPanel(`${head('Как играть', 'Забой')}<ul class="help">
    <li>В бригаде четыре специалиста: забойщик, геолог, спелеолог и взрывник. В забой идёт один. У каждого свои сильные стороны и способность — круглая кнопка справа внизу.</li>
    <li>Шахта освещена местами: у лифта, под старыми фонарями, у светящихся грибов, в гроте, у озера и лавы. Там всё видно без фонаря, и ползуны туда не заходят. Если фонарь погас, беги к свету. Самое ценное лежит в глухой тьме.</li>
    <li>Белый круг вокруг шахтёра показывает, как далеко слышно его шаги. Если вести пальцем недалеко, он крадётся тихо, а удары кайла слышно далеко. Метки «шорох» и «рык» показывают, откуда идёт звук.</li>
    <li>Ведите пальцем — шахтёр идёт, фонарь светит по ходу. Видно только то, что попало в луч. Пройденные места остаются в памяти тусклым контуром.</li>
    <li>Остановитесь — шахтёр работает сам: отбивается от монстра рядом, долбит жилу, вынимает трофей, разбирает завал.</li>
    <li>Трофей он обкалывает медленно и бережно. «Сильный удар» быстрее, но может дать скол. Чем чаще бьёте, тем выше риск, а три скола превращают находку в обломки.</li>
    <li>Цвет блика подсказывает редкость ещё с края луча. У каждой находки есть вес. Рекорд засчитывается, только если вы донесёте её до лифта.</li>
    <li>В старых вагонетках есть карбид для фонаря и записки прошлых бригад: они подсказывают, где грот, озеро или провал.</li>
    <li>Жилы дают руду: железо, медь, карбид. Это ресурсы для мастерской, они идут в мешок. Блестящие трофеи — кристаллы, друзы, самородки, жеоды — занимают место в рюкзаке и раскрываются в лаборатории.</li>
    <li>Фонарь горит ограниченное время. Если он погаснет, вы не умрёте, но перестанете видеть газ, лаву и монстров.</li>
    <li>Ползуны замирают в луче и подкрадываются в темноте — особенно пока вы стоите лицом к стене и работаете. Слушайте: шорох слышен с той стороны, откуда он идёт, а если застучало сердце, кто-то совсем рядом. Големы, наоборот, идут на свет.</li>
    <li>Шахта живёт: гул перед обвалом, журчание перед подтоплением, запах серы перед лавой. Обратный путь может оказаться другим. Завал можно разобрать или взорвать зарядом.</li>
    <li>Вернуться можно только на лифте — стрелка в углу экрана показывает на него.</li></ul>
    <button type="button" class="btn" data-close>Понятно</button>`);
}
$('#mute').addEventListener('click', () => { save.mute = !save.mute; persist(); renderCamp(); });
$('#camp').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; return renderCamp(); }
  const hr = e.target.closest('[data-hero]'); if (hr) { save.hero = hr.dataset.hero; persist(); SFX.step(); return renderCamp(); }
  const hi = e.target.closest('[data-hire]'); if (hi) { const id = hi.dataset.hire, c = CREW[id]; if (!save.crew.includes(id) && canPay(c.cost)) { pay(c.cost); save.crew.push(id); save.hero = id; SFX.build(); persist(); renderCamp(); toast(`${c.n} в бригаде`, `${c.role}: ${c.ab.n.toLowerCase()} — ${c.ab.d}.`, '', c.c); } return; }
  const h = e.target.closest('[data-hz]'); if (h) { hz = Math.max(0, Math.min(BIOMES.length - 1, hz + +h.dataset.hz)); SFX.step(); return renderCamp(); }
  const r = e.target.closest('[data-run]'); if (r) return newRun(r.dataset.run);
  if (e.target.closest('[data-help]')) return openHelp();
  const u = e.target.closest('[data-up]');
  if (u) { const def = Object.values(BLD).flatMap(b => b.ups).find(x => x.id === u.dataset.up), l = save.up[def.id], c = def.cost[l]; if (c && canPay(c)) { pay(c); save.up[def.id]++; SFX.build(); persist(); renderCamp(); toast(`${def.n}: уровень ${save.up[def.id]}`, def.d(save.up[def.id]), '', 'var(--lamp)'); } return; }
  const f = e.target.closest('[data-find]'); if (f) return openFind(+f.dataset.find);
  if (e.target.closest('[data-findall]')) { if (save.finds[0]) openFind(save.finds[0].id); return; }
  const c = e.target.closest('[data-coll]');
  if (c) { const s = save.coll.find(x => x.id === +c.dataset.coll); if (!s) return; return openPanel(`${head(RAR[SP[s.sid].r], SP[s.sid].n)}<div style="display:grid;place-items:center">${imgTag(s.sid, 'width:min(50vw,180px);aspect-ratio:1;object-fit:contain')}</div>
      <div class="rows"><div class="row"><span>Качество</span><span>${GR[s.gi].n}</span></div>${s.cut ? `<div class="row"><span>Огранка</span><span>${CUTN[s.cut]}</span></div>` : ''}<div class="row"><span>${s.g ? 'Вес' : 'Размер'}</span><span>${s.g ? fmtW(s.g) : s.size}</span></div><div class="row"><span>Откуда</span><span>${BIOM[s.biome].name}, ${s.depth} м</span></div><div class="row"><span>Оценка</span><span>${fmt(s.value)} ₽</span></div></div>
      <button type="button" class="ghost" data-sellcoll="${s.id}">Продать · ${fmt(s.value)} ₽</button>`); }
  const rs = e.target.closest('[data-reset]'); if (rs) { if (rs.dataset.armed) { save = BLANK(); save.help = true; persist(); renderCamp(); } else { rs.dataset.armed = 1; rs.textContent = 'Нажмите ещё раз, чтобы стереть всё'; } }
});
$('#abil').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ac(); useAbility(); });
$('#digBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ac(); strike(); });
$('#findcard').addEventListener('click', () => $('#findcard').hidden = true);
$('#note').addEventListener('click', () => $('#note').hidden = true);
$('#bottom').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !S) return;
  if (a.dataset.act === 'up') ascend();
  if (a.dataset.act === 'bag') { bagSel = null; openBag(); }
  if (a.dataset.act === 'charge') useCharge();
});
stage.addEventListener('click', e => { if (e.target.closest('[data-cutopt]')) return doCut(+e.target.closest('[data-cutopt]').dataset.cutopt); if (e.target.closest('[data-cut]')) return openCut(); if (e.target.closest('[data-cutback]')) return renderOut(); if (e.target.closest('#arena')) return hitFind(); if (e.target.closest('[data-keep]')) return decideFind(true); if (e.target.closest('[data-sell]')) return decideFind(false); });
sheet.addEventListener('click', e => {
  const bi = e.target.closest('[data-bit]'); if (bi) { bagSel = +bi.dataset.bit; return openBag(); }
  const dr = e.target.closest('[data-drop]'); if (dr) { S.bag.items = S.bag.items.filter(it => it.id !== +dr.dataset.drop); bagSel = null; if (S.pending && place(S.bag, S.pending)) S.pending = null; hud(); return openBag(); }
  if (e.target.closest('[data-leave]')) { S.pending = null; closeSheet(); return; }
  const sc = e.target.closest('[data-sellcoll]'); if (sc) { const s = save.coll.find(x => x.id === +sc.dataset.sellcoll); if (s) { save.coll = save.coll.filter(x => x !== s); save.money += s.value; SFX.coin(); persist(); closeSheet(); renderCamp(); } return; }
  if (e.target === sheet || e.target.closest('[data-close]')) { if (S && S.pending) S.pending = null; closeSheet(); }
});

renderCamp();
if (!save.help) openHelp();
</script>
