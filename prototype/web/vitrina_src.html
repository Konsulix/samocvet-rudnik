<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Витрина минералов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#ecebe8;--fg:#1d1f22;--muted:#6b6e73;--card:#f7f7f5;--line:#d6d5d1;--accent:#1d1f22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1014;--fg:#eef0f3;--muted:#8d949e;--card:#151a20;--line:#252c35;--accent:#eef0f3}}
:root[data-theme="dark"]{--bg:#0d1014;--fg:#eef0f3;--muted:#8d949e;--card:#151a20;--line:#252c35;--accent:#eef0f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Nunito,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 clamp(20px,5vw,28px)/1.1 Unbounded,sans-serif;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.view{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#05080a}
.view canvas{width:100%;height:100%;display:block}
.label{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.label h2{font:700 18px/1.2 Unbounded,sans-serif;margin:0 0 6px}
.label p{margin:4px 0;color:var(--muted);font-size:13.5px}
.label .tr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.label .tr span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.b{font:700 13px Nunito,sans-serif;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.b.main{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:18px}
.grid button{padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#05080a;cursor:pointer;aspect-ratio:1}
.grid button.on{border-color:var(--accent)}
.grid img{width:100%;height:100%;display:block;object-fit:cover}
@media (max-width:720px){.stage{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Витрина минералов</h1>
  <p class="sub">Каждый образец собирается из сида прямо в браузере. Крутите пальцем.</p>
  <div class="stage">
    <div class="view" id="view"></div>
    <div class="label" id="label"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SP = {
  quartz:{n:'Горный хрусталь', c:0xdfe8f2}, amethyst:{n:'Аметист', c:0xb47cff}, calcite:{n:'Кальцит', c:0xf2c27a}, fluorite:{n:'Флюорит', c:0x5fe0a0},
  malachite:{n:'Малахит', c:0x43c98a}, azurite:{n:'Азурит', c:0x5f8bff}, gypsum:{n:'Селенит', c:0xe6eef6}, pyrite:{n:'Пирит', c:0xc9b26a},
  gold:{n:'Самородное золото', c:0xffd24a}, garnet:{n:'Альмандин', c:0xe0566a}, beryl:{n:'Берилл', c:0xe6dd8a}, aquamarine:{n:'Аквамарин', c:0x7fd8ff},
  emerald:{n:'Изумруд', c:0x3fe08a}, opal:{n:'Благородный опал', c:0x8fe6dc}, sapphire:{n:'Сапфир', c:0x5f7fff}, ruby:{n:'Рубин', c:0xff3a5a},
  diamond:{n:'Алмаз', c:0xeaf6ff}, cuprite:{n:'Куприт', c:0xb02020}, celestine:{n:'Целестин', c:0x9fd0ff},
  nativecu:{n:'Самородная медь', c:0xd07040}, chrysocolla:{n:'Хризоколла', c:0x3fc0c0},
};
const save = {up:{lab:0}};
/*SPECIMEN*/
// a fresh batch of finds: species weighted toward the crystals that show off the new look
const POOL = ['quartz', 'quartz', 'quartz', 'amethyst', 'aquamarine', 'beryl', 'emerald', 'gypsum', 'celestine', 'fluorite', 'pyrite', 'calcite', 'ruby', 'sapphire', 'garnet', 'diamond', 'gold', 'gold', 'nativecu', 'malachite', 'malachite', 'azurite', 'chrysocolla', 'opal'];
const KINDS = ['crystal', 'crystal', 'druse', 'druse', 'geode', 'geode', 'shard'];
let batch = 1, items = [], cur = 0;
function makeBatch(){
  const r = mulberry(batch * 977 + 3);
  items = Array.from({length:12}, (_, k) => { const it = {id:batch * 1000 + k + 1, kind:KINDS[Math.floor(r() * KINDS.length)], legend:r() < .06}, gi = Math.floor(r() * 5);
    return {seed:it.id, sid:POOL[Math.floor(r() * POOL.length)], kind:it.kind, gi, traits:rollTraits(it, gi), legend:it.legend}; });
  cur = 0; renderGrid(); show(0);
}
function show(i){
  cur = i; const o = items[i];
  specMount(document.getElementById('view'), o);
  document.getElementById('label').innerHTML = `<h2>${SP[o.sid].n}</h2><p>Образец №${o.seed}${o.legend ? ' · легендарный' : ''}</p><p>Тип: ${{crystal:'кристалл', druse:'друза', shard:'обломок'}[o.kind]} · качество ${['C', 'B', 'A', 'AA', 'AAA'][o.gi]}</p>
    ${o.traits.length ? `<div class="tr">${o.traits.map(t => `<span>${TR[t].n}</span>`).join('')}</div>` : ''}
    <div class="btns"><button class="b main" id="next" type="button">Следующий</button><button class="b" id="more" type="button">Новая партия</button></div>`;
  document.getElementById('next').onclick = () => show((cur + 1) % items.length);
  document.getElementById('more').onclick = () => { batch++; makeBatch(); };
  document.querySelectorAll('.grid button').forEach((b, k) => b.classList.toggle('on', k === i));
}
function renderGrid(){
  const g = document.getElementById('grid'); g.innerHTML = items.map((o, k) => `<button type="button" aria-label="${SP[o.sid].n}"><img alt="" data-k="${k}"></button>`).join('');
  g.querySelectorAll('button').forEach((b, k) => b.onclick = () => show(k));
  let k = 0; const step = () => { if (k >= items.length) return; const img = g.querySelector(`img[data-k="${k}"]`); if (img) { const u = specThumb(items[k]); if (u) img.src = u; } k++; setTimeout(step, 40); }; step();
}
if (window.THREE) makeBatch(); else document.getElementById('label').textContent = 'Не удалось загрузить three.js';
</script>
</body>
</html>
