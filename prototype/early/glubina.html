<title>Глубина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one column — camp (mines, stones to open, stock, workshop, museum) and the descent (depth, 5×5 face, tools, haul); a full-screen stage for opening stones */
:root{
  --bg:#17120e; --zglow:rgba(240,178,90,.16); --surface:#221c18; --raise:#2d2520; --line:#463a31; --frame:rgba(42,34,28,.92);
  --fg:#efe6da; --muted:#a8998a; --lamp:#f0b25a; --luck:#7fd8ff; --danger:#ff5a4a; --ok:#9bd17a; --heat:#ff8a3a;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
html{background:var(--bg);color:var(--fg);transition:background-color .8s}
body{background:radial-gradient(ellipse at 50% -5%, var(--zglow), transparent 60%), var(--bg);transition:background-color .8s;color:var(--fg);min-height:100%;
  font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.inrun{background:linear-gradient(color-mix(in srgb, var(--bg) 70%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)), url(../web/img/mine_bg.webp) center top / cover fixed, var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
img{max-width:100%}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}

.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:21px;color:var(--lamp)}
.starsTop{font-family:var(--mono);font-size:13px;color:var(--lamp);white-space:nowrap}
.top-r{display:flex;gap:8px;align-items:center}
.wallet{font-family:var(--display);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}

/* camp */
.hero{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:2.2;background:#1b130d url(../web/img/key_art.webp) center 40% / cover;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 40%, rgba(15,10,7,.85))}
.hero div{position:absolute;left:14px;right:14px;bottom:10px;z-index:2}
.hero b{font-family:var(--display);font-weight:500;font-size:16px;display:block}
.hero span{font-size:12.5px;color:#d9ccbd}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:500;color:var(--muted);position:relative}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs .dot{position:absolute;top:1px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--lamp);color:#1b130b;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:0}
.empty{margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.buy{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.buy:disabled{opacity:.45;cursor:default}
.mines{display:grid;gap:8px}
.mine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.mine.locked{opacity:.55}
.mine-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mine-h b{font-family:var(--display);font-weight:500;font-size:15px}
.mine-h span{font-family:var(--mono);font-size:12.5px;color:var(--lamp);white-space:nowrap}
.mine p{margin:0;font-size:13px;color:var(--muted)}
.feat{display:flex;gap:4px;flex-wrap:wrap}
.feat span{background:var(--raise);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--fg)}
.pool{display:flex;gap:4px;flex-wrap:wrap}
.pool span{display:inline-flex;align-items:center;gap:3px;background:var(--raise);border-radius:8px;padding:2px 7px 2px 2px;font-size:11.5px;color:var(--muted)}
.pool img{width:22px;height:22px;object-fit:contain}
.tasks{display:grid;gap:3px;font-size:12.5px}
.tasks div{display:flex;gap:6px;color:var(--muted)}
.tasks div.done{color:var(--lamp)}
.mine .go{display:grid;grid-template-columns:1fr;gap:6px}
.stones{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;text-align:center}
.st:hover{border-color:var(--lamp)}
.st img{width:64px;height:64px;object-fit:contain}
.st .n{font-size:12px;font-weight:600;line-height:1.2}
.st .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.st .lk{position:absolute;top:5px;left:6px;font-family:var(--mono);font-size:10px;color:var(--luck)}
.st .lvb{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--fc)}
.inv{display:flex;flex-direction:column;gap:6px}
.iv{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.iv img{width:44px;height:44px;object-fit:contain}
.iv b{font-weight:600;font-size:13.5px}
.iv p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.orders{display:grid;gap:6px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
.order img{width:42px;height:42px;object-fit:contain}
.order b{font-weight:600}
.order p{margin:0;font-size:12.5px;color:var(--muted)}
.order .rw{font-family:var(--mono);font-size:13px;color:var(--lamp);white-space:nowrap;text-align:right}
.ups{display:grid;gap:6px}
.up{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.up div{min-width:0}
.up b{font-weight:600}
.up p{margin:0;font-size:12.5px;color:var(--muted)}
.up .req{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.up .req span{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:1px 6px 1px 2px;font-size:11px;font-family:var(--mono)}
.up .req span.ok{border-color:var(--ok);color:var(--ok)}
.up .req span.no{color:var(--danger)}
.up .req img{width:18px;height:18px;object-fit:contain}
.lv{font-family:var(--mono);font-size:11px;color:var(--lamp)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile2:hover{border-color:var(--lamp)}
.tile2 b{font-weight:600}
.tile2 span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pbar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lamp)}

/* run */
.runhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.runhead b{color:var(--fg);font-weight:500}
.depth{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.depth .d{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.depth .d small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.depth .mult{font-family:var(--display);font-weight:500;font-size:20px;color:var(--luck);text-align:right}
.depth .mult small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.zone{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.zone b{color:var(--fg);font-weight:500}
.zbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.zbar i{display:block;height:100%;background:var(--luck);transition:width .2s}
.heat{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--heat)}
.heat .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.heat .bar i{display:block;height:100%;background:linear-gradient(90deg, #ffb347, #ff3a2a);transition:width .2s}
.taskline{display:flex;flex-wrap:wrap;gap:4px}
.taskline span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:color-mix(in srgb, var(--surface) 80%, transparent)}
.taskline span.done{border-color:var(--lamp);color:var(--lamp)}
.ladder{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ladder::-webkit-scrollbar{display:none}
.rung{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;font-size:11.5px;color:var(--muted);white-space:nowrap;background:color-mix(in srgb, var(--surface) 70%, transparent)}
.rung i{width:18px;height:18px;border-radius:50%;background-size:cover;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700}
.rung.t{border-color:var(--lamp);color:var(--lamp)}
.rung.off{opacity:.35}

.board-wrap{position:relative}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--frame);border:1px solid var(--line);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.board.nudge{animation:nudge .25s}
@keyframes nudge{30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.board.quake{animation:quake .9s}
@keyframes quake{10%,30%,50%,70%{transform:translate(-7px,3px) rotate(-.7deg)}20%,40%,60%,80%{transform:translate(7px,-3px) rotate(.7deg)}}
.board.boom{animation:boom .45s}
@keyframes boom{20%{transform:scale(1.02) translate(-3px,2px);filter:brightness(1.5)}60%{transform:translate(3px,-2px)}}
.board.tight{box-shadow:0 0 0 2px color-mix(in srgb, var(--danger) 60%, transparent),0 0 24px color-mix(in srgb, var(--danger) 30%, transparent)}
.board.aim{box-shadow:0 0 0 2px var(--lamp)}
.slot{position:absolute;left:0;top:0;border-radius:9px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 6px rgba(0,0,0,.55)}
.tile{position:absolute;left:0;top:0;transition:transform .12s ease-out;will-change:transform}
.tile .in{position:absolute;inset:0;border-radius:9px;display:grid;place-items:center;overflow:hidden}
.tile.new .in{animation:appear .2s ease-out}
.tile.pop .in{animation:pop .22s ease-out}
.tile.crumble .in{animation:crumble .4s ease-in forwards}
.tile.collect .in{animation:collect .35s ease-in forwards}
@keyframes appear{from{transform:scale(.2);opacity:0}}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes crumble{30%{transform:scale(1.08);filter:brightness(1.4)}100%{transform:scale(.3) rotate(18deg);opacity:0;filter:blur(2px)}}
@keyframes collect{to{transform:translateY(-60%) scale(.4);opacity:0}}
.rockt .in{background-color:var(--rb);background-image:var(--tex);background-size:cover;box-shadow:inset 0 3px 0 rgba(255,240,220,.18),inset 0 -4px 0 rgba(0,0,0,.4)}
.rockt .v{font-family:var(--mono);font-weight:700;font-size:calc(var(--cell) * .34);color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.45);line-height:1;position:relative}
.rockt .nm,.fixt .nm{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:calc(var(--cell) * .115);color:var(--ink, #ddd);opacity:.9;white-space:nowrap}
.rockt.brittle .in::after{content:"";position:absolute;inset:3px;border-radius:7px;border:2px dashed color-mix(in srgb, var(--lamp) 80%, transparent);animation:blink 1.2s infinite}
.rockt.ore .in::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 18% 28%, #ffd75a 0 2.5px, transparent 3.5px),radial-gradient(circle at 72% 62%, #ffd75a 0 3px, transparent 4px),
  radial-gradient(circle at 44% 82%, #fff1a8 0 2px, transparent 3px),radial-gradient(circle at 82% 18%, #ffd75a 0 2px, transparent 3px),radial-gradient(circle at 30% 60%, #ffe58a 0 1.5px, transparent 2.5px);
  animation:glint 1.8s ease-in-out infinite}
@keyframes glint{50%{filter:brightness(1.8)}}
@keyframes blink{50%{opacity:.35}}
.mint .in{background:radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--fc) 30%, #120e0b), #0b0907 78%);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--fc) 50%, transparent),0 0 14px color-mix(in srgb, var(--fc) 26%, transparent);cursor:pointer}
.mint img{width:calc(var(--sz) * 100%);height:calc(var(--sz) * 100%);object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.mint .lv{position:absolute;top:3%;right:7%;font-family:var(--mono);font-weight:700;font-size:calc(var(--cell) * .15);color:var(--fc);text-shadow:0 1px 3px #000}
.mint.max .in{box-shadow:inset 0 0 0 2px var(--lamp),0 0 20px color-mix(in srgb, var(--lamp) 55%, transparent)}
.fixt .in{box-shadow:inset 0 3px 0 rgba(255,255,255,.08),inset 0 -4px 0 rgba(0,0,0,.5)}
.fixt img{width:78%;height:78%;object-fit:contain}
.fixt .ct{position:absolute;top:4%;right:8%;font-family:var(--mono);font-weight:700;font-size:calc(var(--cell) * .17);color:#fff;text-shadow:0 1px 3px #000}
.fost .in{background:radial-gradient(circle at 50% 45%, #5a4c3e, #231c16 80%);box-shadow:inset 0 0 0 2px #c9b08a;cursor:pointer}
.dike .in{background:repeating-linear-gradient(90deg, #2c2b31 0 calc(var(--cell) * .18), #1a191e calc(var(--cell) * .18) calc(var(--cell) * .2)),#26252b}
.dike .ct{font-size:calc(var(--cell) * .24);top:auto;right:auto;position:static;color:#c9c4d6}
.geoc .in{background:radial-gradient(circle at 50% 45%, #4a3a5a, #17121c 80%);box-shadow:inset 0 0 0 2px #b27cff,0 0 12px rgba(178,124,255,.35)}
.water .in{background:radial-gradient(circle at 40% 35%, #5fb4e6, #164a6e 70%, #0d2c44);animation:ripple 2.4s ease-in-out infinite}
.water .in::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.12) 0 2px, transparent 2px 9px)}
@keyframes ripple{50%{filter:brightness(1.15)}}
.gas .in{background:radial-gradient(circle at 50% 50%, #d8e86a, #6d7a1c 60%, #2a2e0c);animation:gasp 1s ease-in-out infinite}
.gas.hot .in{animation-duration:.4s}
@keyframes gasp{50%{filter:brightness(1.3) saturate(1.3)}}
.gas .ct{position:static;font-size:calc(var(--cell) * .3);color:#1a1c06;text-shadow:none}
.magma .in{background:radial-gradient(circle at 50% 50%, #ffd36a, #ff5a1a 45%, #6a1004 85%);animation:glint 1.4s ease-in-out infinite}
.magma .ct{color:#fff3c0}
.float{position:absolute;z-index:6;pointer-events:none;font-family:var(--display);font-weight:700;font-size:15px;color:var(--fc, var(--lamp));text-shadow:0 2px 6px #000;animation:float 1s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes float{to{margin-top:-46px;opacity:0}}

.toast{position:absolute;left:10px;right:10px;top:10px;z-index:5;display:flex;gap:10px;align-items:center;pointer-events:none;
  background:color-mix(in srgb, var(--bg) 93%, transparent);border:1px solid var(--tc);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px color-mix(in srgb, var(--tc) 35%, transparent);animation:tin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes tin{from{transform:translateY(-10px) scale(.95);opacity:0}}
.toast .ic{width:42px;height:42px;flex:none}
.toast .ic:empty{display:none}
.toast .ic img{width:100%;height:100%;object-fit:contain}
.toast b{display:block;font-family:var(--display);font-weight:500;font-size:14px}
.toast span{font-size:12.5px;color:var(--muted)}
.toast span em{font-style:normal;color:var(--tc);font-weight:600}

.status{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--fg);font-weight:500;font-family:var(--mono)}
.status .warn{color:var(--danger)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px}
.tool small{font-size:11px;color:var(--muted);font-weight:400}
.tool.on{background:color-mix(in srgb, var(--lamp) 18%, var(--surface));border-color:var(--lamp)}
.tool:disabled{opacity:.38;cursor:default}
.haul{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.haul-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.haul-h b{font-family:var(--mono);font-size:13px;color:var(--fg);letter-spacing:0;text-transform:none}
.bag{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;align-items:center}
.bag .it{width:36px;height:36px;border-radius:8px;background:var(--raise);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--fc) 50%, transparent)}
.bag .it img,.bag .it svg{width:30px;height:30px;object-fit:contain}
.bag .it small{position:absolute;bottom:-1px;right:2px;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--fc);text-shadow:0 1px 2px #000}
.bag .empty{font-size:13px;color:var(--muted)}
.btn{background:var(--lamp);color:#1b130b;border:0;border-radius:10px;padding:12px;font-weight:600}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,6,5,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-head h2{font-family:var(--display);font-weight:500;font-size:20px;margin:2px 0 0;text-wrap:balance}
.x{background:var(--raise);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:4px 0 0;font-weight:500}
.total{background:var(--raise);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.total b{font-family:var(--display);font-weight:700;font-size:28px;color:var(--lamp);font-variant-numeric:tabular-nums}
.total span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{display:inline-flex;align-items:center;gap:4px;background:var(--raise);border-radius:8px;padding:3px 8px 3px 3px;font-size:12px}
.mini img{width:28px;height:28px;object-fit:contain}
.recs{display:flex;flex-wrap:wrap;gap:6px}

const boardEl = $('#board');

function layout(){

function place(t){ t.el.style.transform = `translate(${gap + t.c * (cell + gap)}px,${gap + t.r * (cell + gap)}px)`; }
const center = (r, c) => [gap + c * (cell + gap) + cell / 2, gap + r * (cell + gap) + cell / 2];

function makeTile(r, c, props, quiet){

function removeTile(t, cls, delay = 400){

const neigh4 = (r, c) => [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && a < N && b >= 0 && b < N);

function empties(){ const out = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]); return out; }
function featOn(k){ const f = S.mine.feat[k]; return f && f.p && (!f.z || (S.zone >= f.z[0] && S.zone <= f.z[1])) ? f.p : 0; }
function spawn(){
  const e = empties(); if (!e.length) return null;
  const [r, c] = e[ri(0, e.length - 1)];
  let roll = Math.random();
  const minChance = .08 + S.zone * .01 + .02 * save.up.lamp;
  if (roll < minChance) {
    const avail = S.mine.pool.filter(([, d]) => S.depth >= d);
    const fam = pickW(avail.map(([id, d, w]) => [id, w * (1 + (S.depth - d) / 300)]));

  }
  roll -= minChance;
  for (const k of ['fossil', 'geodec', 'water', 'gas', 'magma', 'dike']) {

    if (p && roll < p) {

function canMerge(a, b){ if (!a || !b || a.kind !== b.kind) return false; if (a.kind === 'rock') return a.v === b.v; if (a.kind === 'min') return a.fam === b.fam && a.lvl === b.lvl && a.lvl < MAXLV; return false; }

function slide(dir){
  const [dr, dc] = {left:[0, -1], right:[0, 1], up:[-1, 0], down:[1, 0]}[dir];
  const idxs = [...Array(N).keys()];
  const rows = dr === 1 ? idxs.slice().reverse() : idxs, cols = dc === 1 ? idxs.slice().reverse() : idxs;
  let moved = false; const merged = new Set(), events = [];

    let nr = r, nc = c, into = null;
    while (true) {
      const tr = nr + dr, tc = nc + dc;
      if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
      const o = grid[tr][tc];
      if (!o) { nr = tr; nc = tc; continue; }
      if (canMerge(t, o) && !merged.has(o.id)) { nr = tr; nc = tc; into = o; }
      break;
    }
    if (nr === r && nc === c) continue;
    moved = true; grid[r][c] = null; t.r = nr; t.c = nc;
    if (into) { merged.add(into.id); events.push({into, from:t}); }

}

const KEYS = ['kind', 'v', 'ore', 'fam', 'lvl', 'ttl', 'hp', 'tick'];
function snapshot(){
  return {tiles:[...tiles.values()].map(t => { const o = {r:t.r, c:t.c}; KEYS.forEach(k => { if (t[k] !== undefined) o[k] = t[k]; }); return o; }),
    depth:S.depth, moves:S.moves, cash:S.cash, zone:S.zone, heat:S.heat};
}
function restore(s){
  tiles.forEach(t => t.el.remove());

  Object.assign(S, {depth:s.depth, moves:s.moves, cash:s.cash, zone:s.zone, heat:s.heat});
  applyZone();
  for (const t of s.tiles) { const {r, c, ...p} = t; makeTile(r, c, p, true); }
}

function move(dir){
  if (lock || !S || S.over) return;
  const before = snapshot();
  const {moved, events} = slide(dir);
  if (!moved) { anim(boardEl, 'nudge'); SFX.bump(); return; }
  snap = before;
  lock = true;
  setTool(null);
  SFX.slide();
  tiles.forEach(place);
  S.moves++; S.depth += STEP;
  if (heatMax()) S.heat++;
  setTimeout(() => {
    try { afterMove(events); } finally { lock = false; }
    if (heatMax() && S.heat >= heatMax()) return jam('heat');
    if (isJammed()) jam();
  }, 125);
}

function afterMove(events){
  let maxV = 0, minLvl = 0, minTile = null;
  for (const {into, from} of events) {
    tiles.delete(from.id); from.el.remove();
    if (into.kind === 'rock') { into.v *= 2; into.ore = into.ore || from.ore; maxV = Math.max(maxV, into.v); FX.merge(into.r, into.c, ROCK[Math.min(into.v, 128)].base, into.v >= 16); }
    else { into.lvl++; if (into.lvl > minLvl) { minLvl = into.lvl; minTile = into; } FX.mineral(into.r, into.c, MIN[into.fam].color, into.lvl); }
    drawTile(into); anim(into.el, 'pop');
    // merges next to a closed geode chip away at its crust
    for (const [a, b] of neigh4(into.r, into.c)) { const g = grid[a][b]; if (g && g.kind === 'geodec' && g.hp > 0) { g.hp--; if (g.hp <= 0) openGeode(g); else { drawTile(g); anim(g.el, 'pop'); } } }
  }

  if (minLvl) { SFX.mineral(minLvl); if (minLvl >= 4) toast(minImg(minTile.fam, false), minName(minTile.fam, minLvl), minLvl < MAXLV ? 'Сольёте ещё раз — уровень выше, но место занято.' : 'Максимальный уровень.', MIN[minTile.fam].color); }

    if (!tiles.has(t.id)) return;

      floatText(t.r, t.c, `+${fmt(gain)} ₽`, t.ore ? '#ffd75a' : null);
      FX.crumble(t.r, t.c, ROCK[Math.min(t.v, 128)].base, t.ore);

    } else if (t.kind === 'dike') { t.ttl--; if (t.ttl <= 0) { floatText(t.r, t.c, 'выветрилась'); removeTile(t, 'crumble'); } else drawTile(t); }

    else if (t.kind === 'water') { t.tick++; if (t.tick % 5 === 0) spreadWater(t); }
    else if (t.kind === 'magma') {
      t.ttl--; t.tick++;

}
function isJammed(){ return !canAnyMove() && !(S.tools.hammer > 0 || S.tools.tnt > 0 || (S.tools.undo > 0 && snap)); }

/* ---------- taps & tools ---------- */
function setTool(t){ if (!S) return; S.tool = t; boardEl.classList.toggle('aim', !!t); document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); }
function onTileTap(t){

    floatText(t.r, t.c, t.kind === 'gas' ? 'обезврежен' : t.kind === 'geodec' ? 'жеода расколота' : 'бах');
    if (t.kind === 'geodec') openGeode(t); else removeTile(t, 'crumble');
    setTool(null); hud(); return;
  }
  if (S.tool === 'tnt') {
    S.tools.tnt--; snap = null; S.tntUsed++; SFX.boom(); anim(boardEl, 'boom'); FX.boom(t.r, t.c);
    for (let r = t.r - 1; r <= t.r + 1; r++) for (let c = t.c - 1; c <= t.c + 1; c++) { const o = grid[r] && grid[r][c]; if (o && o.kind !== 'min' && o.kind !== 'fossil') { if (o.kind === 'geodec') openGeode(o); else removeTile(o, 'crumble'); } }
    setTool(null); hud(); return;
  }
  if (t.kind === 'min') collect(t);
  if (t.kind === 'fossil') collectFossil(t);
}
function collect(t){

}

function undo(){

/* ---------- run HUD ---------- */

function finishStats(){
  save.st.runs++;
  save.st.maxDepth = Math.max(save.st.maxDepth, S.depth);
  save.st.maxCombo = Math.max(save.st.maxCombo, S.maxCombo);

}
function toRough(x){ save.cat++; return {id:save.cat, fam:x.fam, lvl:x.lvl, geode:!!x.geode, luck:+(luck() + (x.geode ? .5 : 0)).toFixed(2), mine:S.mine.id, seed:ri(1, 1e9)}; }

function ascend(){
  if (!S || S.over || lock) return;
  S.over = true;
  finishStats();
  const m = luck(), cash = Math.round(S.cash * m);
  const stones = S.bag.map(toRough);
  save.rough.push(...stones);
  save.wallet += cash; save.st.earned += cash; save.st.ups++; save.st.mines[S.mine.id] = 1;
  if (S.bag.some(x => x.lvl === MAXLV)) save.st.geodes++;

  const unlocked = MINES.filter(mm => mm.stars > before && mm.stars <= starCount()).map(mm => mm.name);

    ${unlocked.length ? `<p class="note" style="color:var(--lamp)">Открыта шахта: ${unlocked.join(', ')}</p>` : ''}
    <div class="total"><b>${stones.length} ${plural(stones.length, 'образец', 'образца', 'образцов')}</b><span>удача при вскрытии ×${fmt2(m)} · выработка ${fmt(cash)} ₽</span></div>
    ${stones.length ? `<div class="mini">${stones.map(s => `<span>${minImg(s.fam, false)}${minName(s.fam, s.lvl)}</span>`).join('')}</div>` : ''}
    ${S.fossils.length ? `<p class="note muted">Окаменелости: ${S.fossils.map(id => FOSM[id].name).join(', ')}</p>` : ''}
    <div class="two"><button type="button" class="${stones.length ? 'ghost' : 'btn'}" data-again>Ещё спуск</button><button type="button" class="${stones.length ? 'btn' : 'ghost'}" data-open-camp>${stones.length ? 'Вскрывать' : 'В лагерь'}</button></div>`, true);
  checkAch();
}

function jam(kind){
  if (S.over) return;
  S.over = true;
  finishStats();
  save.st.jams++;
  const keepN = save.up.cage, keepCash = Math.round(S.cash * luck() * .2 * save.up.cage);
  const pool = S.bag.slice(), saved = [];

  setTimeout(() => {
    openPanel(`${head(`${S.mine.name} · ${S.depth} м`, `<span style="color:var(--danger)">${heat ? 'Тепловой удар' : 'Забой завален'}</span>`, false)}
      <p class="note">${heat ? 'Жара в пещере стала невыносимой, бригаду пришлось эвакуировать.' : 'Ходов и инструментов не осталось: всё забито породой, которая не сливается.'}</p>
      ${pool.length ? `<h3>Осталось внизу</h3><div class="mini">${pool.map(x => `<span>${minImg(x.fam, false)}${minName(x.fam, x.lvl)}</span>`).join('')}</div>` : ''}
      ${stones.length || keepCash ? `<p class="note">Спасательная клеть подняла: ${stones.map(s => minName(s.fam, s.lvl)).join(', ') || 'образцов нет'}${keepCash ? ` и ${fmt(keepCash)} ₽` : ''}.</p>` : ''}
      <div class="two"><button type="button" class="ghost" data-camp>В лагерь</button><button type="button" class="btn" data-again>Ещё спуск</button></div>`, true);

}

/* ---------- opening ---------- */
const stage = $('#stage');
let ST = null;
function resolve(r){
  const loupe = 1 + .3 * save.up.loupe;
  const variant = Math.random() < Math.min(.45, .012 * r.lvl * r.luck * loupe);
  const gi = pickW(GR.map((x, k) => [k, x.w * Math.pow(1 + .25 * save.up.saw, k) * Math.pow(r.luck, k * .35)]));
  const value = Math.round(baseValue(r.fam, r.lvl) * GR[gi].m * (variant ? MIN[r.fam].variant.m : 1));
  const mu = save.museum[r.fam] || {max:0, variant:0, best:-1};
  const isNew = r.lvl > mu.max || (variant && r.lvl > mu.variant);
  mu.max = Math.max(mu.max, r.lvl); if (variant) mu.variant = Math.max(mu.variant, r.lvl); mu.best = Math.max(mu.best, gi);
  save.museum[r.fam] = mu;
  save.st.opened++; if (variant) save.st.variants++; if (gi === 4) save.st.aaa++;
  const rec = [];
  if (!save.st.bestFind || value > save.st.bestFind.value) { if (save.st.bestFind) rec.push('Лучшая находка'); save.st.bestFind = {name:specName({...r, variant}), value}; }
  r.res = {variant, gi, value, isNew, rec};
  persist();
}
function openStone(id){

      <div class="t">${r.geode ? 'Жеода: ' : ''}${minName(r.fam, r.lvl)}</div>
      <div class="s">Необработанный, уровень ${ROMAN[r.lvl - 1]} · <span class="lk">удача ×${fmt2(r.luck)}</span></div></div>
    <button type="button" class="stone" id="stone" aria-label="Расколоть образец" style="--glow:${m.color}">

    </button>
    <div class="st-bottom" id="stBottom"><div class="tap-hint">Нажмите на камень, чтобы расколоть</div></div>`;

}
function hitStone(){
  if (!ST || ST.busy || ST.phase >= 3) return;
  const r = ST.r, st = $('#stone');
  ST.phase++;
  anim(st, 'hit');
  SFX.crack(ST.phase);
  { const [x, y] = elXY(st); burst(x, y, {n:8 + ST.phase * 6, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:3 + ST.phase * 1.5, lift:2, grav:.3, size:5, life:40}); }
  if (!r.res) resolve(r);
  if (ST.phase === 1) {

    st.style.setProperty('--ho', '.35');
    $('#stBottom').innerHTML = '<div class="tap-hint">Ещё удар</div>';
  } else if (ST.phase === 2) {
    // light through the cracks: a rare variety glows in its own colour, high grades glow brighter
    const v = r.res.variant;
    st.style.setProperty('--glow', v ? MIN[r.fam].variant.c : r.res.gi >= 3 ? GR_C[r.res.gi] : MIN[r.fam].color);
    st.style.setProperty('--ho', v || r.res.gi >= 3 ? '1' : '.55');
    $('#cracks').innerHTML = crackPaths(r.seed, 6).map(d => `<path d="${d}"/>`).join('');
    $('#stBottom').innerHTML = '<div class="tap-hint">Последний удар</div>';
  } else { ST.busy = true; showResult(false); }
}
function showResult(instant){
  const r = ST.r, res = r.res, m = MIN[r.fam], st = $('#stone');
  const tc = res.variant ? m.variant.c : GR_C[res.gi];
  st.style.setProperty('--tc', tc); st.style.setProperty('--ho', '0');
  const tws = Array.from({length:7}, (_, k) => `<i class="tw" style="left:${8 + (k * 37) % 84}%;top:${10 + (k * 53) % 80}%;--d:${(k * .27).toFixed(2)}s"></i>`).join('');
  st.innerHTML = `<div class="rays"></div>${instant ? '' : '<div class="burst"></div>'}<div class="gem">${minImg(r.fam, res.variant)}</div>${tws}`;
  if (!instant) {
    SFX.reveal(res.variant);
    const [x, y] = elXY(st);
    burst(x, y, {n:26, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:8, lift:2, grav:.35, size:7, life:45});
    burst(x, y, {n:res.variant ? 50 : 22, colors:[tc, '#ffffff'], kind:'spark', speed:res.variant ? 7 : 5, grav:.02, size:3.5, life:60});
  }
  $('#stBottom').innerHTML = `<div class="res" style="--tc:${tc}">
      <div class="tier">${res.variant ? 'Редкая разновидность' : m.name}${res.isNew ? ' · новое в музее' : ''}</div>
      <div class="nm">${res.variant ? m.variant.name : minName(r.fam, r.lvl)}</div>
      <div class="grade"><span class="gl">Качество</span><span class="gv" id="gv">${instant ? GR[res.gi].n : '…'}</span></div></div><div id="after"></div>`;

    k++; delay *= 1.12; setTimeout(spin, delay);
  };
  setTimeout(spin, 450);
}
function finishResult(){
  const r = ST.r, res = r.res, item = {fam:r.fam, lvl:r.lvl, variant:res.variant, gi:res.gi};
  const o = save.orders.find(x => fitsOrder(item, x));
  const more = save.rough.filter(x => x.id !== r.id).length;
  $('#after').innerHTML = `<div class="res" style="gap:6px"><div class="val" id="valc">${fmt(res.value)} ₽</div>
      ${res.rec.length ? `<div class="recs">${res.rec.map(x => `<span class="rec">★ ${x}</span>`).join('')}</div>` : ''}</div>
    <div class="acts" style="margin-top:8px">
      ${o ? `<button type="button" class="btn" data-act="order">Отдать по заказу · ${fmt(Math.max(o.pay, res.value))} ₽</button>` : ''}
      <div class="two"><button type="button" class="${o ? 'ghost' : 'btn'}" data-act="sell">Продать · ${fmt(res.value)} ₽</button><button type="button" class="ghost" data-act="keep">На склад</button></div>
      <div class="muted" style="text-align:center;font-size:12.5px">${more ? `Ещё ${more} ${plural(more, 'образец ждёт', 'образца ждут', 'образцов ждут')} вскрытия` : 'Это был последний образец'} · на складе образцы нужны для мастерской и заказов</div></div>`;
  ST.busy = false;
  const vc = $('#valc');
  if (vc && !r.res.shown) { r.res.shown = true; tween(0, res.value, 700, v => { vc.textContent = fmt(v) + ' ₽'; }); }
  $('#after').classList.add('fx-in');
  checkAch();
}
function decide(act){
  const r = ST.r, res = r.res;
  if (act === 'sell') { save.wallet += res.value; save.st.earned += res.value; SFX.coin(); }
  if (act === 'keep') { save.inv.push({id:r.id, fam:r.fam, lvl:r.lvl, variant:res.variant, gi:res.gi, value:res.value}); SFX.collect(); }
  if (act === 'order') {
    const oi = save.orders.findIndex(o => fitsOrder({fam:r.fam, lvl:r.lvl, gi:res.gi}, o)); if (oi < 0) return;
    const v = Math.max(save.orders[oi].pay, res.value);
    save.wallet += v; save.st.earned += v; save.st.orders++; save.orders.splice(oi, 1); fillOrders(); SFX.coin(); SFX.star();
  }
  save.rough = save.rough.filter(x => x.id !== r.id);
  checkAch(); persist();
  const next = save.rough.find(x => !x.res) || save.rough[0];
  if (next) openStone(next.id); else { stage.hidden = true; ST = null; showCamp('stones'); }
  renderTop();
}

      <div class="mines">${MINES.map(m => {
        const locked = stars < m.stars, arr = save.stars[m.id] || [];
        return `<div class="mine${locked ? ' locked' : ''}">
          <div class="mine-h"><b>${locked ? '🔒 ' : ''}${m.name}</b><span>${locked ? `нужно ★ ${m.stars}` : m.fee ? `вход ${fmt(m.fee)} ₽` : 'бесплатно'}</span></div>
          <p>${m.hint}</p>
          <div class="feat">${Object.keys(m.feat).map(k => `<span>${FEAT_NAMES[k]}</span>`).join('')}</div>
          <div class="pool">${m.pool.map(([f, d]) => `<span>${minImg(f, false)}${MIN[f].name}${d ? ` · ${d} м` : ''}</span>`).join('')}</div>
          <div class="tasks">${m.tasks.map((k, i) => `<div class="${arr[i] ? 'done' : ''}">${arr[i] ? '★' : '☆'} ${taskText(k)}</div>`).join('')}</div>
          ${locked ? '' : `<div class="go"><button type="button" class="btn" data-mine="${m.id}"${save.wallet < m.fee ? ' disabled' : ''}>Спуститься</button></div>`}
        </div>`;
      }).join('')}</div>`;
  } else if (campTab === 'stones') {
    body = `<div class="sec-h"><h2>Образцы на вскрытие</h2><span class="muted">${save.rough.length}</span></div>
      ${save.rough.length ? `<div class="stones">${save.rough.map(r => `<button type="button" class="st" data-open="${r.id}" style="--fc:${MIN[r.fam].color}"><span class="lk">×${fmt2(r.luck)}</span><span class="lvb">${ROMAN[r.lvl - 1]}</span><img src="${IMG(r.geode ? 'geode' : 'nodule')}" alt=""><span class="n">${MIN[r.fam].name}</span><span class="m">${r.res ? 'вскрыт' : minName(r.fam, r.lvl)}</span></button>`).join('')}</div>
        <button type="button" class="btn" data-openall>Вскрывать по очереди</button>` : '<p class="empty">Пока нечего вскрывать. Спуститесь в шахту, заберите минералы и поднимитесь до завала.</p>'}
      <div class="sec-h"><h2>Заказы коллекционеров</h2><button type="button" class="buy" data-reorder${save.wallet < 150 ? ' disabled' : ''}>Новые · 150 ₽</button></div>
      <div class="orders">${orderCards()}</div>`;
  } else if (campTab === 'stock') {
    const inv = save.inv.slice().sort((a, b) => a.fam.localeCompare(b.fam) || b.lvl - a.lvl || b.gi - a.gi);
    body = `<div class="sec-h"><h2>Склад</h2><span class="muted">${inv.length} ${plural(inv.length, 'образец', 'образца', 'образцов')}</span></div>
      <p class="hint">Образцы со склада идут в мастерскую и на заказы. Лишнее можно продать.</p>
      ${inv.length ? `<div class="inv">${inv.map(x => `<div class="iv">${minImg(x.fam, x.variant)}<div><b>${specName(x)}</b><p>качество ${GR[x.gi].n} · № ${String(x.id).padStart(4, '0')}</p></div><button type="button" class="buy" data-sellinv="${x.id}">${fmt(x.value)} ₽</button></div>`).join('')}</div>` : '<p class="empty">Склад пуст. После вскрытия нажмите «На склад».</p>'}
      <div class="sec-h"><h2>Заказы коллекционеров</h2></div><div class="orders">${orderCards()}</div>`;
  } else if (campTab === 'shop') {
    body = `<div class="sec-h"><h2>Мастерская</h2><span class="muted" style="font-size:12px">деньги + образцы со склада</span></div>
      <div class="ups">${UPS.map(u => {
        const lv = save.up[u.id], max = lv >= u.lv.length, next = u.lv[lv];
        const locked = !max && stars < next.s, okMat = !max && invCount(next.m[0], next.m[1]) >= next.m[2];
        return `<div class="up"><div><b>${u.name}</b> <span class="lv">${lv}/${u.lv.length}</span><p>${u.d(lv)}</p>${max ? '' : `<div class="req">${locked ? `<span class="no">нужно ★ ${next.s}</span>` : reqHTML(next.m)}</div>`}</div>
          <button type="button" class="buy" data-buy="${u.id}"${max || locked || !okMat || save.wallet < next.c ? ' disabled' : ''}>${max ? 'макс.' : fmt(next.c) + ' ₽'}</button></div>`;
      }).join('')}</div>`;
  } else {
    const levels = Object.keys(MIN).length * 6, got = Object.values(save.museum).reduce((s, f) => s + f.max + (f.variant ? 1 : 0), 0);
    const fos = FOSSILS.filter(f => save.fos[f.id]).length, ach = ACH.filter(a => save.ach[a.id]).length;
    const t = (k, n, a, b) => `<button type="button" class="tile2" data-sheet="${k}"><b>${n}</b><span>${a} из ${b}</span><div class="pbar"><i style="width:${a / b * 100}%"></i></div></button>`;
    body = `<div class="sec-h"><h2>Музей</h2></div>
      <div class="tiles2">${t('col', 'Минералы', got, levels)}${t('fos', 'Окаменелости', fos, FOSSILS.length)}${t('ach', 'Вехи', ach, ACH.length)}
        <button type="button" class="tile2" data-sheet="rec"><b>Рекорды</b><span>${save.st.runs} ${plural(save.st.runs, 'спуск', 'спуска', 'спусков')}</span></button>
        <button type="button" class="tile2" data-sheet="help"><b>Правила</b><span>как играть</span></button></div>`;
  }
  $('#camp').innerHTML = `<nav class="tabs">${tabs.map(([id, n, c]) => `<button type="button" data-tab="${id}" class="${campTab === id ? 'on' : ''}">${n}${c ? `<span class="dot">${c}</span>` : ''}</button>`).join('')}</nav>${body}`;
  if (lastTab !== campTab) {
    lastTab = campTab;
    let i = 0;
    $('#camp').querySelectorAll('.hero, .sec-h, .hint, .empty, .mines > *, .stones > *, .inv > *, .ups > *, .orders > *, .tiles2 > *').forEach(el => { el.classList.add('fx-in'); el.style.setProperty('--i', Math.min(i++, 12)); });
  }
}
let lastTab = null;

function startRun(id){
  const m = MINEM[id];
  if (!m || starCount() < m.stars || save.wallet < m.fee) return;
  save.wallet -= m.fee; save.lastMine = id; persist();
  closeSheet();
  $('#camp').hidden = true; $('#run').hidden = false;
  document.body.classList.add('inrun');
  boardEl.innerHTML = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const s = document.createElement('div'); s.className = 'slot'; s.dataset.r = r; s.dataset.c = c; boardEl.appendChild(s); }
  grid = Array.from({length:N}, () => Array(N).fill(null));
  tiles = new Map(); snap = null;
  const startDepth = 40 * save.up.drill;
  S = {mine:m, depth:startDepth, moves:0, cash:0, bag:[], fossils:[], geodes:0, heat:0, over:false, zone:zoneAt(startDepth), maxCombo:0, ore:0, tntUsed:0, tool:null,
    tools:{hammer:1 + save.up.hammer, tnt:save.up.tnt, undo:1 + save.up.undo}};
  $('#mineName').textContent = m.name;
  $('#runNo').textContent = `спуск № ${save.st.runs + 1}`;
  applyZone();
  layout();
  for (let k = 0; k < 2; k++) { const e = empties(), [r, c] = e[ri(0, e.length - 1)]; makeTile(r, c, {kind:'rock', v:2}); }
  setTool(null);
  hud(); window.scrollTo(0, 0);
}

/* ---------- sheets ---------- */
const sheet = $('#sheet'), panel = $('#panel');
let sheetLocked = false;
function openPanel(html, locked){ panel.innerHTML = html; sheet.hidden = false; panel.scrollTop = 0; sheetLocked = !!locked; }
function closeSheet(){ sheet.hidden = true; sheetLocked = false; }
const head = (eyebrow, t, closable = true) => `<div class="p-head"><div><div class="eyebrow">${eyebrow}</div><h2>${t}</h2></div>${closable ? '<button type="button" class="x" data-close aria-label="Закрыть">✕</button>' : ''}</div>`;
function openCollection(){
  openPanel(`${head('Музей', 'Минералы')}
    ${Object.entries(MIN).map(([id, m]) => { const f = save.museum[id] || {max:0, variant:0, best:-1}; const where = MINES.filter(x => x.pool.some(([p]) => p === id)).map(x => x.name).join(', ');
      return `<div class="fam"><div class="fam-h">${m.name}<span>${where}${f.best >= 0 ? ` · лучшее ${GR[f.best].n}` : ''}</span></div>
      <div class="fam-row">${[1, 2, 3, 4, 5].map(l => `<div class="${f.max >= l ? '' : 'lock'}" title="${minName(id, l)}">${minImg(id, false)}<small>${ROMAN[l - 1]}</small></div>`).join('')}
        <div class="${f.variant ? 'vv' : 'lock'}" title="${m.variant.name}">${minImg(id, true)}<small>${f.variant ? ROMAN[f.variant - 1] : '?'}</small></div></div></div>`; }).join('')}`);
}
function openFossils(){
  openPanel(`${head('Музей', 'Окаменелости')}
    <p class="note muted">Встречаются в верхних слоях. Не двигаются при свайпе и мешают, пока их не заберёшь. Вид узнаёшь, когда заберёшь.</p>
    <div class="coll">${FOSSILS.map(f => save.fos[f.id]
      ? `<div class="cc">${fossilIcon(f)}<div class="n">${f.name}</div><div class="m">×${save.fos[f.id]} · ${fmt(f.p)} ₽</div></div>`
      : `<div class="cc lock">${fossilSVG(f)}<div class="n muted">???</div><div class="m">${f.w < 10 ? 'редкая' : 'обычная'}</div></div>`).join('')}</div>`);
}
function openAch(){ openPanel(`${head('Музей', 'Вехи')}<div class="inv">${ACH.map(a => `<div class="ach${save.ach[a.id] ? ' got' : ''}"><div><b>${save.ach[a.id] ? '✓ ' : ''}${a.name}</b><p>${a.d}</p></div><span class="rw">+${fmt(a.r)} ₽</span></div>`).join('')}</div>`); }
function openRecords(){
  const r = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`, s = save.st;
  openPanel(`${head('Музей', 'Рекорды')}<div class="rows">
    ${r('Максимальная глубина', s.maxDepth + ' м')}${r('Лучшая находка', s.bestFind ? `${s.bestFind.name}, ${fmt(s.bestFind.value)} ₽` : '—')}
    ${r('Самая длинная цепь', s.maxCombo ? '×' + s.maxCombo : '—')}${r('Вскрыто образцов', s.opened)}${r('Редких разновидностей', s.variants)}${r('Качество AAA', s.aaa)}
    ${r('Спусков', s.runs)}${r('Подъёмов', s.ups)}${r('Завалов', s.jams)}${r('Заработано всего', fmt(s.earned) + ' ₽')}
    </div><button type="button" class="ghost" data-reset>Сбросить прогресс</button>`);
}
function openHelp(){
  save.help = true; persist();
  openPanel(`${head('Как играть', 'Спуск')}
    <ul class="help">
      <li>Свайпайте, как в 2048. Каждый ход — ещё 5 метров вниз и больше удачи.</li>
      <li>Одинаковая порода сливается: песчаник 2 + песчаник 2 = гранит 4 и дальше до кимберлита. Блок на пороге дробления крошится и приносит выработку. Пунктир — следующее слияние его раскрошит. Рудные блоки с искрами дают впятеро больше.</li>
      <li>Минералы сливаются в 5 уровней. Нажмите на минерал, чтобы забрать в рюкзак. Это необработанный образец: качество и редкая разновидность выпадут при вскрытии в лагере, и удача глубины на них работает.</li>
      <li>Особые клетки не двигаются. Окаменелость забирают. Закрытая жеода раскрывается от трёх слияний рядом. Вода разливается, газ взрывается по таймеру, магма прессует соседнюю породу. Дайки выветриваются со временем.</li>
      <li>Молоток разбивает блок (и обезвреживает газ), динамит расчищает 3×3, откат отменяет ход.</li>
      <li>Подняться можно в любой момент. Если ходов и инструментов не осталось, забой завален, рюкзак пропадает.</li>
      <li>В каждой шахте три задания. Звёзды открывают новые шахты и уровни снаряжения. Мастерская берёт деньги и образцы со склада.</li>
    </ul>
    <button type="button" class="btn" data-close>Понятно</button>`);
}

/* ---------- input ---------- */
let p0 = null;
boardEl.addEventListener('pointerdown', e => { p0 = {x:e.clientX, y:e.clientY}; });
boardEl.addEventListener('pointerup', e => {
  if (!p0 || !S) return;
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y; p0 = null;
  if (Math.hypot(dx, dy) < 14) { const el = e.target.closest('.tile[data-id]'), t = el && tiles.get(+el.dataset.id); if (t) onTileTap(t); return; }
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
boardEl.addEventListener('pointercancel', () => { p0 = null; });
document.addEventListener('keydown', e => {
  if (!sheet.hidden) { if (e.key === 'Escape' && !sheetLocked) closeSheet(); return; }
  if (!stage.hidden) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hitStone(); } return; }
  if (!S) return;
  const k = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down'}[e.key];
  if (k) { e.preventDefault(); move(k); }
  if (e.key === 'Escape') setTool(null);
});
$('#tools').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b || b.disabled || !S) return;
  const k = b.dataset.tool;
  if (k === 'undo') return undo();
  setTool(S.tool === k ? null : k);
  if (S.tool) toast('', k === 'hammer' ? 'Молоток' : 'Динамит', k === 'hammer' ? 'Нажмите на блок: порода, дайка, вода, газ или жеода.' : 'Нажмите на центр квадрата 3×3. Минералы и окаменелости уцелеют.', 'var(--lamp)');
});
$('#btnUp').addEventListener('click', ascend);
$('#mute').addEventListener('click', () => { save.mute = !save.mute; persist(); renderTop(); });
$('#camp').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { campTab = t.dataset.tab; return renderCamp(); }
  const m = e.target.closest('[data-mine]'); if (m && !m.disabled) return startRun(m.dataset.mine);
  const o = e.target.closest('[data-open]'); if (o) return openStone(+o.dataset.open);
  if (e.target.closest('[data-openall]')) { const r = save.rough.find(x => !x.res) || save.rough[0]; if (r) openStone(r.id); return; }
  if (e.target.closest('[data-reorder]') && save.wallet >= 150) { save.wallet -= 150; save.orders = []; fillOrders(); persist(); renderCamp(); renderTop(); return; }
  const g = e.target.closest('[data-give]');
  if (g) {
    const oi = +g.dataset.give, ord = save.orders[oi], x = save.inv.filter(y => fitsOrder(y, ord)).sort((a, b) => a.value - b.value)[0];
    if (x) { const v = Math.max(ord.pay, x.value); save.inv = save.inv.filter(y => y.id !== x.id); save.wallet += v; save.st.earned += v; save.st.orders++; save.orders.splice(oi, 1); fillOrders(); SFX.coin(); gtoast('Заказ выполнен', `${specName(x)} · +${fmt(v)} ₽`); checkAch(); renderCamp(); renderTop(); }
    return;
  }
  const si = e.target.closest('[data-sellinv]');
  if (si) { const id = +si.dataset.sellinv, x = save.inv.find(y => y.id === id); if (x) { save.inv = save.inv.filter(y => y.id !== id); save.wallet += x.value; save.st.earned += x.value; SFX.coin(); persist(); renderCamp(); renderTop(); } return; }
  const b = e.target.closest('[data-buy]');
  if (b && !b.disabled) {
    const u = UPS.find(x => x.id === b.dataset.buy), lv = save.up[u.id], next = u.lv[lv];
    if (next && save.wallet >= next.c && starCount() >= next.s && invCount(next.m[0], next.m[1]) >= next.m[2]) {
      FX.at(b, ['#f0b25a', '#fff1a8', '#ffffff']);
      save.wallet -= next.c; payReq(next.m); save.up[u.id]++; persist(); SFX.star();
      gtoast(`${u.name}: уровень ${save.up[u.id]}`, u.d(save.up[u.id])); renderCamp(); renderTop();
    }
    return;
  }
  const sh = e.target.closest('[data-sheet]'); if (sh) ({col:openCollection, fos:openFossils, ach:openAch, rec:openRecords, help:openHelp})[sh.dataset.sheet]();
});
stage.addEventListener('click', e => {
  if (e.target.closest('#stone')) return hitStone();
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'back') { if (ST && ST.busy) return; stage.hidden = true; ST = null; return showCamp('stones'); }
  if (a) decide(a.dataset.act);
});
sheet.addEventListener('click', e => {
  if (e.target.closest('[data-camp]')) { closeSheet(); return showCamp(); }
  if (e.target.closest('[data-open-camp]')) { closeSheet(); showCamp('stones'); const r = save.rough.find(x => !x.res); if (r) openStone(r.id); return; }
  if (e.target.closest('[data-again]')) {
    const id = S ? S.mine.id : save.lastMine, m = MINEM[id];
    if (save.wallet >= m.fee) return startRun(id);
    closeSheet(); return showCamp();
  }
  const rs = e.target.closest('[data-reset]');
  if (rs) {
    if (rs.dataset.armed) { save = Object.assign(BLANK(), {help:true}); persist(); closeSheet(); showCamp('mines'); }
    else { rs.dataset.armed = '1'; rs.textContent = 'Нажмите ещё раз, чтобы стереть всё'; }
    return;
  }
  if ((e.target === sheet && !sheetLocked) || e.target.closest('[data-close]')) closeSheet();
});
window.addEventListener('resize', () => { if (S) layout(); });

showCamp('mines');
if (!save.help) openHelp();
</script>
