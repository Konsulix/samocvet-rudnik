<title>Жила</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column — camp with four tabs (base, map, workshop, museum) and the mine (risk, depth, bag, rock face) */
:root{
  --bg:#15110e; --surface:#211b17; --raise:#2c241e; --line:#43382f; --frame:#2a221c;
  --bgimg:radial-gradient(ellipse at 50% -10%, rgba(240,178,90,.13), transparent 60%);
  --fg:#efe6da; --muted:#a8998a; --lamp:#f0b25a; --hole:#0e0b09; --danger:#ff5a4a; --luck:#7fd8ff;
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --rock:none;
  color-scheme:dark;
}
[data-scene="adit"]{--bg:#15110e;--surface:#211b17;--raise:#2c241e;--line:#43382f;--frame:#2a221c;--bgimg:radial-gradient(ellipse at 50% -10%, rgba(240,178,90,.13), transparent 60%)}
[data-scene="desert"]{--bg:#121122;--surface:#1c1a30;--raise:#26233f;--line:#3a3660;--frame:#221f3a;
  --bgimg:radial-gradient(2px 2px at 18% 12%, #fff 50%, transparent 51%),radial-gradient(2px 2px at 72% 7%, #fff 50%, transparent 51%),radial-gradient(2px 2px at 86% 26%, #ffe 50%, transparent 51%),radial-gradient(1.5px 1.5px at 42% 30%, #fff 50%, transparent 51%),radial-gradient(1.5px 1.5px at 8% 48%, #fff 50%, transparent 51%),radial-gradient(1.5px 1.5px at 60% 55%, #fff 50%, transparent 51%),radial-gradient(ellipse at 50% 112%, rgba(255,140,90,.28), transparent 60%)}
[data-scene="ice"]{--bg:#0c151c;--surface:#14212b;--raise:#1c2d3a;--line:#2f4556;--frame:#162633;
  --bgimg:radial-gradient(ellipse at 20% -5%, rgba(140,220,255,.2), transparent 50%),radial-gradient(ellipse at 90% 100%, rgba(120,200,255,.14), transparent 55%)}
[data-scene="volcano"]{--bg:#190c09;--surface:#251310;--raise:#321a15;--line:#55291f;--frame:#2c1510;
  --bgimg:radial-gradient(ellipse at 50% 115%, rgba(255,80,30,.35), transparent 60%),radial-gradient(ellipse at 50% -10%, rgba(255,150,60,.08), transparent 50%)}
[data-scene="cosmos"]{--bg:#0a0a14;--surface:#141426;--raise:#1d1d36;--line:#33335a;--frame:#16162b;
  --bgimg:radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),radial-gradient(1.5px 1.5px at 55% 9%, #cdf 50%, transparent 51%),radial-gradient(2px 2px at 88% 40%, #fff 50%, transparent 51%),radial-gradient(1.5px 1.5px at 30% 62%, #fff 50%, transparent 51%),radial-gradient(ellipse at 75% 20%, rgba(170,90,255,.22), transparent 45%),radial-gradient(ellipse at 15% 85%, rgba(60,140,255,.18), transparent 50%)}
html{background:var(--bg);color:var(--fg)}
body{background:var(--bgimg), var(--bg);background-attachment:fixed;color:var(--fg);min-height:100%;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--lamp)}
.lvl{min-width:0;display:flex;flex-direction:column;gap:3px}
.lvl b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--luck)}
.top-r{display:flex;align-items:center;gap:8px}
.bal{font-family:var(--display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs .dot{position:absolute;top:4px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--lamp);color:#1b130b;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500;margin:0}
.empty{margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.roughs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;position:relative}
.rc:hover{border-color:var(--lamp)}
.rc svg{width:70px;height:70px}
.rc .n{font-size:12.5px;font-weight:600}
.rc .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rc .sp{color:var(--lamp);font-size:12px;letter-spacing:.15em}
.rc.done{border-color:var(--tc)}
.rc .tag{position:absolute;top:6px;right:6px;font-size:10px;background:var(--tc);color:#120d09;border-radius:4px;padding:0 4px;font-weight:600}
.rc .lk{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:10px;color:var(--luck)}
.orders{display:grid;gap:6px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.order svg{width:44px;height:44px}
.order b{font-weight:600}
.order p{margin:0;font-size:12.5px;color:var(--muted)}
.order .x3{font-family:var(--display);font-size:16px;color:var(--lamp)}
.locs,.ups{display:grid;gap:6px}
.loc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.loc:hover:not(:disabled){border-color:var(--lamp)}
.loc:disabled{opacity:.5;cursor:default}
.loc div{display:flex;flex-direction:column;min-width:0}
.loc span{font-size:12.5px;color:var(--muted)}
.loc .fams{display:flex;gap:4px;margin-top:4px}
.loc .fams i{width:9px;height:9px;border-radius:2px;background:var(--fc)}
.loc .price{font-family:var(--mono);font-weight:600;color:var(--lamp);white-space:nowrap;font-size:14px;text-align:right}
.loc .price small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.up{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.up div{min-width:0}
.up b{font-weight:600}
.up p{margin:0;font-size:12.5px;color:var(--muted)}
.lv{font-family:var(--mono);font-size:11px;color:var(--lamp)}
.buy{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:13px;white-space:nowrap}
.buy:disabled{opacity:.45;cursor:default}
.buy.on{border-color:var(--lamp);color:var(--lamp)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.skin{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left}
.skin.on{border-color:var(--lamp)}
.skin:disabled{opacity:.5;cursor:default}
.sw{height:54px;border-radius:8px;background-size:160px 160px;box-shadow:inset 0 2px 0 rgba(255,235,210,.14),inset 0 -3px 0 rgba(0,0,0,.35)}
.sw.scene{background:var(--bgimg), var(--bg);border:1px solid var(--line)}
.skin b{font-size:12.5px;font-weight:600}
.skin span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--lamp)}
.tile b{font-weight:600}
.tile span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tile .pbar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.tile .pbar i{display:block;height:100%;background:var(--lamp)}

/* mine */
.site{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}
.site b{color:var(--fg);font-weight:500}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.g-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-v{font-family:var(--display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.g-s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g.risk .g-v{color:var(--rc)}
.g.depth .g-v{color:var(--luck)}
.g.depth .g-s b{color:var(--luck);font-weight:600}
.rbar{height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--rc);transition:width .25s}
.g.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.06)}}

.board-wrap{position:relative;border-radius:12px;padding:6px;background:var(--frame);border:1px solid var(--line)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.cell{aspect-ratio:1;border:0;border-radius:5px;padding:0;position:relative;display:grid;place-items:center;min-width:0}
.rock{background-color:#5b4e43;background-image:var(--rock);background-size:160px 160px;
  box-shadow:inset 0 2px 0 rgba(255,235,210,.14),inset 0 -3px 0 rgba(0,0,0,.35);transition:filter .12s, transform .08s}
.rock:hover{filter:brightness(1.15)}
.rock:active{transform:scale(.94)}
.rock:disabled{cursor:default;filter:brightness(.7)}
.rock.probed::before{content:"";position:absolute;inset:3px;border-radius:4px;border:2px solid var(--fc);box-shadow:0 0 10px var(--fc);animation:pulse 1.4s ease-in-out infinite}
.rock.probed::after{content:"?";font-family:var(--display);font-size:14px;color:var(--fc);text-shadow:0 0 6px #000}
.rock.flag::after{content:"";width:0;height:0;border-left:7px solid var(--lamp);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:4px;filter:drop-shadow(0 1px 1px #000)}
.rock.flag::before{content:"";position:absolute;left:calc(50% - 4px);top:28%;width:2px;height:44%;background:#d8c9b6}
@keyframes pulse{50%{opacity:.45}}
.hole{background:var(--hole);box-shadow:inset 0 3px 6px rgba(0,0,0,.8);animation:crack .25s ease-out}
.hole span{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--fc)}
.ore,.spc{background:radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--fc) 22%, var(--hole)), var(--hole) 75%);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);animation:crack .3s ease-out}
.ore svg,.spc svg{width:88%;height:88%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.ore.done{box-shadow:inset 0 0 0 2px var(--fc),0 0 10px color-mix(in srgb, var(--fc) 50%, transparent)}
.ore.glow::after{content:"";position:absolute;inset:0;border-radius:5px;box-shadow:0 0 12px 2px #c690ff, inset 0 0 8px #c690ff;animation:pulse 1.6s infinite}
.ore.blocked svg{opacity:.35;filter:grayscale(1)}
.ore.missed,.spc.missed{background:var(--hole);animation:none;outline:1px dashed color-mix(in srgb, var(--fc) 50%, transparent);outline-offset:-3px}
.ore.missed svg,.spc.missed svg{opacity:.3}
@keyframes crack{from{transform:scale(.8);filter:brightness(2)}to{transform:none;filter:none}}
.board-wrap.tremor{animation:tremor .3s}
@keyframes tremor{20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-1px)}}
.board-wrap.quake{animation:quake .9s}
@keyframes quake{10%,30%,50%,70%{transform:translate(-6px,3px) rotate(-.6deg)}20%,40%,60%,80%{transform:translate(6px,-3px) rotate(.6deg)}}
.board.fall .cell{animation:fall .8s ease-in forwards;animation-delay:var(--d)}
@keyframes fall{to{transform:translateY(40px) rotate(var(--r));opacity:0}}
.board-wrap.dark::after{content:"";position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle, rgba(60,45,35,.6), rgba(10,8,6,.92));animation:fade .9s forwards}
@keyframes fade{from{opacity:0}}

.reveal{position:absolute;left:12px;right:12px;top:12px;z-index:5;display:flex;gap:10px;align-items:center;
  background:color-mix(in srgb, var(--bg) 94%, transparent);border:1px solid var(--tc);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px color-mix(in srgb, var(--tc) 35%, transparent)}
.reveal.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(-10px) scale(.95);opacity:0}}
.rv-ico{width:40px;height:40px;flex:none}
.rv-ico svg{width:100%;height:100%}
.rv-name{font-family:var(--display);font-weight:500;font-size:14px}
.rv-sub{font-size:12.5px;color:var(--muted)}
.rv-sub b{color:var(--tc)}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool small{font-size:11px;color:var(--muted);font-weight:400}
.tool.on{background:color-mix(in srgb, var(--lamp) 18%, var(--surface));border-color:var(--lamp)}
.tool:disabled{opacity:.4;cursor:default}
.btn{background:var(--lamp);color:#1b130b;border:0;border-radius:10px;padding:12px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--fc)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,6,5,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-head h2{font-family:var(--display);font-weight:500;font-size:20px;margin:2px 0 0;text-wrap:balance}
.x{background:var(--raise);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 0;font-weight:500}
.note{font-size:14px;margin:0}
.fam-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-top:4px}
.fam-h i{width:10px;height:10px;border-radius:2px;background:var(--fc)}
.fam-h span{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.fam-h span.ok{color:var(--lamp)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.cc{background:var(--raise);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-bottom:2px solid var(--tc)}
.cc svg{width:46px;height:46px}
.cc.lock svg{filter:brightness(0) opacity(.5)}
.cc .n{font-size:12px;font-weight:600;line-height:1.2;text-wrap:balance}
.cc .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.spec{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--raise);border-radius:10px;padding:8px 10px;border-left:3px solid var(--tc)}
.spec svg{width:44px;height:44px}
.spec>div{min-width:0}
.spec-name{font-weight:600}
.spec-meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:500}
.ach{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--raise);border-radius:10px;padding:8px 12px}
.ach b{font-weight:600}
.ach p{margin:0;font-size:12.5px;color:var(--muted)}
.ach .rw{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ach.got{outline:1px solid var(--lamp)}
.ach.got .rw{color:var(--lamp)}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{display:inline-flex;align-items:center;gap:4px;background:var(--raise);border-radius:8px;padding:3px 8px 3px 3px;font-size:12px}
.mini svg{width:26px;height:26px}

.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;width:min(420px, calc(100% - 32px));pointer-events:none}
.toast{background:var(--raise);border:1px solid var(--lamp);border-radius:12px;padding:8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast b{display:block;font-weight:600}
.toast span{font-size:12.5px;color:var(--muted)}

/* opening stage */
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 42%, var(--raise) 0%, var(--bg) 70%);display:flex;flex-direction:column;align-items:center;
  padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));gap:10px;overflow:auto}
.st-back{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));left:16px}
.st-top{text-align:center;display:flex;flex-direction:column;gap:2px;max-width:420px;margin-top:30px}
.st-top .t{font-family:var(--display);font-weight:500;font-size:18px}
.st-top .s{font-size:13px;color:var(--muted)}
.st-top .s .sp{color:var(--lamp);letter-spacing:.15em}
.st-top .s .lk{color:var(--luck);font-family:var(--mono)}
.stone{position:relative;width:min(72vw,300px);aspect-ratio:1;max-width:100%;border:0;background:transparent;padding:0;flex:none;margin-block:8px}
.stone>svg{position:absolute;inset:0;width:100%;height:100%}
.stone.hit .rough{animation:hit .25s}
@keyframes hit{30%{transform:scale(.95) rotate(-2deg)}60%{transform:scale(1.02) rotate(1deg)}}
.stone .cracks path{stroke:var(--glow);stroke-width:2.2;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px var(--glow));stroke-dasharray:200;stroke-dashoffset:200;animation:draw .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stone .halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--glow) 45%, transparent), transparent 65%);opacity:var(--ho,0);transition:opacity .4s}
.rays{position:absolute;inset:-25%;border-radius:50%;background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--tc) 30%, transparent) 0 8deg, transparent 8deg 24deg);
  mask:radial-gradient(circle, #000 20%, transparent 68%);-webkit-mask:radial-gradient(circle, #000 20%, transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

  const a = ac(); if (!a) return;

}
function tone(freq, at, dur, vol, type = 'sine'){

  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

    x.globalAlpha = 1;
    for (let n = 0; n < (k.strata || 0); n++) {
      x.strokeStyle = `rgba(${n % 2 ? k.light : k.dark},${.08 + Math.random() * .2})`; x.lineWidth = Math.random() * 3 + .5;
      x.beginPath(); let y = Math.random() * 160; x.moveTo(0, y);

    }
    for (let n = 0; n < (k.veins || 0); n++) {
      x.strokeStyle = `rgba(${k.dark},${.25 + Math.random() * .3})`; x.lineWidth = Math.random() * 1.6 + .4;

function crackPaths(seed, count){
  const rand = mulberry(seed * 7 + 3), out = [];
  for (let k = 0; k < count; k++) {
    let x = 50 + (rand() - .5) * 10, y = 54 + (rand() - .5) * 10;
    const a0 = rand() * Math.PI * 2; let d = `M${x.toFixed(1)},${y.toFixed(1)}`;
    for (let s = 0; s < 5; s++) { const a = a0 + (rand() - .5) * 1.1, len = 5 + rand() * 6; x += Math.cos(a) * len; y += Math.sin(a) * len * .86; d += ` L${x.toFixed(1)},${y.toFixed(1)}`; }
    out.push(d);
  }
  return out;
}

  Object.values(SCENES).filter(s => s.lvl === L).forEach(s => out.push('фон «' + s.name + '»'));
  return out;
}
function gainXP(x){
  save.xp += Math.round(x);
  while (save.xp >= xpNeed(save.lvl)) {
    save.xp -= xpNeed(save.lvl); save.lvl++;

    fillOrders();

}

const famBonus = f => famDone(f) ? 1.15 : 1;
const ACH = [

function checkAch(){
  for (const a of ACH) if (!save.ach[a.id] && a.ok(save)) { save.ach[a.id] = 1; save.bal += a.r; SFX.coin(); toast('Веха: ' + a.name, `${a.d} · +${fmt(a.r)} ₽`); }

/* ---------- orders ---------- */
function orderPool(){
  const fams = new Set();
  LOC.filter(l => l.lvl <= save.lvl).forEach(l => Object.entries(l.fam).forEach(([f, w]) => { if (w >= 1) fams.add(f); }));
  return Object.values(SP).filter(s => fams.has(s.fam) && s.t >= 1 && s.t <= 3);
}
function newOrder(){
  const pool = orderPool().filter(s => !save.orders.some(o => o.sid === s.id));
  const sp = pool[ri(0, pool.length - 1)] || orderPool()[0];
  return {sid:sp.id, min:ri(0, 2), mult:sp.t >= 3 ? 2.5 : 3};
}
function fillOrders(){ while (save.orders.length < 3) save.orders.push(newOrder()); }

/* ---------- field generation ---------- */
function genField(loc){
  const cells = Array.from({length: R * C}, () => ({dep:-1, sp:null, open:false, probed:false, flag:false, n:0, tint:null, g:0, bx:-ri(0, 120), by:-ri(0, 120)}));
  const deps = [], blocked = new Set();
  let used = 0, tries = 0;
  const target = ri(loc.target[0], loc.target[1]);
  while (used < target && tries < 600) {
    tries++;
    const fid = pickW(Object.entries(loc.fam)), fam = FAM[fid];
    const start = ri(0, R * C - 1);
    if (blocked.has(start)) continue;
    const shape = [start];
    if (fam.shape === 'vein') {
      const want = ri(fam.len[0], fam.len[1]);
      let d = ri(0, 7), r = Math.floor(start / C), c = start % C;
      while (shape.length < want) {
        if (Math.random() < .3) d = (d + (Math.random() < .5 ? 1 : 7)) % 8;
        const nr = r + D8[d][0], nc = c + D8[d][1];
        if (!inb(nr, nc)) break;
        const ni = idx(nr, nc);
        if (blocked.has(ni) || shape.includes(ni)) break;
        shape.push(ni); r = nr; c = nc;
      }
      if (shape.length < 2 || shape.length < want - 2) continue;
    } else {
      const want = ri(fam.size[0], fam.size[1]);
      while (shape.length < want) {
        const cand = [];
        for (const s of shape) for (const ni of neigh(s, D4)) if (!blocked.has(ni) && !shape.includes(ni)) cand.push(ni);
        if (!cand.length) break;
        shape.push(cand[ri(0, cand.length - 1)]);
      }
      if (shape.length < 2) continue;
    }
    if (used + shape.length > target + 2) continue;
    const dep = {id:deps.length, fam:fid, cells:shape, found:0, seen:false, done:false, blocked:false, glow:Math.random() < .08, seed:ri(1, 1e9)};
    deps.push(dep);
    for (const i of shape) {
      cells[i].dep = dep.id;
      cells[i].g = +rnd(fam.gram[0], fam.gram[1]).toFixed(1);
      blocked.add(i);
      for (const n of neigh(i, D4)) blocked.add(n);
    }
    used += shape.length;
  }
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].dep >= 0) continue;
    const cnt = {}; let n = 0;
    for (const j of neigh(i)) if (cells[j].dep >= 0) { n++; const f = deps[cells[j].dep].fam; cnt[f] = (cnt[f] || 0) + 1; }
    cells[i].n = n;
    if (n) cells[i].tint = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
  }
  // special finds hide in empty rock; they never show up in the numbers
  const free = cells.map((c, i) => c.dep < 0 ? i : -1).filter(i => i >= 0);
  const nSpec = ri(1, 2) + save.up.lamp + (Math.random() < .3 ? 1 : 0);
  for (let k = 0; k < nSpec && free.length; k++) {
    const i = free.splice(ri(0, free.length - 1), 1)[0];
    cells[i].sp = pickW(Object.entries(SPECIALS).map(([id, s]) => [id, s.w]));
  }
  return {cells, deps};
}

/* ---------- mine ---------- */
let M = null;
const bagCap = () => BAGCAP[save.up.bag];
function riskFor(n){ if (!M) return 0; const e = n - M.off; if (e <= 4) return 0; return Math.min(.5, .008 * (e - 4) * M.loc.risk * (1 - .12 * save.up.krep)); }
const cumNext = () => 1 - M.surv * (1 - riskFor(M.strikes + 1));
const riskColor = r => r < .12 ? '#9bd17a' : r < .25 ? '#f0c64a' : r < .4 ? '#ff9a4a' : '#ff5a4a';
const depthM = () => M.strikes * 3 + save.up.drill * 10;

function startRun(locId){
  const loc = LOCM[locId];
  if (!loc || save.bal < loc.cost || save.lvl < loc.lvl) return;
  save.bal -= loc.cost; save.runs++;
  persist();
  R = loc.rows;
  M = Object.assign({loc, no:save.runs, strikes:0, off:0, lastRisk:0, surv:1, cumEnd:0, luck:1 + .15 * save.up.drill, pot:0, extras:[],
    probes:PROBES + save.up.probe, tool:'pick', over:false}, genField(loc));
  const zeros = M.cells.map((c, i) => c.dep < 0 && !c.sp && c.n === 0 ? i : -1).filter(i => i >= 0);
  const empties = M.cells.map((c, i) => c.dep < 0 && !c.sp ? i : -1).filter(i => i >= 0);
  const pool = zeros.length ? zeros : empties;
  if (pool.length) openEmpty(pool[ri(0, pool.length - 1)]);
  closeSheet();
  $('#reveal').hidden = true;
  $('#board').classList.remove('fall');
  $('#wrap').classList.remove('dark', 'quake');
  showScreen('mine');
  renderMine();
}

function openEmpty(i){
  const st = [i];
  while (st.length) {
    const k = st.pop(), c = M.cells[k];
    if (c.open) continue;
    c.open = true; c.flag = false;
    if (c.n === 0) for (const j of neigh(k)) { const cj = M.cells[j]; if (!cj.open && cj.dep < 0 && !cj.sp) st.push(j); }
  }
}

function bump(id){ const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function tap(i){
  if (M.over) return;
  const c = M.cells[i];
  if (c.open) return;
  if (M.tool === 'flag') { c.flag = !c.flag; renderMine(); return; }
  if (c.flag) return;
  if (M.tool === 'probe') {
    if (M.probes <= 0 || c.probed) return;
    M.probes--;
    SFX.probe();
    if (c.dep >= 0) {
      c.probed = true;
      const d = M.deps[c.dep], fam = FAM[d.fam];
      notify(`<div class="rv-ico">${roughSVG(d.seed, d.fam)}</div>`, 'Сигнал', `Под клеткой ${fam.name.toLowerCase()}.`, fam.color);
    } else if (c.sp) {
      c.probed = true;
      notify(`<div class="rv-ico">${specialSVG(c.sp)}</div>`, 'Что-то необычное', 'Щуп упёрся в странную полость.', SPECIALS[c.sp].color);
    } else openEmpty(i);
    if (M.probes === 0) M.tool = 'pick';
    renderMine(); return;
  }
  const risk = riskFor(M.strikes + 1);
  M.strikes++;
  M.lastRisk = risk;
  if (Math.random() < risk) { M.cumEnd = 1 - M.surv * (1 - risk); collapse(); return; }
  M.surv *= 1 - risk;
  M.cumEnd = 1 - M.surv;
  M.luck = Math.min(LUCK_MAX, M.luck + LUCK_STEP);
  if (c.dep >= 0) extract(i); else if (c.sp) openSpecial(i); else { openEmpty(i); SFX.hollow(); }
  SFX.strike();
  const next = cumNext();
  if (next >= .25) { const w = $('#wrap'); w.classList.remove('tremor'); void w.offsetWidth; w.classList.add('tremor'); if (next >= .4) SFX.creak(); }
  renderMine();
}

function bagStones(){ return M ? M.deps.filter(d => d.found > 0 && !d.blocked) : []; }
function bagCount(){ return bagStones().length + M.extras.filter(x => x.kind === 'geode').length; }

function extract(i){
  const c = M.cells[i], d = M.deps[c.dep], fam = FAM[d.fam];
  c.open = true; c.probed = false; c.flag = false;
  const ico = `<div class="rv-ico">${roughSVG(d.seed, d.fam)}</div>`;
  if (!d.seen && bagCount() >= bagCap()) {
    d.blocked = true; d.seen = true; d.found++;
    SFX.hollow();
    notify(ico, 'Рюкзак полон', `${fam.name} остаётся в забое. Рюкзак побольше продаётся в мастерской.`, '#ff9a4a');
    return;
  }
  d.found++;
  if (d.blocked) return;
  if (d.found === d.cells.length) {
    d.done = true; SFX.done();
    M.luck = Math.min(LUCK_MAX, M.luck + .1);
    bump('#depthBox');
    const g = d.cells.reduce((s, k) => s + M.cells[k].g, 0);
    notify(ico, 'Залежь целиком', `${fam.name} · ${fmtG(g)} · <b>удача +0,1</b>`, fam.color, true);
  } else {
    SFX.ore();
    if (!d.seen) {
      if (d.glow) { SFX.special(); notify(ico, 'Порода светится', `${fam.name}. Внутри что-то <b>редкое</b>.`, '#c690ff', true); }
      else notify(ico, fam.name, 'Есть руда. Ищите продолжение, целиком дороже.', fam.color);
    }
  }
  d.seen = true;
  bump('#bagBox');
}

function rollSpecies(fid, luck, floor = 0, loc = M.loc){
  const list = FAM[fid].species.filter(s => s.t >= floor);
  return pickW((list.length ? list : FAM[fid].species).map(s => [s, s.w * Math.pow(luck, s.t * .8) * ((loc.boost && loc.boost[s.id]) || 1)]));
}

function openSpecial(i){
  const c = M.cells[i], type = c.sp;
  c.open = true; c.probed = false; c.flag = false;
  SFX.special();
  if (type === 'geode') {
    const fid = pickW([['quartz', 5], ['fluorite', 2], ['gypsum', 1]]);
    const sp = rollSpecies(fid, M.luck + .3, 1);
    M.extras.push({kind:'geode', sid:sp.id, fam:fid, seed:ri(1, 1e9)});
    c.show = gemSVG(sp);
    notify(`<div class="rv-ico">${gemSVG(sp)}</div>`, 'Жеода!', `Внутри <b>${sp.name}</b>. Вынесите её, и узнаете качество.`, TIER_C[sp.t], true);

  } else if (type === 'stash') {

    notify(`<div class="rv-ico">${fossilSVG(f)}</div>`, 'Окаменелость', `<b>${f.name}</b> · ${fmt(f.p)} ₽ при выносе.`, SPECIALS.fossil.color, true);

let rvT;
function notify(ico, title, sub, color, long){

  el.style.setProperty('--tc', color);

function stoneFromDep(d){
  const sp = rollSpecies(d.fam, M.luck, d.glow ? 2 : 0);
  const taken = d.cells.filter(i => M.cells[i].open);
  const g = +taken.reduce((s, i) => s + M.cells[i].g, 0).toFixed(1);
  return mkStone(sp, d.fam, d.seed, d.done, taken.length, d.cells.length, g, false);
}
function mkStone(sp, fam, seed, complete, parts, total, g, geode){
  const P = [[.05, .01], [.15, .04], [.35, .12], [.6, .35], [.85, .6]][sp.t];
  save.cat++;
  return {id:save.cat, seed, fam, sid:sp.id, complete, parts, total, g, geode, luck:+M.luck.toFixed(2),
    spark:1 + (Math.random() < P[0]) + (Math.random() < P[1]), loc:M.loc.id, run:M.no, res:null};
}
function geodeStone(x){ const fam = FAM[x.fam]; return mkStone(SP[x.sid], x.fam, x.seed, true, 3, 3, +rnd(fam.gram[0] * 2, fam.gram[1] * 3).toFixed(1), true); }

function cashOut(){
  if (M.over) return;
  M.over = true;
  const stones = bagStones().map(stoneFromDep).concat(M.extras.filter(x => x.kind === 'geode').map(geodeStone));
  const fossils = M.extras.filter(x => x.kind === 'fossil').map(x => FOSM[x.id]);
  save.rough.push(...stones);
  let cash = M.pot;
  for (const f of fossils) { save.fos[f.id] = (save.fos[f.id] || 0) + 1; cash += f.p; }
  save.bal += cash; save.st.earned += cash;
  save.st.outs++; save.st.maxOut = Math.max(save.st.maxOut, M.strikes); save.st.visited[M.loc.id] = 1;
  save.st.whole += M.deps.filter(d => d.done && !d.blocked).length;
  save.st.geodes += stones.filter(s => s.geode).length; save.st.fossils += fossils.length;
  const rec = [];
  if (M.cumEnd > 0 && (!save.deep || M.cumEnd > save.deep.risk)) { if (save.deep) rec.push(`самый рискованный вынос, ${pct(M.cumEnd)}`); save.deep = {risk:M.cumEnd, strikes:M.strikes, loc:M.loc.id}; }
  if (!save.lucky || M.luck > save.lucky.luck) { if (save.lucky) rec.push(`самая большая удача, ×${fmtX(M.luck)}`); save.lucky = {luck:M.luck, depth:depthM()}; }

    <p class="note">Удача забоя <b style="color:var(--luck)">×${fmtX(M.luck)}</b> переходит на все камни этого выноса.</p>
    ${stones.length ? `<div class="mini">${stones.map(s => `<span>${s.geode ? gemSVG(SP[s.sid]) : roughSVG(s.seed, s.fam)}${s.geode ? 'жеода' : FAM[s.fam].short} · ${fmtG(s.g)}${s.complete ? ' · целый' : ''} <b style="color:var(--lamp)">${sparks(s.spark)}</b></span>`).join('')}</div>` : ''}
    ${fossils.length ? `<h3>Окаменелости</h3><div class="mini">${fossils.map(f => `<span>${fossilSVG(f)}${f.name} · ${fmt(f.p)} ₽</span>`).join('')}</div>` : ''}
    ${cash ? `<p class="note">В кассу: <b style="color:var(--lamp)">+${fmt(cash)} ₽</b>${M.pot ? ` (клад ${fmt(M.pot)} ₽)` : ''}</p>` : ''}
    <button type="button" class="btn" data-camp>В лагерь${stones.length ? ', вскрывать' : ''}</button>`, true);
  checkAch();
}

function collapse(){
  M.over = true;
  const deps = bagStones(), geodes = M.extras.filter(x => x.kind === 'geode');
  const all = deps.map(d => ({d})).concat(geodes.map(g => ({g})));
  const saved = [];
  for (let k = 0; k < save.up.safe && all.length; k++) saved.push(all.splice(ri(0, all.length - 1), 1)[0]);
  const stones = saved.map(x => x.d ? stoneFromDep(x.d) : geodeStone(x.g));
  save.rough.push(...stones);
  save.st.collapses++; save.st.visited[M.loc.id] = 1;
  SFX.collapse();
  const w = $('#wrap'), b = $('#board');

  w.classList.add('quake', 'dark'); b.classList.add('fall');

    openPanel(`${head(`Участок № ${M.no} · ${M.loc.name}`, '<span style="color:var(--danger)">Обвал</span>', false)}
      <p class="note">Порода не выдержала на ${M.strikes}-м ударе, на глубине ${depthM()} м. Риск этого удара ${pct(M.lastRisk)}, накопленный ${pct(M.cumEnd)}.</p>
      ${all.length ? `<h3>Осталось под завалом</h3><div class="mini">${all.map(x => x.d ? `<span>${roughSVG(x.d.seed, x.d.fam)}${FAM[x.d.fam].short} · ${x.d.done ? 'целый' : 'часть'}</span>` : `<span>${gemSVG(SP[x.g.sid])}жеода: ${SP[x.g.sid].name}</span>`).join('')}</div>` : ''}
      ${lostExtras ? `<p class="note muted">${M.pot ? `Клад ${fmt(M.pot)} ₽ потерян. ` : ''}${M.extras.some(x => x.kind === 'fossil') ? 'Окаменелости тоже остались в завале.' : ''}</p>` : ''}
      ${stones.length ? `<h3>Страховой ящик спас</h3><div class="mini">${stones.map(s => `<span>${roughSVG(s.seed, s.fam)}${FAM[s.fam].short} · ${fmtG(s.g)}</span>`).join('')}</div>` : ''}
      ${!all.length && !stones.length && !lostExtras ? '<p class="note muted">Вы ничего не успели добыть.</p>' : ''}
      <button type="button" class="btn" data-camp>В лагерь</button>`, true);
    checkAch();
  }, 1000);
}

/* ---------- opening ---------- */
function resolve(r){
  const sp = SP[r.sid];
  let gi = -1, mult = .35;
  if (r.complete) {
    gi = pickW(GR.map((x, k) => [k, x.w * Math.pow(1 + .25 * save.up.saw, k) * Math.pow(r.luck || 1, k * .35)]));
    mult = GR[gi].m * (1 + .15 * (r.total - 1));
  }
  const value = Math.max(1, Math.round(r.g * sp.p * mult * PRICE_K * famBonus(sp.fam)));
  const rec = [], isNew = !save.col[sp.id];
  if (!save.big || r.g > save.big.g) { if (save.big) rec.push('Самый крупный образец'); save.big = {name:sp.name, g:r.g}; }
  if (!save.price || value > save.price.value) { if (save.price) rec.push('Самый дорогой образец'); save.price = {name:sp.name, value}; }
  if (!save.rare || sp.t > save.rare.tier) { if (save.rare) rec.push('Самая редкая находка'); save.rare = {name:sp.name, tier:sp.t}; }
  save.runTot[r.run] = (save.runTot[r.run] || 0) + value;
  if (!save.bestRun || save.runTot[r.run] > save.bestRun.value) { if (save.bestRun && save.bestRun.run !== r.run) rec.push('Лучший участок'); save.bestRun = {run:r.run, value:save.runTot[r.run], loc:r.loc}; }
  const e = save.col[sp.id] || {n:0, bg:-1, bw:0};
  e.n++; e.bg = Math.max(e.bg, gi); e.bw = Math.max(e.bw, r.g);
  save.col[sp.id] = e;
  if (sp.t === 3) save.st.epic++;
  if (sp.t === 4) save.st.legend++;
  if (gi === 4) save.st.aaa++;
  const setNow = isNew && famDone(sp.fam);
  r.res = {gi, grade: gi >= 0 ? GR[gi].n : 'обломок', value, rec, isNew, setNow};
  gainXP(value / 6 + 15 * sp.t);
  persist();
}

const stage = $('#stage');
let ST = null;
function openStone(id){
  const r = save.rough.find(x => x.id === id);
  if (!r) return;
  ST = {r, phase: r.res ? 3 : 0, busy:false};
  stage.hidden = false;
  drawStage();
  if (r.res) showResult(true);
}

function drawStage(){
  const r = ST.r, fam = FAM[r.fam];
  stage.innerHTML = `
    <button type="button" class="icon-btn st-back" data-act="back">← Лагерь</button>
    <div class="st-top"><div class="eyebrow">Камень № ${pad(r.id)} · ${LOCM[r.loc].name}</div>
      <div class="t">${r.geode ? 'Жеода: ' + SP[r.sid].name : fam.name}</div>
      <div class="s">${fmtG(r.g)} · ${r.complete ? 'целый' : `часть залежи, ${r.parts} из ${r.total}`} · ${r.geode ? 'полость с кристаллами' : fam.hint} · <span class="lk">удача ×${fmtX(r.luck || 1)}</span> · <span class="sp">${sparks(r.spark)}</span></div></div>
    <button type="button" class="stone" id="stone" aria-label="Расколоть камень" style="--glow:${fam.color}">
      <div class="halo"></div>
      ${r.geode ? `<svg class="rough" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="40" fill="#6e5f50"/><circle cx="50" cy="52" r="40" fill="none" stroke="#3a2e24" stroke-width="3"/><circle cx="38" cy="40" r="8" fill="#fff" opacity=".07"/></svg>` : roughSVG(r.seed, r.fam, 'rough')}
      <svg class="cracks" id="cracks" viewBox="0 0 100 100" aria-hidden="true"></svg>
    </button>
    <div class="st-bottom" id="stBottom"><div class="tap-hint">Нажмите на камень, чтобы расколоть</div></div>`;
}

function hitStone(){
  if (!ST || ST.busy || ST.phase >= 3) return;
  const r = ST.r, sp = SP[r.sid], fam = FAM[r.fam], st = $('#stone');
  ST.phase++;
  st.classList.remove('hit'); void st.offsetWidth; st.classList.add('hit');
  SFX.crack(ST.phase);
  if (ST.phase === 1) {
    $('#cracks').innerHTML = crackPaths(r.seed, 2).map(d => `<path d="${d}"/>`).join('');
    st.style.setProperty('--ho', '.35');
    $('#stBottom').innerHTML = '<div class="tap-hint">Ещё удар</div>';
  } else if (ST.phase === 2) {
    // light through the cracks hints at rarity; a legendary sometimes pretends to be merely rare
    let tease = fam.color;
    if (sp.t >= 2) tease = TIER_C[sp.t === 4 && Math.random() < .5 ? 2 + ri(0, 1) : sp.t];
    st.style.setProperty('--glow', tease);
    st.style.setProperty('--ho', sp.t >= 3 ? '1' : '.6');
    $('#cracks').innerHTML = crackPaths(r.seed, 6).map(d => `<path d="${d}"/>`).join('');
    $('#stBottom').innerHTML = '<div class="tap-hint">Последний удар</div>';
  } else {
    ST.busy = true;
    if (!r.res) resolve(r);
    showResult(false);
  }
}

function showResult(instant){
  const r = ST.r, sp = SP[r.sid], st = $('#stone'), res = r.res;
  st.style.setProperty('--tc', TIER_C[sp.t]);
  st.style.setProperty('--ho', '0');
  st.innerHTML = `<div class="rays"></div>${instant ? '' : '<div class="burst"></div>'}<div class="gem">${gemSVG(sp)}</div>`;
  st.setAttribute('aria-label', sp.name);
  if (!instant) SFX.reveal(sp.t);
  $('#stBottom').innerHTML = `<div class="res" style="--tc:${TIER_C[sp.t]}">
      <div class="tier">${TIERS[sp.t]}${res.isNew ? ' · новый вид' : ''}</div>
      <div class="nm">${sp.name}</div>
      <div class="meta">${sp.f} · тв. ${sp.h} · ${fmtG(r.g)}</div>
      <div class="grade"><span class="gl">Качество</span><span class="gv" id="gv">${instant || !r.complete ? res.grade : '…'}</span></div>
    </div>
    <div id="after"></div>`;
  if (instant || !r.complete) { if (res.gi >= 0) $('#gv').style.setProperty('--gc', GR_C[res.gi]); finishResult(); return; }
  let k = 0, delay = 60;
  const steps = 10 + res.gi, gv = $('#gv');
  const spin = () => {
    gv.textContent = GR[k % GR.length].n; gv.style.setProperty('--gc', GR_C[k % GR.length]); SFX.tick();
    if (k >= steps && k % GR.length === res.gi) {
      gv.classList.add('land'); SFX.land(res.gi); if (res.gi >= 3) buzz([40, 30, 80]);
      setTimeout(finishResult, 250); return;
    }
    k++; delay *= 1.12; setTimeout(spin, delay);
  };
  setTimeout(spin, 450);
}

function matchOrder(r){ return save.orders.findIndex(o => o.sid === r.sid && r.complete && r.res.gi >= o.min); }

function finishResult(){
  const r = ST.r, res = r.res, oi = matchOrder(r), o = save.orders[oi];
  const more = save.rough.filter(x => x.id !== r.id).length;
  $('#after').innerHTML = `<div class="res" style="gap:8px">
      <div class="val">${fmt(res.value)} ₽</div>
      ${res.rec.length || res.setNow ? `<div class="recs">${res.setNow ? `<span class="rec">★ Набор «${FAM[SP[r.sid].fam].short}» собран: цены +15%</span>` : ''}${res.rec.map(x => `<span class="rec">★ ${x}</span>`).join('')}</div>` : ''}
    </div>
    <div class="acts" style="margin-top:10px">
      ${o ? `<button type="button" class="btn" data-act="order">Отдать коллекционеру · ${fmt(res.value * o.mult)} ₽</button>` : ''}
      <div class="two">
        <button type="button" class="${o ? 'ghost' : 'btn'}" data-act="sell">Продать · ${fmt(res.value)} ₽</button>
        <button type="button" class="ghost" data-act="keep">В витрину</button>
      </div>
      <div class="muted" style="text-align:center;font-size:12.5px">${more ? `Ещё ${more} ${plural(more, 'камень ждёт', 'камня ждут', 'камней ждут')} вскрытия` : 'Это был последний камень'}</div>
    </div>`;
  ST.busy = false;
  checkAch();
}

function decide(act){
  const r = ST.r, res = r.res;
  if (act === 'sell') { save.bal += res.value; save.st.earned += res.value; SFX.coin(); }
  if (act === 'order') {
    const oi = matchOrder(r); if (oi < 0) return;
    const v = Math.round(res.value * save.orders[oi].mult);
    save.bal += v; save.st.earned += v; save.st.orders++;
    save.orders.splice(oi, 1); fillOrders(); gainXP(60);
    SFX.coin(); SFX.done();
  }
  if (act === 'keep') { save.shelf.push({id:r.id, sid:r.sid, g:r.g, grade:res.grade, gi:res.gi, value:res.value, loc:r.loc}); SFX.done(); }
  save.rough = save.rough.filter(x => x.id !== r.id);
  checkAch();
  persist();
  const next = save.rough.find(x => !x.res) || save.rough[0];
  if (next) openStone(next.id); else { stage.hidden = true; ST = null; showScreen('camp'); }
  renderTop();
}

}

function cellHTML(c, i){
  if (!c.open) {
    if (M.over && c.dep >= 0) { const d = M.deps[c.dep]; return `<div class="cell ore missed" style="--fc:${FAM[d.fam].color}">${roughSVG(d.seed, d.fam)}</div>`; }
    if (M.over && c.sp) return `<div class="cell spc missed" style="--fc:${SPECIALS[c.sp].color}">${specialSVG(c.sp)}</div>`;
    const cls = ['cell', 'rock']; let st = `background-position:${c.bx}px ${c.by}px`;
    if (c.probed) { cls.push('probed'); st += `;--fc:${c.dep >= 0 ? FAM[M.deps[c.dep].fam].color : SPECIALS[c.sp].color}`; }
    if (c.flag) cls.push('flag');
    return `<button type="button" class="${cls.join(' ')}" style="${st}" data-i="${i}" aria-label="Порода"${M.over ? ' disabled' : ''}></button>`;
  }
  if (c.dep >= 0) {
    const d = M.deps[c.dep];
    return `<div class="cell ore${d.done ? ' done' : ''}${d.glow && !d.blocked ? ' glow' : ''}${d.blocked ? ' blocked' : ''}" style="--fc:${FAM[d.fam].color}">${roughSVG(d.seed, d.fam)}</div>`;
  }
  if (c.sp) return `<div class="cell spc" style="--fc:${SPECIALS[c.sp].color}">${c.show || specialSVG(c.sp)}</div>`;
  return `<div class="cell hole" style="--fc:${c.tint ? FAM[c.tint].color : 'transparent'}">${c.n ? `<span>${c.n}</span>` : ''}</div>`;
}

}
function openAch(){
  openPanel(`${head('Музей', 'Вехи')}
    <div class="list">${ACH.map(a => `<div class="ach${save.ach[a.id] ? ' got' : ''}"><div><b>${save.ach[a.id] ? '✓ ' : ''}${a.name}</b><p>${a.d}</p></div><span class="rw">+${fmt(a.r)} ₽</span></div>`).join('')}</div>`);
}
function openRecords(){
  const r = (label, val) => `<div class="row"><span>${label}</span><span>${val}</span></div>`;
  openPanel(`${head('Музей', 'Рекорды')}
    <div class="rows">
      ${r('Самый рискованный вынос', save.deep ? `${pct(save.deep.risk)} · ${save.deep.strikes} ударов` : '—')}
      ${r('Самая большая удача', save.lucky ? `×${fmtX(save.lucky.luck)} · ${save.lucky.depth} м` : '—')}
      ${r('Лучший участок', save.bestRun ? `${fmt(save.bestRun.value)} ₽ · № ${save.bestRun.run}, ${LOCM[save.bestRun.loc].name}` : '—')}
      ${r('Самый крупный образец', save.big ? `${save.big.name}, ${fmtG(save.big.g)}` : '—')}
      ${r('Самый дорогой образец', save.price ? `${save.price.name}, ${fmt(save.price.value)} ₽` : '—')}
      ${r('Самая редкая находка', save.rare ? `${save.rare.name} · ${TIERS[save.rare.tier].toLowerCase()}` : '—')}
      ${r('Участков', save.runs)}
      ${r('Обвалов', save.st.collapses)}
      ${r('Заработано всего', fmt(save.st.earned) + ' ₽')}
    </div>
    <button type="button" class="ghost" data-reset>Сбросить прогресс</button>`);
}
function openHelp(){
  save.help = true; persist();
  openPanel(`${head('Как играть', 'Сапёр наоборот, с обвалом')}
    <ul class="help">
      <li>На карте купите лицензию на участок. Под клетками пустая порода или руда.</li>
      <li>Цифра показывает, сколько рудных клеток в восьми соседних. Цвет цифры подсказывает тип руды.</li>
      <li>Каждый удар кирки уводит глубже: растёт <b>удача</b> (шанс редких видов и высокого качества), но растёт и риск обвала. Обвал забирает всё невынесенное.</li>
      <li>Вскрыли залежь целиком — получите целый камень и +0,1 к удаче. Светящаяся порода гарантирует редкий вид.</li>
      <li>В пустой породе прячутся жеоды, клады, старая крепь (снижает риск) и окаменелости. В цифрах их не видно, только щуп их чувствует.</li>
      <li>Рюкзак ограничен. Когда он полон, новые залежи приходится оставлять.</li>
      <li>В лагере камни раскалывают. Продайте находку, оставьте в витрину или отдайте коллекционеру втридорога.</li>
      <li>Опыт поднимает разряд и открывает новые регионы, снаряжение, породы и фоны.</li>
    </ul>
    <button type="button" class="btn" data-close>Понятно</button>`);
}

/* ---------- events ---------- */
$('#board').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) tap(+b.dataset.i); });
$('#tools').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (!b || b.disabled) return; M.tool = b.dataset.tool; renderMine(); });
$('#btnOut').addEventListener('click', cashOut);
$('#mute').addEventListener('click', () => { save.mute = !save.mute; persist(); renderTop(); });
$('#camp').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { campTab = t.dataset.tab; renderCamp(); return; }
  const o = e.target.closest('[data-open]'); if (o) return openStone(+o.dataset.open);
  if (e.target.closest('[data-openall]')) { const r = save.rough.find(x => !x.res); if (r) openStone(r.id); return; }
  const run = e.target.closest('[data-run]'); if (run && !run.disabled) return startRun(run.dataset.run);
  if (e.target.closest('[data-reorder]') && save.bal >= 200) { save.bal -= 200; save.orders = []; fillOrders(); persist(); renderCamp(); renderTop(); return; }
  const buy = e.target.closest('[data-buy]');
  if (buy && !buy.disabled) {
    const u = UPS.find(x => x.id === buy.dataset.buy), lv = save.up[u.id];
    if (lv < u.cost.length && save.bal >= u.cost[lv] && save.lvl >= u.lvl[lv]) { save.bal -= u.cost[lv]; save.up[u.id]++; persist(); SFX.coin(); toast(`${u.name}: уровень ${save.up[u.id]}`, u.d(save.up[u.id])); renderCamp(); renderTop(); }
    return;
  }
  const cos = e.target.closest('[data-cos]');
  if (cos && !cos.disabled) {
    const [kind, id] = cos.dataset.cos.split(':'), s = (kind === 'skin' ? SKINS : SCENES)[id];
    if (!save.owned[id]) { if (save.bal < s.cost || save.lvl < s.lvl) return; save.bal -= s.cost; save.owned[id] = 1; SFX.coin(); }
    save[kind] = id; persist(); applyLook(); renderCamp(); renderTop();
    return;
  }
  const sh = e.target.closest('[data-sheet]'); if (sh) ({col:openCollection, fos:openFossils, ach:openAch, shelf:openShelf, rec:openRecords, help:openHelp})[sh.dataset.sheet]();
});
stage.addEventListener('click', e => {
  if (e.target.closest('#stone')) return hitStone();
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'back') { if (ST && ST.busy) return; stage.hidden = true; ST = null; return showScreen('camp'); }
  if (a) decide(a.dataset.act);
});
sheet.addEventListener('click', e => {
  if (e.target.closest('[data-camp]')) { closeSheet(); M = null; campTab = 'base'; return showScreen('camp'); }
  if ((e.target === sheet && !sheetLocked) || e.target.closest('[data-close]')) return closeSheet();
  const ss = e.target.closest('[data-sellshelf]');
  if (ss) { const id = +ss.dataset.sellshelf, s = save.shelf.find(x => x.id === id); if (s) { save.bal += s.value; save.st.earned += s.value; save.shelf = save.shelf.filter(x => x.id !== id); persist(); SFX.coin(); renderTop(); renderCamp(); openShelf(); checkAch(); } return; }
  const rs = e.target.closest('[data-reset]');
  if (rs) {
    if (rs.dataset.armed) { save = Object.assign(BLANK(), {help:true}); persist(); applyLook(); closeSheet(); campTab = 'base'; showScreen('camp'); }
    else { rs.dataset.armed = '1'; rs.textContent = 'Нажмите ещё раз, чтобы стереть всё'; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetLocked) closeSheet(); });

applyLook();
fillOrders();
showScreen('camp');
if (!save.help) openHelp();
</script>
