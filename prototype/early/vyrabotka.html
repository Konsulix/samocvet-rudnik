<meta charset="utf-8">
<title>Выработка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: camp is a scrolling logbook; the descent is a full-screen 3D canvas with a thin HUD on top and context actions at the bottom */
:root{
  --bg:#081114; --surface:#11242c; --raise:#183340; --line:#24414f;
  --fg:#e4ddcc; --muted:#8fa3a8; --lamp:#e3a857; --anom:#7fe0c8; --danger:#e2604a; --water:#4fa8d8; --gas:#a9d65a;
  --paper:#d9ccb0; --ink:#2a2218; --ink2:#6a5a42;
  --display:'Old Standard TT', 'Times New Roman', Georgia, serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse at 50% -10%, rgba(227,168,87,.08), transparent 55%), var(--bg);color:var(--fg);min-height:100%;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.inrun{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
h2,h3{font-family:var(--display);font-weight:700;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:23px;color:var(--lamp)}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 0;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs .dot{position:absolute;top:1px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--lamp);color:#1b130b;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-h h2{font-family:var(--body);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.btn{background:var(--lamp);color:#1b130b;border:0;border-radius:10px;padding:12px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500}
.ghost:disabled{opacity:.4;cursor:default}
.buy{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.buy:disabled{opacity:.4;cursor:default}
.empty{margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}
.hero{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2.2;background:#0d1a1f url(../web/img/key_art.webp) center 45% / cover;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,17,20,.1), rgba(8,17,20,.9))}
.hero div{position:absolute;left:14px;right:14px;bottom:10px;z-index:1}
.hero b{font-family:var(--display);font-size:19px;display:block}
.hero span{font-size:12.5px;color:#c8d2cf}
.mine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mine.locked{opacity:.6}
.mine-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mine-h b{font-family:var(--display);font-size:19px}
.mine-h span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.mine p{margin:0;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--raise)}
.tags .gas{color:var(--gas)}.tags .water{color:var(--water)}.tags .magma{color:#ff8a4a}.tags .quake{color:#d9c39a}
.minis{display:flex;flex-wrap:wrap;gap:3px}
.minis img{width:26px;height:26px;object-fit:contain}
.ups{display:grid;gap:6px}
.up{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.up b{font-weight:600}
.up p{margin:0;font-size:12.5px;color:var(--muted)}
.lv{font-family:var(--mono);font-size:11px;color:var(--lamp)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;border-bottom:3px solid var(--rc, var(--line))}
.fc img{width:64px;height:64px;object-fit:contain}
.fc .n{font-size:12px;font-weight:600;line-height:1.2}
.fc .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.fc.dirty img{filter:brightness(.35) saturate(.4) blur(1px)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right}
.fx-in{animation:fxin .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i, 0) * 45ms)}
@keyframes fxin{from{opacity:0;transform:translateY(10px)}}

/* run */
#view{position:fixed;inset:0;z-index:5;display:block;width:100%;height:100%;touch-action:none;background:#030607}
.hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;
  background:linear-gradient(rgba(3,6,7,.8), transparent)}
.hud-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud .mn{font-family:var(--display);font-size:16px}
.hud .dp{font-family:var(--mono);font-size:13px;color:var(--anom)}
.oil{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11.5px;color:var(--lamp)}
.oil .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.oil .bar i{display:block;height:100%;background:linear-gradient(90deg, #a8601e, var(--lamp));transition:width .3s}
.oil.low{color:var(--danger)}
.oil.low .bar i{background:var(--danger)}
.hearts{font-size:15px;letter-spacing:2px;color:var(--danger)}
.hearts i{font-style:normal;color:#3a2a2a}
.warn{font-size:12.5px;color:var(--danger);min-height:1.2em;text-shadow:0 1px 4px #000}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 12px calc(14px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;align-items:center;
  background:linear-gradient(transparent, rgba(3,6,7,.85));pointer-events:none}
.bottom > *{pointer-events:auto}
.ctx{display:flex;gap:8px;width:100%;max-width:480px}
.ctx .btn{flex:1}
.ctx .ghost{background:rgba(17,36,44,.9)}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:420px;text-shadow:0 1px 4px #000}
.toastbox{position:fixed;top:calc(96px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;width:min(420px, calc(100% - 32px));pointer-events:none}
.tst{background:rgba(17,36,44,.95);border:1px solid var(--tc, var(--lamp));border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;animation:fxin .3s both;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tst img{width:36px;height:36px;object-fit:contain}
.tst b{display:block;font-size:14px}
.tst span{font-size:12.5px;color:var(--muted)}
.mineui{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:0 20px calc(110px + env(safe-area-inset-bottom, 0px));background:radial-gradient(ellipse at 50% 70%, transparent 30%, rgba(3,6,7,.6));touch-action:manipulation}
.mtitle{font-family:var(--display);font-size:20px;text-shadow:0 2px 8px #000;text-align:center}
.mtitle small{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted)}
.mbar{position:relative;width:min(88vw,380px);height:34px;border-radius:17px;background:rgba(17,36,44,.92);border:1px solid var(--line);overflow:hidden}
.mzone{position:absolute;top:0;bottom:0;background:rgba(227,168,87,.25);border-inline:2px solid rgba(227,168,87,.6)}
.mzone i{position:absolute;top:0;bottom:0;left:30%;right:30%;background:rgba(155,224,122,.45)}
.mneedle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 10px #fff}
.mhits{display:flex;gap:10px}
.mhits i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.4)}
.mhits i.p{background:#9be07a;border-color:#9be07a}.mhits i.g{background:var(--lamp);border-color:var(--lamp)}.mhits i.m{background:var(--danger);border-color:var(--danger)}
.mmsg{font-family:var(--display);font-size:22px;font-weight:700;min-height:1.3em;text-shadow:0 2px 8px #000}
.flash{position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(circle, rgba(255,200,120,.85), rgba(255,90,20,.4) 40%, transparent 70%);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.bag{display:grid;gap:3px;background:#0c1a20;border:1px solid var(--line);border-radius:10px;padding:6px;position:relative;align-self:center}
.bag .cell{width:var(--bc);height:var(--bc);border-radius:4px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.08)}
.bag .it{position:absolute;border-radius:6px;background:linear-gradient(160deg, #263f4c, #162a33);border:1px solid #3e6273;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.bag .it img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.bag .it.sel{outline:2px solid var(--lamp)}
.bag .it.new{outline:2px dashed var(--anom)}
.bag .it small{position:absolute;bottom:1px;right:3px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.pending{display:flex;gap:10px;align-items:center;background:var(--raise);border:1px dashed var(--anom);border-radius:10px;padding:8px 10px;font-size:13px}
.pending img{width:44px;height:44px;object-fit:contain}

/* overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,8,10,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-head h2{font-size:22px}
.x{background:var(--raise);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 38%, #1e3440 0%, #050b0d 72%);display:flex;flex-direction:column;align-items:center;
  padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));gap:10px;overflow:auto}
.st-top{text-align:center;margin-top:24px}
.st-top .t{font-family:var(--display);font-size:20px}
.st-top .s{font-size:12.5px;color:var(--muted)}
.arena{position:relative;width:min(70vw,270px);aspect-ratio:1;flex:none;touch-action:manipulation;user-select:none}
.arena .obj{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.65));animation:bob 3.4s ease-in-out infinite;transition:filter .4s}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
.arena.hit .obj{animation:hit .25s}
@keyframes hit{30%{transform:scale(.94) rotate(-3deg)}60%{transform:scale(1.03) rotate(1deg)}}
.cracks{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none}
.cracks path{stroke:var(--glow);stroke-width:1.8;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px var(--glow));stroke-dasharray:200;stroke-dashoffset:200;animation:draw .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dirt{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 40% 40%, rgba(70,55,40,.0), rgba(70,55,40,.0));pointer-events:none}
.rays{position:absolute;inset:-25%;border-radius:50%;background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 32%, transparent) 0 8deg, transparent 8deg 24deg);
  mask:radial-gradient(circle, #000 20%, transparent 68%);-webkit-mask:radial-gradient(circle, #000 20%, transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gem{position:absolute;inset:4%;animation:emerge .6s cubic-bezier(.2,1.5,.4,1)}
.gem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
@keyframes emerge{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.tap-hint{text-align:center;color:var(--muted);font-size:14px}
.label{background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;width:100%;max-width:420px}
.label::before{content:"";position:absolute;inset:5px;border:1px solid rgba(42,34,24,.3);pointer-events:none}
.label .no{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.label h3{font-size:22px;line-height:1.1;margin-top:2px}
.label .sub{font-family:var(--display);font-style:italic;font-size:13.5px;color:var(--ink2)}
.label dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:8px 0 0;font-size:13.5px}
.label dt{color:var(--ink2)}
.label dd{margin:0;font-weight:700}
.label .val{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:6px;border-top:1px solid rgba(42,34,24,.25);padding-top:6px;display:flex;justify-content:space-between}
.qual{color:var(--gc)}
.news{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.news div{border-radius:10px;padding:8px 12px;font-size:13.5px;background:color-mix(in srgb, var(--lamp) 18%, transparent);border:1px solid var(--lamp);color:var(--lamp);font-weight:600;animation:fxin .35s both}
.fxc{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
.nogl{padding:30px;text-align:center}

/* mobile controls */
.joy{position:fixed;z-index:11;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(227,168,87,.35);background:rgba(17,36,44,.35);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(227,168,87,.55);box-shadow:0 0 14px rgba(227,168,87,.5)}
.hzc{font-family:var(--body);font-size:11.5px;border:1px solid var(--hc);color:var(--hc);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.tags .rich{background:color-mix(in srgb, var(--lamp) 22%, transparent);color:var(--lamp);font-weight:600}
.hzcard{display:flex;gap:12px;align-items:center;background:var(--raise);border:1px solid var(--hc);border-radius:12px;padding:12px}
.hzcard b{font-family:var(--display);font-size:20px;color:var(--hc);display:block}
.hzcard i{font-style:normal;font-size:30px}
.mineui .ghost{background:rgba(17,36,44,.9)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app" id="campApp">
  <header class="top">
    <div class="brand">Выработка<small>спуститься, найти, вынести</small></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="pill" id="money">0 ₽</span><button type="button" class="icon-btn" id="mute" aria-label="Звук">🔊</button></div>
  </header>
  <section id="camp" style="display:flex;flex-direction:column;gap:10px"></section>
</div>

<canvas id="view" hidden></canvas>
<div class="hud" id="hud" hidden>
  <div class="hud-r"><span class="mn" id="hMine"></span><span class="dp" id="hDepth">0 м</span></div>
  <div class="oil" id="hOil"><span>Масло</span><div class="bar"><i id="hOilBar"></i></div><span id="hOilTxt">100%</span></div>
  <div class="hud-r"><span class="hearts" id="hHearts"></span><span class="pill" id="hBag">рюкзак 0/16</span></div>
  <div class="warn" id="hWarn"></div>
</div>
<div class="toastbox" id="toasts"></div>
<div class="bottom" id="bottom" hidden>
  <div class="ctx" id="ctx"></div>
  <div class="hint" id="hint">Ведите пальцем — шахтёр идёт следом. Остановитесь у блеска в стене — начнётся добыча.</div>
</div>
<div class="mineui" id="mineUI" hidden>
  <div class="mmsg" id="mMsg"></div>
  <div class="mtitle" id="mTitle"></div>
  <div class="mbar"><div class="mzone" id="mZone"><i></i></div><div class="mneedle" id="mNeedle"></div></div>
  <div class="mhits" id="mHits"><i></i><i></i><i></i></div>
  <div class="hint">Тап в любом месте, когда игла в светлой зоне. В центре — чисто.</div>
  <button type="button" class="ghost" data-cancel>Отойти</button>
</div>
<div class="joy" id="joy" hidden><i id="joyKnob"></i></div>
<div id="stage" class="stage" hidden></div>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel"></div></div>
<canvas class="fxc" id="fxc" aria-hidden="true"></canvas>

<script>
/* ===================== data ===================== */
const IMG = n => `../web/img/${n}.webp`;
const AMETHYST = 'sepia(.5) saturate(4) hue-rotate(225deg) brightness(.95)';
const SP = {
  quartz:{n:'Горный хрусталь', img:'quartz', c:0xdfe8f2, v:20, r:0},
  amethyst:{n:'Аметист', img:'quartz', fl:AMETHYST, c:0xb47cff, v:60, r:1},
  calcite:{n:'Кальцит', img:'quartz', fl:'sepia(.6) saturate(1.8) hue-rotate(-15deg) brightness(1.05)', c:0xf2c27a, v:15, r:0},
  fluorite:{n:'Флюорит', img:'fluorite', c:0x5fe0a0, v:35, r:1},
  malachite:{n:'Малахит', img:'malachite', c:0x43c98a, v:30, r:0},
  azurite:{n:'Азурит', img:'malachite', fl:'hue-rotate(85deg) saturate(1.4)', c:0x5f8bff, v:55, r:1},
  gypsum:{n:'Селенит', img:'gypsum', c:0xe6eef6, v:15, r:0},
  pyrite:{n:'Пирит', img:'gold', fl:'saturate(.45) brightness(.85) contrast(1.1)', c:0xc9b26a, v:25, r:0},
  gold:{n:'Самородное золото', img:'gold', c:0xffd24a, v:250, r:2, metal:true},
  garnet:{n:'Альмандин', img:'garnet', c:0xe0566a, v:70, r:1},
  beryl:{n:'Берилл', img:'beryl', c:0xe6dd8a, v:90, r:1},

const W = 13, H = 62;

const idx = (x, y) => y * W + x;
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function genLevel(mine, hz, rich){
  // the descent goes down the screen: a lift chamber, then compact chambers linked by winding shafts
  const g = new Uint8Array(W * H); // 0 rock, 1 floor, 2 magma
  const lift = {x:Math.floor(W / 2), y:2};

    }

    if (!deep.length) break;

    const pool = [c];
    if (Math.random() < .6) { const n = c + (Math.random() < .5 ? 1 : W); if (g[n] === 1) pool.push(n); }

    const kind = pickW([['crystal', 36], ['druse', 22], ['geode', 10 + d * 22], ['nugget', mine.pool.gold ? 12 : 0]]);

  for (let k = 0; k < (hz === 'gas' ? mine.gas + 2 : 0) && gcand.length; k++) { const i = gcand.splice(ri(0, gcand.length - 1), 1)[0]; lv.gas.push({x:i % W, y:Math.floor(i / W), r:1.5, mesh:null, alive:true}); }

}

  if (prev[to] < 0) return null;
  const out = []; for (let i = to; i !== from; i = prev[i]) out.unshift(i);
  return out;
}

  camera.position.z += (S.pos.z + 1 + CAM.back - camera.position.z) * Math.min(1, dt * 4) + (Math.random() - .5) * sh;

/* ===================== mining minigame ===================== */
let MG = null;
function startMining(dep){

  const zw = [.22, .27, .33, .4][save.up.pick];
  MG = {dep, hits:[], t:0, zc:rnd(.25, .75), zw, raf:0, speed:rnd(2.2, 2.8)};
  const ui = $('#mineUI'); ui.hidden = false; $('#bottom').hidden = true;
  $('#mTitle').innerHTML = `${dep.kind === 'geode' ? 'Жеода в стене' : `${KIND[dep.kind].n}: ${SP[dep.sid].n.toLowerCase()}`}<small>${dep.kind === 'geode' ? 'что внутри — узнаете в лагере' : RAR[SP[dep.sid].r].toLowerCase()}</small>`;
  $('#mZone').style.left = ((MG.zc - zw / 2) * 100) + '%'; $('#mZone').style.width = (zw * 100) + '%';
  $('#mHits').innerHTML = '<i></i><i></i><i></i>'; $('#mMsg').textContent = '';
  const step = () => { if (!MG) return; MG.t += 1 / 60; const p = (Math.sin(MG.t * MG.speed * (1 + MG.hits.length * .25)) + 1) / 2; MG.p = p; $('#mNeedle').style.left = (p * 100) + '%'; MG.raf = requestAnimationFrame(step); };
  step();
}
function strike(){
  if (!MG || MG.hits.length >= 3) return;
  const d = Math.abs(MG.p - MG.zc) / (MG.zw / 2);
  const h = d < .3 ? 'p' : d < 1 ? 'g' : 'm';
  MG.hits.push(h);
  $('#mHits').children[MG.hits.length - 1].className = h;
  ({p:SFX.perfect, g:SFX.good, m:SFX.miss})[h]();
  $('#mMsg').textContent = {p:'Чисто!', g:'Хорошо', m:'Мимо'}[h];
  $('#mMsg').style.color = {p:'#9be07a', g:'var(--lamp)', m:'var(--danger)'}[h];
  const [x, y] = elXY($('#mNeedle'));
  burst(x, y, {n:10, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:4, grav:.3, size:4, kind:'chip'});
  S.shake = .15;
  // an iron pick throws sparks; gas nearby can catch
  const gas = L.gas.find(g => g.alive && Math.hypot(wx(g.x) - S.pos.x, wz(g.y) - S.pos.z) < g.r + .6);
  if (gas && Math.random() < (h === 'm' ? .45 : .2) / (save.up.gas >= 2 ? 2 : 1)) return explode(gas);
  if (MG.hits.length >= 3) setTimeout(finishMining, 450);
}
function explode(gas){
  cancelAnimationFrame(MG.raf); MG = null; $('#mineUI').hidden = true; $('#bottom').hidden = false; S.mode = 'walk';
  gas.alive = false; scene.remove(gas.mesh);
  SFX.boom(); S.shake = 1.2;
  const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 800);
  const lost = S.bag.items.length ? S.bag.items.splice(ri(0, S.bag.items.length - 1), 1)[0] : null;
  toast('Взрыв газа!', lost ? `Искра от кайла. В суматохе потеряно: ${itemName(lost).toLowerCase()}.` : 'Искра от кайла подожгла газ.', '', 'var(--danger)');
  hurt('Вас отбросило взрывом');
  hud(); ctx();
}
function finishMining(){
  if (!MG) return;
  cancelAnimationFrame(MG.raf);
  const dep = MG.dep, score = MG.hits.reduce((s, h) => s + (h === 'p' ? 2 : h === 'g' ? 1 : 0), 0), misses = MG.hits.filter(h => h === 'm').length;
  MG = null; $('#mineUI').hidden = true; $('#bottom').hidden = false; S.mode = 'walk';
  let w = 1, h = 1, cracked = false;

  if (dep.kind === 'druse') { if (score >= 4) { w = 2; h = 2; } else if (score >= 2) h = 2; }
  if (dep.kind === 'nugget' && score >= 5) w = 2;
  if (dep.kind === 'geode') { w = 2; h = 2; if (misses && Math.random() < .35 * misses) { cracked = true; w = 1; h = 1; } }
  const item = {id:nid(), kind:dep.kind, sid:dep.sid, w, h, q:score, d:dep.d, depth:Math.round(Math.max(0, L.dist[dep.face]) * 4.5), mine:S.mine.id, cracked};
  scene.remove(dep.mesh); dep.mesh = null;
  const r = dep.sid ? SP[dep.sid].r : 2;
  SFX.got(r);
  const sizeTxt = w * h === 1 ? (score < 2 && dep.kind !== 'nugget' ? 'обломок' : 'мелкий') : w * h >= 4 ? 'крупный' : 'средний';
  toast(itemName(item), `${sizeTxt}, ${w}×${h} · ${['', 'неплохо', 'аккуратно', 'отлично'][Math.min(3, Math.ceil(score / 2))] || 'грубая работа'}`, itemImg(item), dep.sid ? hex(SP[dep.sid].c) : '#c690ff');

}
function startClear(i){ S.mode = 'clear'; S.path = []; S.clearing = {i, t:0}; toast('Разбираете завал…', 'Пара секунд', '', '#d9c39a'); SFX.miss(); }

/* ===================== backpack ===================== */
function fits(bag, it, x, y, w, h, ignore){
  if (x < 0 || y < 0 || x + w > bag.cols || y + h > bag.rows) return false;
  return !bag.items.some(o => o !== ignore && o !== it && x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h);
}
function place(bag, it){
  for (const [w, h] of [[it.w, it.h], [it.h, it.w]]) for (let y = 0; y < bag.rows; y++) for (let x = 0; x < bag.cols; x++) if (fits(bag, it, x, y, w, h)) { it.x = x; it.y = y; it.w = w; it.h = h; bag.items.push(it); return true; }
  return false;
}
function repack(){
  // greedy repack by size; if anything no longer fits, keep the old layout
  const before = S.bag.items.map(it => ({it, x:it.x, y:it.y, w:it.w, h:it.h}));
  const all = S.bag.items.slice().sort((a, b) => b.w * b.h - a.w * a.h); S.bag.items = [];
  const left = all.filter(it => !place(S.bag, it));
  if (left.length) { S.bag.items = before.map(b => Object.assign(b.it, {x:b.x, y:b.y, w:b.w, h:b.h})); return false; }
  return true;
}

  const sel = b.items.find(it => it.id === bagSel);

    ${grid}
    ${sel ? `<div class="two"><span style="font-size:13.5px">${itemName(sel)} · ${sel.w}×${sel.h}</span><button type="button" class="ghost" data-drop="${sel.id}">Выбросить</button></div>` : '<p class="muted" style="margin:0;font-size:12.5px">Нажмите на находку, чтобы выбрать её. Разные находки занимают разное место: жеода 2×2, крупный кристалл 1×3.</p>'}

}

/* ===================== processing finds (the reveal) ===================== */
const stage = $('#stage');
let ST = null;
function crackPaths(seed, count){
  const rand = mulberry(seed), out = [];
  for (let k = 0; k < count; k++) { let x = 50 + (rand() - .5) * 10, y = 50 + (rand() - .5) * 10; const a0 = rand() * Math.PI * 2; let d = `M${x.toFixed(1)},${y.toFixed(1)}`;
    for (let s = 0; s < 5; s++) { const a = a0 + (rand() - .5) * 1.1, len = 5 + rand() * 6; x += Math.cos(a) * len; y += Math.sin(a) * len; d += ` L${x.toFixed(1)},${y.toFixed(1)}`; } out.push(d); }
  return out;
}
function resolveFind(it){
  const mine = MINEM[it.mine];
  let sid = it.sid;
  if (it.kind === 'geode') sid = pickW(Object.entries(mine.geo).map(([s, w]) => [s, w * Math.pow(1 + it.d * 2, SP[s].r)]));
  const luck = 1 + it.d * 1.4 + it.q * .12;
  const gi = pickW(GR.map((g, k) => [k, g.w * Math.pow(luck, k * .55)]));
  const area = it.w * it.h, sizeM = [0, 1, 2.2, 3.6, 5.2, 6, 7.5][area] || 7;
  const value = Math.round(SP[sid].v * sizeM * GR[gi].m * (it.kind === 'geode' ? (it.cracked ? 1.1 : 1.8) : 1));
  return {sid, gi, value};
}
function openFind(id){
  const it = save.finds.find(x => x.id === id); if (!it) return;
  if (!it.res) { it.res = resolveFind(it); persist(); }
  ST = {it, phase:0, busy:false};
  const geo = it.kind === 'geode';
  stage.hidden = false;
  stage.innerHTML = `<div class="st-top"><div class="t">${itemName(it)}</div><div class="s">${MINEM[it.mine].name} · ${it.depth} м · ${it.w}×${it.h}</div></div>
    <button type="button" class="arena" id="arena" style="--glow:${geo ? '#c690ff' : hex(SP[it.res.sid].c)};border:0;background:transparent;padding:0" aria-label="${geo ? 'Расколоть' : 'Расчистить'}">
      ${geo ? `<img class="obj" src="${IMG('nodule')}" alt="">` : `<img class="obj" id="dirtyImg" src="${IMG(SP[it.res.sid].img)}" alt="" style="filter:${SP[it.res.sid].fl ? SP[it.res.sid].fl + ' ' : ''}brightness(.25) saturate(.3) blur(2px)">`}
      <svg class="cracks" id="cracks" viewBox="0 0 100 100" aria-hidden="true"></svg></button>
    <div class="tap-hint" id="stHint">${geo ? 'Нажимайте, чтобы расколоть жеоду' : 'Нажимайте, чтобы расчистить образец от породы'}</div>
    <div id="stOut" style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:center"></div>`;
}
function hitFind(){
  if (!ST || ST.busy || ST.phase >= 3) return;
  const it = ST.it, geo = it.kind === 'geode', a = $('#arena');
  ST.phase++;
  anim(a, 'hit');
  const [x, y] = elXY(a);
  if (geo) { SFX.crack(ST.phase); $('#cracks').innerHTML = crackPaths(it.id, ST.phase * 2 + 1).map(d => `<path d="${d}"/>`).join(''); burst(x, y, {n:8 + ST.phase * 6, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:3 + ST.phase * 1.4, grav:.3, size:5, kind:'chip'}); }
  else { SFX.brush(); const k = ST.phase; const sp = SP[it.res.sid]; $('#dirtyImg').style.filter = `${sp.fl ? sp.fl + ' ' : ''}brightness(${.25 + k * .22}) saturate(${.3 + k * .23}) blur(${2 - k * .7}px)`; burst(x, y, {n:12, colors:['rgba(140,110,80,.7)', 'rgba(90,70,50,.6)'], speed:3, grav:.15, size:4, kind:'chip'}); }
  if (ST.phase === 2 && SP[it.res.sid].r >= 2) a.style.setProperty('--glow', RC[SP[it.res.sid].r]);
  if (ST.phase >= 3) { ST.busy = true; setTimeout(revealFind, 250); }
}
function revealFind(){
  const it = ST.it, res = it.res, sp = SP[res.sid], tier = Math.min(4, sp.r + (res.gi >= 3 ? 1 : 0));
  const a = $('#arena');
  a.style.setProperty('--rc', RC[tier]);
  a.innerHTML = `<div class="rays"></div><div class="gem">${imgTag(res.sid)}</div>`;
  SFX.reveal(tier);
  const [x, y] = elXY(a);
  burst(x, y, {n:26, colors:['#8a7660', '#5e4e3e', '#b09a80'], speed:8, grav:.35, size:7, kind:'chip'});
  burst(x, y, {n:20 + tier * 14, colors:[RC[tier], '#ffffff'], speed:4 + tier, size:3.5});
  $('#stHint').textContent = '';
  const news = [];
  if (!save.st.best || res.value > save.st.best.value) { if (save.st.best) news.push(`Лучшая находка за всё время: ${fmt(res.value)} ₽`); save.st.best = {name:sp.n, value:res.value}; }
  save.st.opened++; persist();
  $('#stOut').innerHTML = `<div class="label"><div class="no"><span>№ ${String(it.id).padStart(5, '0')}</span><span>${RAR[sp.r].toLowerCase()}</span></div><h3>${sp.n}</h3>
      <div class="sub">${it.kind === 'geode' ? 'из жеоды · ' : ''}${MINEM[it.mine].place}, ${it.depth} м</div>
      <dl><dt>Размер</dt><dd>${it.w}×${it.h}${it.cracked ? ', треснула при добыче' : ''}</dd><dt>Качество</dt><dd><span class="qual" style="--gc:${GR_C[res.gi]}">${GR[res.gi].n}</span></dd><dt>Добыча</dt><dd>${['грубая', 'грубая', 'неплохая', 'неплохая', 'аккуратная', 'аккуратная', 'безупречная'][it.q]}</dd></dl>
      <div class="val"><span>Оценка</span><span>${fmt(res.value)} ₽</span></div></div>
    ${news.length ? `<div class="news">${news.map(n => `<div>★ ${n}</div>`).join('')}</div>` : ''}
    <div class="two" style="width:100%"><button type="button" class="ghost" data-keep>В коллекцию</button><button type="button" class="btn" data-sell>Продать · ${fmt(res.value)} ₽</button></div>`;
}
function decideFind(keep){
  const it = ST.it, res = it.res;
  save.finds = save.finds.filter(x => x.id !== it.id);
  if (keep) save.coll.push({id:it.id, sid:res.sid, gi:res.gi, value:res.value, mine:it.mine, depth:it.depth, size:`${it.w}×${it.h}`});
  else { save.money += res.value; SFX.coin(); }
  persist();
  const next = save.finds[0];
  if (next) openFind(next.id); else { stage.hidden = true; ST = null; renderCamp(); }
  $('#money').textContent = fmt(save.money) + ' ₽';
}

/* ===================== sheets & events ===================== */
const sheet = $('#sheet'), panel = $('#panel');
function openPanel(html){ panel.innerHTML = html; sheet.hidden = false; panel.scrollTop = 0; }
function closeSheet(){ sheet.hidden = true; }
const head = (e, t) => `<div class="p-head"><div><div class="eyebrow">${e}</div><h2>${t}</h2></div><button type="button" class="x" data-close aria-label="Закрыть">✕</button></div>`;
function openHelp(){
  save.help = true; persist();
  openPanel(`${head('Как играть', 'Выработка')}<ul class="help">
    <li>Шахта уходит вниз по экрану: пять камер, чем ниже, тем богаче. Спуск длится пару минут — столько хватает масла.</li>
    <li>Ведите пальцем по экрану — появится джойстик. Короткий тап по проходу или по блеску — шахтёр пойдёт туда сам. На компьютере — WASD или стрелки.</li>
    <li>Остановитесь у блеска в стене — начнётся добыча: три тапа в любом месте экрана, когда игла в светлой зоне. Чем точнее, тем крупнее и целее находка.</li>
    <li>У каждого спуска своя главная опасность — газ, вода или толчки. Её показывают перед спуском.</li>
    <li>Рюкзак ограничен: находки разного размера. Решайте, что нести наверх.</li>
    <li>Масло в фонаре кончается, свет сжимается. Газ взрывается от искры кайла, вода прибывает, толчки заваливают проходы, у магмы жарко.</li>
    <li>Подняться можно только на лифте. Если силы кончатся, спасатели вынесут вас, но рюкзак останется внизу.</li>
    <li>В лагере жеоды раскалывают, а остальное расчищают от породы — только там видно качество и цену.</li></ul>
    <button type="button" class="btn" data-close>Понятно</button>`);
}
$('#mute').addEventListener('click', () => { save.mute = !save.mute; persist(); renderCamp(); });
$('#camp').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; return renderCamp(); }
  const r = e.target.closest('[data-run]');
  if (r) {
    const m = MINEM[r.dataset.run], hz = m.hz[ri(0, m.hz.length - 1)], mins = Math.round(100 * (1 + .35 * save.up.lamp) / (.62 * m.oil) / 60 * 10) / 10;
    return openPanel(`${head(m.place, m.name)}
      <div class="hzcard" style="--hc:${HZ[hz].c}"><i>${HZ[hz].i}</i><div><span class="eyebrow">Опасность этого спуска</span><b>${HZ[hz].n}</b><span style="font-size:13.5px">${HZ[hz].d}</span></div></div>
      ${m.magma ? '<p style="margin:0;font-size:13.5px;color:#ff8a4a">И, как всегда, магма на глубине: рядом с ней жарко, зато попадаются рубины и алмазы.</p>' : ''}
      ${isRich(m.id) ? '<p style="margin:0;font-size:13.5px;color:var(--lamp)">★ Сегодня здесь богатый забой: редкие минералы встречаются чаще.</p>' : ''}
      <div class="rows"><div class="row"><span>Масла в фонаре</span><span>≈ ${String(mins).replace('.', ',')} мин</span></div><div class="row"><span>Рюкзак</span><span>${BAGS[save.up.bag].join('×')}</span></div><div class="row"><span>Каски</span><span>${3 + save.up.helmet}</span></div></div>
      <button type="button" class="btn" data-go="${m.id}:${hz}">Спуститься</button>`);
  }
  const u = e.target.closest('[data-unlock]'); if (u) { const m = MINEM[u.dataset.unlock]; if (save.money >= m.cost) { save.money -= m.cost; save.open[m.id] = true; SFX.coin(); persist(); renderCamp(); } return; }
  const f = e.target.closest('[data-find]'); if (f) return openFind(+f.dataset.find);
  if (e.target.closest('[data-findall]')) { if (save.finds[0]) openFind(save.finds[0].id); return; }
  const up = e.target.closest('[data-up]'); if (up) { const def = UPS.find(x => x.id === up.dataset.up), lv = save.up[def.id]; if (lv < def.cost.length && save.money >= def.cost[lv]) { save.money -= def.cost[lv]; save.up[def.id]++; SFX.coin(); persist(); renderCamp(); } return; }
  const c = e.target.closest('[data-coll]');
  if (c) { const s = save.coll.find(x => x.id === +c.dataset.coll); if (!s) return; openPanel(`${head(RAR[SP[s.sid].r], SP[s.sid].n)}<div style="display:grid;place-items:center">${imgTag(s.sid, 'width:min(50vw,180px);aspect-ratio:1;object-fit:contain')}</div>
      <div class="rows"><div class="row"><span>Качество</span><span>${GR[s.gi].n}</span></div><div class="row"><span>Размер</span><span>${s.size}</span></div><div class="row"><span>Откуда</span><span>${MINEM[s.mine].name}, ${s.depth} м</span></div><div class="row"><span>Оценка</span><span>${fmt(s.value)} ₽</span></div></div>
      <button type="button" class="ghost" data-sellcoll="${s.id}">Продать · ${fmt(s.value)} ₽</button>`); return; }
  if (e.target.closest('[data-help]')) return openHelp();
  const rs = e.target.closest('[data-reset]'); if (rs) { if (rs.dataset.armed) { save = BLANK(); save.help = true; persist(); renderCamp(); } else { rs.dataset.armed = 1; rs.textContent = 'Нажмите ещё раз, чтобы стереть всё'; } }
});
$('#bottom').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !S) return;
  const act = a.dataset.act;
  if (act === 'mine') { const dep = L.deps[+a.dataset.dep]; if (dep) { if (S.cell !== dep.face && dep.face !== undefined) goTo(dep.face, {dep}); else startMining(dep); } }
  if (act === 'clear') startClear(+a.dataset.rub);
  if (act === 'up') ascend();
  if (act === 'home') goTo(idx(L.lift.x, L.lift.y), null);
  if (act === 'bag') { bagSel = null; openBag(); }
});
$('#mineUI').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.target.closest('[data-cancel]')) { if (!MG) return; cancelAnimationFrame(MG.raf); S.skipDep = MG.dep.id; MG = null; $('#mineUI').hidden = true; $('#bottom').hidden = false; S.mode = 'walk'; return; }
  strike();
});
stage.addEventListener('click', e => {
  if (e.target.closest('#arena')) return hitFind();
  if (e.target.closest('[data-keep]')) return decideFind(true);
  if (e.target.closest('[data-sell]')) return decideFind(false);
});
sheet.addEventListener('click', e => {
  const bi = e.target.closest('[data-bit]'); if (bi) { bagSel = +bi.dataset.bit; return openBag(); }
  const dr = e.target.closest('[data-drop]');
  if (dr) { S.bag.items = S.bag.items.filter(it => it.id !== +dr.dataset.drop); bagSel = null; if (S.pending && place(S.bag, S.pending)) { toast('Уложено', itemName(S.pending), itemImg(S.pending)); S.pending = null; } hud(); return openBag(); }
  if (e.target.closest('[data-repack]')) { const pend = S.pending; repack(); if (pend && place(S.bag, pend)) { S.pending = null; } hud(); return openBag(); }
  if (e.target.closest('[data-leave]')) { S.pending = null; closeSheet(); return; }
  const go = e.target.closest('[data-go]'); if (go) { const [id, hz] = go.dataset.go.split(':'); closeSheet(); return newRun(id, hz); }
  const sc = e.target.closest('[data-sellcoll]'); if (sc) { const s = save.coll.find(x => x.id === +sc.dataset.sellcoll); if (s) { save.coll = save.coll.filter(x => x !== s); save.money += s.value; SFX.coin(); persist(); closeSheet(); renderCamp(); } return; }
  if (e.target === sheet || e.target.closest('[data-close]')) { if (S && S.pending) S.pending = null; closeSheet(); }
});
const KEYMAP = {ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right'};
addEventListener('keydown', e => {
  if (!sheet.hidden && e.key === 'Escape') return closeSheet();
  if (!stage.hidden && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); return hitFind(); }
  if (!S) return;
  if (S.mode === 'mining' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); return strike(); }
  const k = KEYMAP[e.code]; if (k && sheet.hidden) { S.keys[k] = true; e.preventDefault(); }
  if (e.key === 'e' || e.key === 'E') { const dep = adjDep(); if (dep && S.mode === 'walk') startMining(dep); }
});
addEventListener('keyup', e => { if (!S) return; const k = KEYMAP[e.code]; if (k) S.keys[k] = false; });

renderCamp();
if (!save.help) openHelp();
</script>
